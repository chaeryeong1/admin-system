[build]
  functions = "netlify/functions"
  publish = "admin-system-html"

[dev]
  functions = "netlify/functions"
  publish = "admin-system-html"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200 