<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업관리시스템 - 파일 업로드</title>
  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1, h2 {
      color: #333;
      text-align: center;
    }
    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .upload-form {
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 10px 0;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    .check-btn {
      background-color: #607D8B;
      margin-bottom: 15px;
    }
    .check-btn:hover {
      background-color: #455A64;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #2e7d32;
    }
    .error {
      background-color: #fbe9e7;
      border: 1px solid #ffccbc;
      color: #d32f2f;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0,0,0,.1);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>사업관리시스템 - 파일 업로드</h1>
  
  <div class="container">
    <h2>사업자등록증 업로드</h2>
    <p>이 페이지에서 사업자등록증 파일을 NAS에 직접 업로드할 수 있습니다.</p>
    
    <button id="checkConnection" class="check-btn">NAS 연결 상태 확인</button>
    <div id="connectionResult" class="result"></div>
    
    <div class="upload-form">
      <form id="uploadForm">
        <div class="form-group">
          <label for="file">파일 선택:</label>
          <input type="file" id="file" name="file" required>
        </div>
        <button type="submit">업로드</button>
      </form>
      <div id="uploadResult" class="result"></div>
    </div>
  </div>

  <div class="container">
    <h2>다른 방법으로 파일 접근하기</h2>
    <p>아래 버튼을 통해 NAS 폴더에 직접 접근할 수도 있습니다:</p>
    
    <div style="text-align: center; margin: 20px 0;">
      <button onclick="openWindowsExplorer()">Windows 파일 탐색기로 열기</button>
      <button onclick="copyNasPath()" style="background-color: #2196F3; margin-left: 10px;">경로 복사하기</button>
      <button onclick="openDsmFileStation()" style="background-color: #ff9800; margin-left: 10px;">시놀로지 DSM 열기</button>
    </div>
    
    <h3>NAS 폴더 경로</h3>
    <div style="background-color: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 4px; font-family: Consolas, monospace; margin: 20px 0; word-break: break-all;">
      \\192.168.219.62\정보보안사업부_공동작업\2025_사업관리 시스템(아크리움)\첨부파일
    </div>
  </div>

  <script>
    // NAS 연결 상태 확인
    document.getElementById('checkConnection').addEventListener('click', async function() {
      const resultElement = document.getElementById('connectionResult');
      resultElement.innerHTML = '<div class="loading"></div> NAS 연결 확인 중...';
      resultElement.style.display = 'block';
      resultElement.className = 'result';
      
      try {
        const response = await fetch('/check-connection');
        const data = await response.json();
        
        if (data.success) {
          resultElement.innerHTML = '✅ NAS 연결 성공! 파일 업로드를 진행할 수 있습니다.';
          resultElement.className = 'result success';
        } else {
          resultElement.innerHTML = `❌ NAS 연결 실패: ${data.message || '알 수 없는 오류'}`;
          resultElement.className = 'result error';
        }
      } catch (error) {
        resultElement.innerHTML = `❌ 서버 연결 오류: ${error.message}`;
        resultElement.className = 'result error';
      }
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const fileInput = document.getElementById('file');
      const resultElement = document.getElementById('uploadResult');
      
      if (!fileInput.files || fileInput.files.length === 0) {
        showResult('업로드할 파일을 선택해주세요.', false);
        return;
      }
      
      // 업로드 진행 상태 표시
      showResult('<div class="loading"></div> 파일 업로드 중...', null);
      
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      
      try {
        const response = await fetch('/upload-to-nas', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
          showResult(`✅ ${data.message}<br>파일명: ${data.filename}`, true);
        } else {
          showResult(`❌ ${data.message}<br>오류: ${data.error}`, false);
          
          // 추가 정보로 다른 방법 안내
          showResult(`
            <p><strong>파일 업로드 중 오류가 발생했습니다.</strong></p>
            <p>다음 대체 방법을 사용해 보세요:</p>
            <ol>
              <li>Windows 파일 탐색기로 직접 파일을 복사하세요.</li>
              <li>시놀로지 DSM 웹 인터페이스에서 업로드하세요.</li>
            </ol>
            <button onclick="openWindowsExplorer()" style="margin-top: 10px;">Windows 파일 탐색기로 열기</button>
            <button onclick="openDsmFileStation()" style="background-color: #ff9800; margin-left: 10px; margin-top: 10px;">시놀로지 DSM 열기</button>
          `, false);
        }
      } catch (error) {
        showResult(`❌ 서버 연결 오류: ${error.message}`, false);
        console.error('업로드 오류:', error);
      }
    });
    
    function showResult(message, isSuccess) {
      const resultElement = document.getElementById('uploadResult');
      resultElement.innerHTML = message;
      resultElement.style.display = 'block';
      
      if (isSuccess === true) {
        resultElement.className = 'result success';
      } else if (isSuccess === false) {
        resultElement.className = 'result error';
      } else {
        resultElement.className = 'result';
      }
    }
    
    function openWindowsExplorer() {
      window.location.href = "file:////192.168.219.62/정보보안사업부_공동작업/2025_사업관리 시스템(아크리움)/첨부파일";
    }
    
    function copyNasPath() {
      const path = "\\\\192.168.219.62\\정보보안사업부_공동작업\\2025_사업관리 시스템(아크리움)\\첨부파일";
      
      if (navigator.clipboard) {
        navigator.clipboard.writeText(path)
          .then(() => {
            alert("NAS 경로가 클립보드에 복사되었습니다.");
          })
          .catch(err => {
            alert("클립보드 복사 실패: " + err);
          });
      } else {
        const textArea = document.createElement("textarea");
        textArea.value = path;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
        alert("NAS 경로가 클립보드에 복사되었습니다.");
      }
    }
    
    function openDsmFileStation() {
      window.open("http://192.168.219.62:5000", "_blank");
    }
  </script>
</body>
</html>
