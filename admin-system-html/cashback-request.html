<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 송금 요청</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="business-notification.html" class="text-gray-500">사업 안내</a>
    <a href="cashback-management.html" class="text-blue-600">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">캐시백 송금</h2>
      <ul class="space-y-2">
        <li><a href="cashback-management.html" class="text-gray-600 hover:text-gray-900">ㆍ송금 관리</a></li>
        <li><a href="cashback-request.html" class="text-blue-600 font-semibold">ㆍ송금 요청</a></li>
        <li><a href="cashback-approval.html" class="text-gray-600 hover:text-gray-900">ㆍ송금 승인</a></li>
        <li><a href="cashback-transfer.html" class="text-gray-600 hover:text-gray-900">ㆍ송금 처리</a></li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">송금 요청</div>

      <!-- 검색/필터링 -->
      <div class="flex items-center space-x-4">
        <select 
          id="businessFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 사업</option>
          <option value="클라우드 보급사업">클라우드 보급사업</option>
        </select>
        <input 
          id="searchInput"
          type="text" 
          placeholder="기업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">선택</th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="companyName">기업명 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="bankInfo">계좌정보 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="amount">금액 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="requestDate">요청일 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="status">상태 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left">작업</th>
              </tr>
            </thead>
            <tbody id="requestTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
        
        <!-- 페이지네이션 -->
        <div class="px-4 py-3 flex items-center justify-between border-t">
          <div class="flex-1 flex justify-between items-center">
            <div>
              <span class="text-sm text-gray-700">
                총 <span id="totalItems">0</span>개 항목 중 <span id="startItem">0</span>-<span id="endItem">0</span>
              </span>
            </div>
            <div>
              <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                <button id="prevPageBtn" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                  <span class="sr-only">이전</span>
                  <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                  </svg>
                </button>
                <div id="paginationNumbers" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">
                  <!-- 페이지 번호가 여기에 동적으로 추가됩니다 -->
                </div>
                <button id="nextPageBtn" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                  <span class="sr-only">다음</span>
                  <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                  </svg>
                </button>
              </nav>
            </div>
          </div>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="cancelButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          요청 취소
        </button>
      </div>
    </div>
  </div>

  <!-- 요청 취소 확인 모달 -->
  <div id="cancelModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">송금 요청 취소</h2>
      <p>다음 기업에 대한 송금 요청을 취소하시겠습니까?</p>
      <p id="cancelCompanyName" class="font-semibold mt-2"></p>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelModalNoButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          아니오
        </button>
        <button 
          id="confirmCancelButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          예, 취소합니다
        </button>
      </div>
    </div>
  </div>

  <script>
    // 상태 관리
    let requests = [];
    let selectedRequestId = null;
    
    // 페이지네이션 상태
    let currentPage = 1;
    const itemsPerPage = 20;
    let totalPages = 0;
    
    // 정렬 상태
    let currentSort = {
      field: null,
      direction: 'asc' // 'asc' 또는 'desc'
    };

    async function loadRequests() {
      console.log('요청 데이터 로딩 시작');
      document.getElementById('requestTableBody').innerHTML = 
        '<tr><td colspan="7" class="px-4 py-2 text-center">데이터를 불러오는 중입니다...</td></tr>';
      
      try {
        // API를 통해 데이터 가져오기
        const result = await fetchData('송금요청');
        console.log('API 결과:', result);
        
        if (result && result.data && Array.isArray(result.data) && result.data.length > 0) {
          requests = result.data;
          console.log(`${requests.length}개의 송금 요청 로드됨`);
        } else {
          console.log('유효한 데이터가 없어 샘플 데이터를 사용합니다.');
          // 샘플 데이터
          requests = [
            {
              id: "1",
              companyName: "(주)클라우드솔루션",
              bankInfo: "신한은행 123-456-789 (주)클라우드솔루션",
              amount: 5000000,
              requestDate: "2025-02-15",
              status: "요청완료"
            },
            {
              id: "2",
              companyName: "디지털테크(주)",
              bankInfo: "국민은행 987-654-321 디지털테크(주)",
              amount: 7500000,
              requestDate: "2025-02-10",
              status: "검토중"
            },
            {
              id: "3",
              companyName: "스마트비즈니스(주)",
              bankInfo: "우리은행 555-555-555 스마트비즈니스",
              amount: 12000000,
              requestDate: "2025-02-05",
              status: "승인완료"
            }
          ];
        }
        renderRequests();
      } catch (error) {
        console.error('송금 요청 데이터 로드 중 오류 발생:', error);
        document.getElementById('requestTableBody').innerHTML = 
          '<tr><td colspan="7" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
      }
    }

    function renderRequests() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      
      let filteredRequests = requests.filter(request => {
        const matchSearch = request.companyName.toLowerCase().includes(searchTerm);
        const matchStatus = !statusFilter || request.status === statusFilter;
        return matchSearch && matchStatus;
      });
      
      // 정렬 적용
      if (currentSort.field) {
        filteredRequests.sort((a, b) => {
          let aValue = a[currentSort.field];
          let bValue = b[currentSort.field];
          
          // 날짜인 경우 특별 처리
          if (currentSort.field === 'requestDate') {
            const dateA = new Date(aValue);
            const dateB = new Date(bValue);
            return currentSort.direction === 'asc' ? dateA - dateB : dateB - dateA;
          }
          
          // 금액인 경우 숫자로 처리
          if (currentSort.field === 'amount') {
            aValue = Number(aValue);
            bValue = Number(bValue);
            return currentSort.direction === 'asc' ? aValue - bValue : bValue - aValue;
          }
          
          // 문자열인 경우
          aValue = String(aValue || '').toLowerCase();
          bValue = String(bValue || '').toLowerCase();
          
          if (aValue < bValue) return currentSort.direction === 'asc' ? -1 : 1;
          if (aValue > bValue) return currentSort.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }
      
      // 페이지네이션 계산
      totalPages = Math.ceil(filteredRequests.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, filteredRequests.length);
      const paginatedRequests = filteredRequests.slice(startIndex, endIndex);
      
      // 페이지네이션 정보 업데이트
      document.getElementById('totalItems').textContent = filteredRequests.length;
      document.getElementById('startItem').textContent = filteredRequests.length === 0 ? 0 : startIndex + 1;
      document.getElementById('endItem').textContent = endIndex;
      
      // 페이지네이션 버튼 업데이트
      updatePaginationButtons();

      const requestTableBody = document.getElementById('requestTableBody');
      requestTableBody.innerHTML = '';
      
      if (filteredRequests.length === 0) {
        requestTableBody.innerHTML = '<tr><td colspan="7" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }

      paginatedRequests.forEach(request => {
        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        tr.innerHTML = `
          <td class="px-4 py-2">
            <input 
              type="radio" 
              name="select-request" 
              value="${request.id}" 
              class="request-select"
              ${selectedRequestId === request.id ? 'checked' : ''}
            >
          </td>
          <td class="px-4 py-2">${request.companyName}</td>
          <td class="px-4 py-2">${request.bankInfo}</td>
          <td class="px-4 py-2">${formatNumber(request.amount)}원</td>
          <td class="px-4 py-2">${request.requestDate}</td>
          <td class="px-4 py-2"><span class="${getStatusClass(request.status)}">${request.status}</span></td>
          <td class="px-4 py-2">
            <button class="bg-blue-500 hover:bg-blue-600 text-white rounded px-3 py-1 text-sm edit-button" data-id="${request.id}">수정</button>
            <button class="bg-red-500 hover:bg-red-600 text-white rounded px-3 py-1 text-sm delete-button" data-id="${request.id}">삭제</button>
          </td>
        `;
        requestTableBody.appendChild(tr);
      });

      // 이벤트 리스너 추가
      document.querySelectorAll('.request-select').forEach(radio => {
        radio.addEventListener('change', (e) => {
          selectedRequestId = e.target.value;
        });
      });

      document.querySelectorAll('.edit-button').forEach(button => {
        button.addEventListener('click', (e) => {
          const requestId = e.target.getAttribute('data-id');
          openEditModal(requestId);
        });
      });

      document.querySelectorAll('.delete-button').forEach(button => {
        button.addEventListener('click', (e) => {
          const requestId = e.target.getAttribute('data-id');
          openDeleteModal(requestId);
        });
      });
      
      // 정렬 아이콘 업데이트
      updateSortIcons();
    }
    
    // 숫자 포맷팅
    function formatNumber(num) {
      if (num === undefined || num === null) return '';
      return new Intl.NumberFormat('ko-KR').format(num);
    }
    
    // 상태에 따른 클래스 반환
    function getStatusClass(status) {
      if (!status) return '';
      
      switch(status) {
        case '승인완료': return 'text-green-600 font-medium';
        case '검토중': return 'text-blue-600 font-medium';
        case '요청완료': return 'text-yellow-600 font-medium';
        case '반려': return 'text-red-600 font-medium';
        default: return '';
      }
    }
    
    // 페이지네이션 버튼 업데이트
    function updatePaginationButtons() {
      const paginationNumbers = document.getElementById('paginationNumbers');
      paginationNumbers.innerHTML = '';
      
      // 표시할 페이지 번호 범위 계산
      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
      
      // 페이지 범위 조정
      if (endPage - startPage + 1 < maxVisiblePages && startPage > 1) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }
      
      // 이전 버튼 상태 업데이트
      const prevPageBtn = document.getElementById('prevPageBtn');
      prevPageBtn.disabled = currentPage <= 1;
      prevPageBtn.classList.toggle('opacity-50', currentPage <= 1);
      prevPageBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderRequests();
        }
      };
      
      // 페이지 번호 버튼 생성
      for (let i = startPage; i <= endPage; i++) {
        const pageButton = document.createElement('button');
        pageButton.className = `relative inline-flex items-center px-4 py-2 border ${
          i === currentPage ? 'bg-blue-50 border-blue-500 text-blue-600' : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50'
        } text-sm font-medium`;
        pageButton.textContent = i;
        pageButton.onclick = () => {
          currentPage = i;
          renderRequests();
        };
        paginationNumbers.appendChild(pageButton);
      }
      
      // 다음 버튼 상태 업데이트
      const nextPageBtn = document.getElementById('nextPageBtn');
      nextPageBtn.disabled = currentPage >= totalPages;
      nextPageBtn.classList.toggle('opacity-50', currentPage >= totalPages);
      nextPageBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderRequests();
        }
      };
    }
    
    // 정렬 아이콘 업데이트
    function updateSortIcons() {
      document.querySelectorAll('.sort-icon').forEach(icon => {
        icon.textContent = '';
      });
      
      if (currentSort.field) {
        const sortHeader = document.querySelector(`th[data-sort="${currentSort.field}"] .sort-icon`);
        if (sortHeader) {
          sortHeader.textContent = currentSort.direction === 'asc' ? '↑' : '↓';
        }
      }
    }
    
    // 정렬 이벤트 처리
    function handleSort(field) {
      if (currentSort.field === field) {
        // 같은 필드를 다시 클릭한 경우 방향 전환
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        // 새로운 필드로 정렬
        currentSort.field = field;
        currentSort.direction = 'asc';
      }
      
      // 페이지를 1페이지로 리셋
      currentPage = 1;
      renderRequests();
    }

    // 송금 요청 모달 열기
    function openRequestModal() {
      clearForm();
      document.getElementById('addEditModalTitle').textContent = '송금 요청 추가';
      document.getElementById('addEditModal').classList.remove('hidden');
      document.getElementById('addEditForm').setAttribute('data-mode', 'add');
    }

    // 송금 요청 수정 모달 열기
    function openEditModal(requestId) {
      const request = requests.find(r => r.id === requestId);
      if (!request) {
        alert('송금 요청 정보를 찾을 수 없습니다.');
        return;
      }
      
      document.getElementById('companyName').value = request.companyName;
      document.getElementById('bankInfo').value = request.bankInfo;
      document.getElementById('amount').value = request.amount;
      document.getElementById('requestDate').value = request.requestDate;
      document.getElementById('status').value = request.status;
      
      document.getElementById('addEditModalTitle').textContent = '송금 요청 수정';
      document.getElementById('addEditModal').classList.remove('hidden');
      document.getElementById('addEditForm').setAttribute('data-mode', 'edit');
      document.getElementById('addEditForm').setAttribute('data-id', requestId);
    }

    // 송금 요청 삭제 모달 열기
    function openDeleteModal(requestId = null) {
      // 선택된 라디오 버튼이 없고 requestId도 없는 경우 확인
      if (!requestId && !selectedRequestId) {
        alert('삭제할 송금 요청을 선택해주세요.');
        return;
      }
      
      // requestId가 제공되지 않은 경우 selectedRequestId 사용
      const idToDelete = requestId || selectedRequestId;
      
      // 해당 ID의 요청이 존재하는지 확인
      const request = requests.find(r => r.id === idToDelete);
      if (!request) {
        alert('선택한 송금 요청을 찾을 수 없습니다.');
        return;
      }
      
      document.getElementById('requestCompanyToDelete').textContent = request.companyName;
      document.getElementById('deleteModal').classList.remove('hidden');
      document.getElementById('deleteForm').setAttribute('data-id', idToDelete);
    }

    // 모달 닫기
    function closeModals() {
      document.getElementById('addEditModal').classList.add('hidden');
      document.getElementById('deleteModal').classList.add('hidden');
    }

    // 폼 초기화
    function clearForm() {
      document.getElementById('companyName').value = '';
      document.getElementById('bankInfo').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('requestDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('status').value = '요청완료';
    }

    // 폼 제출 처리
    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const form = document.getElementById('addEditForm');
      const mode = form.getAttribute('data-mode');
      const confirmButton = document.getElementById('confirmButton');
      
      // 이중 제출 방지
      if (confirmButton.disabled) return;
      
      // 필드 값 가져오기
      const companyName = document.getElementById('companyName').value.trim();
      const bankInfo = document.getElementById('bankInfo').value.trim();
      const amount = Number(document.getElementById('amount').value.replace(/,/g, ''));
      const requestDate = document.getElementById('requestDate').value;
      const status = document.getElementById('status').value;
      
      // 유효성 검사
      if (!companyName) {
        alert('기업명을 입력해주세요.');
        return;
      }
      
      if (!bankInfo) {
        alert('계좌 정보를 입력해주세요.');
        return;
      }
      
      if (isNaN(amount) || amount <= 0) {
        alert('유효한 금액을 입력해주세요.');
        return;
      }
      
      if (!requestDate) {
        alert('요청일을 입력해주세요.');
        return;
      }
      
      try {
        confirmButton.disabled = true;
        confirmButton.textContent = '처리 중...';
        
        if (mode === 'add') {
          // 새 요청 추가
          const newRequest = {
            companyName,
            bankInfo,
            amount,
            requestDate,
            status
          };
          
          // API 호출로 요청 추가
          const result = await addData('송금요청', newRequest);
          
          if (result.success) {
            // 로컬 배열에 추가
            newRequest.id = result.data.id;
            requests.push(newRequest);
            
            closeModals();
            currentPage = 1; // 첫 페이지로 리셋
            renderRequests();
            alert('송금 요청이 성공적으로 추가되었습니다.');
          } else {
            throw new Error(result.error || '알 수 없는 오류');
          }
        } else if (mode === 'edit') {
          // 기존 요청 수정
          const requestId = form.getAttribute('data-id');
          const updatedRequest = {
            id: requestId,
            companyName,
            bankInfo,
            amount,
            requestDate,
            status
          };
          
          // API 호출로 요청 수정
          const result = await updateData('송금요청', updatedRequest);
          
          if (result.success) {
            // 로컬 배열 업데이트
            const index = requests.findIndex(r => r.id === requestId);
            if (index !== -1) {
              requests[index] = updatedRequest;
            }
            
            closeModals();
            renderRequests();
            alert('송금 요청이 성공적으로 수정되었습니다.');
          } else {
            throw new Error(result.error || '알 수 없는 오류');
          }
        }
      } catch (error) {
        console.error('송금 요청 저장 중 오류:', error);
        alert('송금 요청 저장 중 오류가 발생했습니다: ' + error.message);
      } finally {
        confirmButton.disabled = false;
        confirmButton.textContent = '저장';
      }
    }

    // 요청 삭제 처리
    async function handleDeleteSubmit(e) {
      e.preventDefault();
      
      const form = document.getElementById('deleteForm');
      const requestId = form.getAttribute('data-id');
      const confirmButton = document.getElementById('deleteConfirmButton');
      
      if (!requestId) return;
      
      try {
        confirmButton.disabled = true;
        confirmButton.textContent = '삭제 중...';
        
        // API 호출로 요청 삭제
        const result = await deleteData('송금요청', requestId);
        
        if (result.success) {
          // 로컬 배열에서 제거
          requests = requests.filter(r => r.id !== requestId);
          
          // 선택된 요청 초기화
          if (selectedRequestId === requestId) {
            selectedRequestId = null;
          }
          
          closeModals();
          renderRequests();
          alert('송금 요청이 성공적으로 삭제되었습니다.');
        } else {
          throw new Error(result.error || '알 수 없는 오류');
        }
      } catch (error) {
        console.error('송금 요청 삭제 중 오류:', error);
        alert('송금 요청 삭제 중 오류가 발생했습니다: ' + error.message);
      } finally {
        confirmButton.disabled = false;
        confirmButton.textContent = '삭제';
      }
    }

    // 이벤트 리스너
    window.addEventListener('load', () => {
      loadRequests();
      
      // 정렬 이벤트 리스너 추가
      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const field = th.getAttribute('data-sort');
          handleSort(field);
        });
      });
      
      document.getElementById('searchButton').addEventListener('click', () => {
        currentPage = 1; // 검색 시 1페이지로 리셋
        renderRequests();
      });
      
      document.getElementById('statusFilter').addEventListener('change', () => {
        currentPage = 1; // 필터링 시 1페이지로 리셋
        renderRequests();
      });
      
      document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          currentPage = 1;
          renderRequests();
        }
      });
      
      document.getElementById('addButton').addEventListener('click', openRequestModal);
      
      document.getElementById('deleteButton').addEventListener('click', () => {
        openDeleteModal();
      });
      
      document.getElementById('addEditForm').addEventListener('submit', handleFormSubmit);
      document.getElementById('deleteForm').addEventListener('submit', handleDeleteSubmit);
      
      // 모달 닫기 버튼들
      document.querySelectorAll('.modal-close').forEach(button => {
        button.addEventListener('click', closeModals);
      });
      
      // 금액 입력 필드에 숫자 포맷팅
      const amountInput = document.getElementById('amount');
      if (amountInput) {
        amountInput.addEventListener('input', (e) => {
          // 숫자만 추출하여 포맷팅
          const value = e.target.value.replace(/[^\d]/g, '');
          if (value) {
            e.target.value = new Intl.NumberFormat('ko-KR').format(parseInt(value));
          } else {
            e.target.value = '';
          }
        });
      }
    });
  </script>
</body>
</html>
