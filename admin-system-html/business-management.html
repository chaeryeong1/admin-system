<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 사업 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-blue-600">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="cashback-management.html" class="text-gray-500">캐시백 송금</a>
    <a href="cashback-request.html" class="text-gray-500">송금 요청</a>
    <a href="cashback-approval.html" class="text-gray-500">송금 승인</a>
    <a href="cashback-transfer.html" class="text-gray-500">송금 처리</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">사업 관리</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">ㆍ사업 리스트 관리</li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">사업 리스트 관리</div>

      <!-- 검색/조회 -->
      <div class="flex items-center space-x-4">
        <input 
          id="searchInput"
          type="text" 
          placeholder="사업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
        <div class="flex-1 text-right">
          <button 
            id="addButton"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            + 추가
          </button>
        </div>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">
                  <input 
                    type="checkbox" 
                    id="selectAllCheckbox" 
                    class="cursor-pointer"
                  >
                </th>
                <th class="px-4 py-2 text-left">사업명</th>
                <th class="px-4 py-2 text-left">목표 업체 수</th>
                <th class="px-4 py-2 text-left">사업 기간</th>
                <th class="px-4 py-2 text-left">주최기관</th>
                <th class="px-4 py-2 text-left">공고</th>
              </tr>
            </thead>
            <tbody id="projectTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="editButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
        >
          수정
        </button>
        <button 
          id="deleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 모달 -->
  <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 추가</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">사업명 <span class="text-red-500">*</span></label>
          <input
            id="addName"
            type="text"
            placeholder="사업명을 입력하세요"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">목표 업체 수 <span class="text-red-500">*</span></label>
          <input
            id="addBudget"
            type="number"
            placeholder="숫자만 입력 가능"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">사업 기간 <span class="text-red-500">*</span></label>
          <div class="flex space-x-2">
            <input
              id="addStartDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
            <span class="flex items-center">~</span>
            <input
              id="addEndDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">주최기관</label>
          <input
            id="addOrganizer"
            type="text"
            placeholder="주최기관을 입력하세요"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">공고 URL</label>
          <input
            id="addNoticeUrl"
            type="url"
            placeholder="https://example.com"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelAddButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmAddButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 정보 수정</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">사업명 <span class="text-red-500">*</span></label>
          <input
            id="editName"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">목표 업체 수 <span class="text-red-500">*</span></label>
          <input
            id="editBudget"
            type="number"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">사업 기간 <span class="text-red-500">*</span></label>
          <div class="flex space-x-2">
            <input
              id="editStartDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
            <span class="flex items-center">~</span>
            <input
              id="editEndDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">주최기관</label>
          <input
            id="editOrganizer"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">공고 URL</label>
          <input
            id="editNoticeUrl"
            type="url"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelEditButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmEditButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 삭제</h2>
      <p>정말 이 사업을 삭제하시겠습니까?</p>
      <p id="deleteProjectName" class="font-semibold mt-2"></p>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelDeleteButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmDeleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const projectTableBody = document.getElementById('projectTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addButton = document.getElementById('addButton');
    const deleteButton = document.getElementById('deleteButton');
    const editButton = document.getElementById('editButton');
    
    // 모달 관련 요소
    const addModal = document.getElementById('addModal');
    const editModal = document.getElementById('editModal');
    const deleteModal = document.getElementById('deleteModal');
    
    // 폼 요소
    const addForm = document.getElementById('addForm');
    const editForm = document.getElementById('editForm');
    const deleteProjectName = document.getElementById('deleteProjectName');
    
    // 데이터 상태
    let projects = [];
    let selectedProjectIds = [];
    
    // 사업 데이터 로드
    async function loadProjects() {
      try {
        console.log('사업 데이터 로드 시작');
        
        // 로딩 표시
        projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center">데이터를 불러오는 중...</td></tr>';
        
        // API에서 데이터 가져오기
        const result = await fetchData('사업정보');
        console.log('API 응답:', result);
        
        // API 호출 성공 시
        if (result && result.success && result.data && Array.isArray(result.data)) {
          projects = result.data;
          console.log('서버에서 로드된 사업 수:', projects.length);
          
          // 로컬 스토리지에도 최신 데이터 저장 (오프라인 모드를 위한 백업)
          localStorage.setItem('projectsData', JSON.stringify(projects));
        } 
        // API 호출 실패 시, 로컬 스토리지 데이터 사용 시도
        else {
          console.warn('API 호출 실패, 로컬 데이터 확인 중...');
          
          const savedData = localStorage.getItem('projectsData');
          
          if (savedData) {
            try {
              const parsedData = JSON.parse(savedData);
              if (parsedData && Array.isArray(parsedData) && parsedData.length > 0) {
                console.log('로컬 스토리지에서 데이터 로드:', parsedData.length + '개 항목');
                projects = parsedData;
              } else {
                throw new Error('저장된 데이터 없음');
              }
            } catch (e) {
              console.error('로컬 스토리지 데이터 파싱 오류:', e);
              localStorage.removeItem('projectsData');
              useDefaultData();
            }
          } else {
            console.log('로컬 스토리지에 데이터 없음, 기본 데이터 사용');
            useDefaultData();
          }
        }
        
        // 데이터를 화면에 표시
        renderProjects();
      } catch (error) {
        console.error('데이터 로드 오류:', error);
        
        // 오류 발생 시 로컬 데이터 사용 시도
        const savedData = localStorage.getItem('projectsData');
        if (savedData) {
          try {
            projects = JSON.parse(savedData);
            renderProjects();
            console.log('오류 발생으로 로컬 데이터 사용');
          } catch (e) {
            projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
          }
        } else {
          projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
        }
      }
    }
    
    // 기본 데이터 사용 (샘플 데이터)
    function useDefaultData() {
      projects = [
        {
          id: '1',
          name: '클라우드 보급사업',
          targetCompanies: 50,
          startDate: '2025-01-01',
          endDate: '2025-12-31',
          organizer: '디지털혁신부',
          noticeUrl: 'https://example.com/cloud'
        },
        {
          id: '2',
          name: '스마트공장 구축지원사업',
          targetCompanies: 80,
          startDate: '2025-03-01',
          endDate: '2025-12-31',
          organizer: '제조혁신부',
          noticeUrl: 'https://example.com/smart'
        },
        {
          id: '3',
          name: '중소기업 디지털전환 지원사업',
          targetCompanies: 30,
          startDate: '2025-02-01',
          endDate: '2025-11-30',
          organizer: '산업진흥부',
          noticeUrl: 'https://example.com/digital'
        }
      ];
      
      // 기본 데이터도 로컬 스토리지에 저장
      localStorage.setItem('projectsData', JSON.stringify(projects));
    }
    
    // 사업 목록 렌더링
    function renderProjects() {
      const searchTerm = searchInput.value.toLowerCase();
      
      const filteredProjects = projects.filter(project => 
        project.name.toLowerCase().includes(searchTerm) || 
        (project.organizer && project.organizer.toLowerCase().includes(searchTerm))
      );
      
      if (filteredProjects.length === 0) {
        projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }
      
      // 테이블 생성
      projectTableBody.innerHTML = filteredProjects.map(project => `
        <tr class="border-b hover:bg-gray-50" data-id="${project.id}">
          <td class="px-4 py-2">
            <input 
              type="checkbox" 
              class="project-checkbox" 
              data-id="${project.id}"
              ${selectedProjectIds.includes(project.id) ? 'checked' : ''}
            >
          </td>
          <td class="px-4 py-2">${project.name || '-'}</td>
          <td class="px-4 py-2">${project.targetCompanies || '-'}</td>
          <td class="px-4 py-2">${formatDate(project.startDate) || '-'} ~ ${formatDate(project.endDate) || '-'}</td>
          <td class="px-4 py-2">${project.organizer || '-'}</td>
          <td class="px-4 py-2">
            ${project.noticeUrl ? `<a href="${project.noticeUrl}" target="_blank" class="text-blue-600 hover:underline">공고 보기</a>` : '-'}
          </td>
        </tr>
      `).join('');
      
      // 체크박스 이벤트 리스너 추가
      document.querySelectorAll('.project-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', handleProjectSelection);
      });
      
      // 테이블 행 클릭 이벤트 추가
      document.querySelectorAll('#projectTableBody tr').forEach(row => {
        row.addEventListener('click', function(e) {
          // 링크 클릭은 무시
          if (e.target.tagName === 'A') return;
          
          // 체크박스 클릭은 체크박스 자체가 처리
          if (e.target.type === 'checkbox') return;
          
          // 행 클릭 시 해당 체크박스 토글
          const checkbox = this.querySelector('.project-checkbox');
          if (checkbox) {
            checkbox.checked = !checkbox.checked;
            
            // 체크박스 변경 이벤트 발생시키기
            const event = new Event('change', { bubbles: true });
            checkbox.dispatchEvent(event);
          }
        });
      });
      
      // 버튼 상태 업데이트
      updateButtonStates();
      
      // 전체 선택 체크박스 상태 업데이트
      updateSelectAllCheckbox();
    }
    
    // 상태에 따른 클래스 반환
    function getStatusClass(status) {
      if (!status) return '';
      
      switch(status) {
        case '완료': return 'text-green-600 font-medium';
        case '진행중': return 'text-blue-600 font-medium';
        case '준비중': return 'text-yellow-600 font-medium';
        case '중단': return 'text-red-600 font-medium';
        default: return '';
      }
    }
    
    // 프로젝트 선택 처리 (이제 다중 선택 가능)
    function handleProjectSelection(event) {
      const checkbox = event.target;
      const projectId = checkbox.dataset.id;
      
      if (checkbox.checked) {
        // 체크된 경우 배열에 ID 추가
        if (!selectedProjectIds.includes(projectId)) {
          selectedProjectIds.push(projectId);
        }
      } else {
        // 체크 해제된 경우 배열에서 ID 제거
        selectedProjectIds = selectedProjectIds.filter(id => id !== projectId);
      }
      
      // 단일 선택 기능 유지를 위한 마지막 선택 ID 저장
      selectedProjectId = selectedProjectIds.length > 0 ? selectedProjectIds[selectedProjectIds.length - 1] : null;
      
      console.log('선택된 사업 ID 목록:', selectedProjectIds);
      console.log('현재 선택된 사업 ID (마지막):', selectedProjectId);
      
      updateButtonStates();
      updateSelectAllCheckbox();
    }
    
    // 전체 선택 체크박스 상태 업데이트
    function updateSelectAllCheckbox() {
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      const checkboxes = document.querySelectorAll('.project-checkbox');
      
      if (!selectAllCheckbox || checkboxes.length === 0) return;
      
      // 모든 체크박스가 선택되었는지 확인
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      // 일부 체크박스만 선택되었는지 확인
      const someChecked = Array.from(checkboxes).some(cb => cb.checked);
      
      selectAllCheckbox.checked = allChecked;
      // 여기서 필요하면 indeterminate 상태 추가 가능
      selectAllCheckbox.indeterminate = someChecked && !allChecked;
    }
    
    // 전체 선택/해제 처리
    function handleSelectAll() {
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      const checkboxes = document.querySelectorAll('.project-checkbox');
      
      if (!selectAllCheckbox || checkboxes.length === 0) return;
      
      const isChecked = selectAllCheckbox.checked;
      
      checkboxes.forEach(checkbox => {
        checkbox.checked = isChecked;
        
        const projectId = checkbox.dataset.id;
        
        if (isChecked) {
          // 전체 선택 시 모든 ID 추가
          if (!selectedProjectIds.includes(projectId)) {
            selectedProjectIds.push(projectId);
          }
        } else {
          // 전체 해제 시 배열 비우기
          selectedProjectIds = [];
        }
      });
      
      // 마지막 선택 ID 업데이트
      selectedProjectId = selectedProjectIds.length > 0 ? selectedProjectIds[selectedProjectIds.length - 1] : null;
      
      updateButtonStates();
    }
    
    // 버튼 상태 업데이트
    function updateButtonStates() {
      const hasSelection = selectedProjectIds.length > 0;
      
      editButton.disabled = !hasSelection;
      deleteButton.disabled = !hasSelection;
      
      if (hasSelection) {
        editButton.classList.remove('opacity-50', 'cursor-not-allowed');
        deleteButton.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        editButton.classList.add('opacity-50', 'cursor-not-allowed');
        deleteButton.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }
    
    // 숫자 포맷팅
    function formatNumber(num) {
      if (num === undefined || num === null) return '';
      return new Intl.NumberFormat('ko-KR').format(num);
    }
    
    // 날짜 포맷팅
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // 날짜 유효성 검사
    function isValidDate(dateString) {
      if (!dateString) return false;
      const date = new Date(dateString);
      return !isNaN(date.getTime());
    }
    
    // URL 형식 유효성 검사
    function isValidUrl(url) {
      if (!url) return true; // 빈 값은 허용
      
      try {
        // URL 객체를 생성해서 유효성 검사
        const urlObj = new URL(url);
        // http 또는 https 프로토콜만 허용
        return urlObj.protocol === 'http:' || urlObj.protocol === 'https:';
      } catch (e) {
        return false;
      }
    }

    // 사업 추가 처리
    async function addProject(event) {
      if (event) event.preventDefault();
      
      console.log('사업 추가 시작');
      
      const nameInput = document.getElementById('addName');
      const budgetInput = document.getElementById('addBudget');
      const startDateInput = document.getElementById('addStartDate');
      const endDateInput = document.getElementById('addEndDate');
      const organizerInput = document.getElementById('addOrganizer');
      const noticeUrlInput = document.getElementById('addNoticeUrl');
      
      if (!nameInput || !budgetInput || !startDateInput || !endDateInput) {
        alert('필수 입력 필드를 찾을 수 없습니다.');
        return;
      }
      
      const name = nameInput.value.trim();
      const targetCompanies = parseInt(budgetInput.value) || 0;
      const startDate = startDateInput.value;
      const endDate = endDateInput.value;
      const organizer = organizerInput ? organizerInput.value.trim() : '';
      const noticeUrl = noticeUrlInput ? noticeUrlInput.value.trim() : '';
      
      // 유효성 검사
      if (!name) {
        alert('사업명을 입력해주세요.');
        return;
      }
      
      if (targetCompanies <= 0) {
        alert('목표 업체 수는 1 이상이어야 합니다.');
        return;
      }
      
      if (!isValidDate(startDate)) {
        alert('유효한 시작일을 입력해주세요.');
        return;
      }
      
      if (!isValidDate(endDate)) {
        alert('유효한 종료일을 입력해주세요.');
        return;
      }
      
      if (new Date(startDate) > new Date(endDate)) {
        alert('종료일은 시작일 이후여야 합니다.');
        return;
      }
      
      // URL 형식 검사
      if (noticeUrl && !isValidUrl(noticeUrl)) {
        alert('유효한 URL 형식이 아닙니다. http:// 또는 https://로 시작하는 URL을 입력해주세요.');
        noticeUrlInput.focus();
        return;
      }
      
      // 저장 중 표시
      const saveButton = document.getElementById('confirmAddButton');
      if (saveButton) {
        saveButton.textContent = '저장 중...';
        saveButton.disabled = true;
      }
      
      // 새 프로젝트 정보
      const newProject = {
        name,
        targetCompanies,
        startDate,
        endDate,
        organizer,
        noticeUrl
      };
      
      console.log('추가할 사업 정보:', newProject);
      
      try {
        // API 호출
        const result = await addData('사업정보', newProject);
        
        console.log('추가 결과:', result);
        
        if (result && result.success) {
          // 성공 시 로컬 캐시 삭제하고 새로 데이터 로드
          localStorage.removeItem('projectsData');
          closeAddModal();
          
          // 서버에서 새로운 데이터 로드
          await loadProjects();
          alert('사업 정보가 추가되었습니다.');
        } else {
          throw new Error(result.error || '추가 실패: 서버에서 오류가 발생했습니다.');
        }
      } catch (error) {
        console.error('API 오류:', error);
        alert('사업 정보 추가 중 오류가 발생했습니다: ' + error.message);
        
        // 버튼 복원
        if (saveButton) {
          saveButton.textContent = '저장';
          saveButton.disabled = false;
        }
      }
    }

    // 사업 삭제 처리 - 다중 삭제 지원
    async function deleteProject() {
      console.log('deleteProject 함수 호출됨, 선택된 ID들:', selectedProjectIds);
      
      if (selectedProjectIds.length === 0) {
        alert('삭제할 사업을 선택해주세요.');
        return;
      }
      
      // 단일 항목 삭제인 경우
      if (selectedProjectIds.length === 1) {
        const projectId = selectedProjectIds[0];
        deleteProjectById(projectId);
        return;
      }
      
      // 다중 항목 삭제인 경우
      if (!confirm(`선택한 ${selectedProjectIds.length}개의 사업을 모두 삭제하시겠습니까?`)) {
        return;
      }
      
      // 삭제 중 표시
      const deleteButton = document.getElementById('confirmDeleteButton');
      if (deleteButton) {
        deleteButton.textContent = '삭제 중...';
        deleteButton.disabled = true;
      }
      
      try {
        // 순차적으로 삭제 처리
        for (const projectId of selectedProjectIds) {
          await deleteData('사업정보', projectId);
        }
        
        // 성공 시 로컬 캐시 삭제하고 새로 데이터 로드
        localStorage.removeItem('projectsData');
        selectedProjectIds = [];
        selectedProjectId = null;
        closeDeleteModal();
        
        // 서버에서 새로운 데이터 로드
        await loadProjects();
        alert('선택한 사업 정보가 삭제되었습니다.');
      } catch (error) {
        console.error('API 오류:', error);
        alert('사업 정보 삭제 중 오류가 발생했습니다: ' + error.message);
        
        // 버튼 복원
        if (deleteButton) {
          deleteButton.textContent = '삭제';
          deleteButton.disabled = false;
        }
      }
    }
    
    // ID로 단일 사업 삭제
    async function deleteProjectById(projectId) {
      if (!projectId) return;
      
      console.log('사업 ID 삭제:', projectId);
      
      const project = projects.find(p => p.id === projectId);
      if (!project) {
        console.error('선택된 ID에 해당하는 사업을 찾을 수 없음:', projectId);
        alert('선택한 사업 정보를 찾을 수 없습니다.');
        return;
      }
      
      if (!confirm(`"${project.name}" 사업을 삭제하시겠습니까?`)) {
        return;
      }
      
      // 삭제 중 표시
      const deleteButton = document.getElementById('confirmDeleteButton');
      if (deleteButton) {
        deleteButton.textContent = '삭제 중...';
        deleteButton.disabled = true;
      }
      
      try {
        const result = await deleteData('사업정보', projectId);
        
        console.log('삭제 결과:', result);
        
        if (result && result.success) {
          // 성공 시 로컬 캐시 삭제하고 새로 데이터 로드
          localStorage.removeItem('projectsData');
          selectedProjectIds = selectedProjectIds.filter(id => id !== projectId);
          selectedProjectId = selectedProjectIds.length > 0 ? selectedProjectIds[selectedProjectIds.length - 1] : null;
          
          // 서버에서 새로운 데이터 로드
          await loadProjects();
          alert('사업 정보가 삭제되었습니다.');
        } else {
          throw new Error(result.error || '삭제 실패: 서버에서 오류가 발생했습니다.');
        }
      } catch (error) {
        console.error('API 오류:', error);
        alert('사업 정보 삭제 중 오류가 발생했습니다: ' + error.message);
      }
    }
    
    // 엑셀 다운로드
    async function downloadExcel() {
      try {
        const result = await downloadExcelFile('사업정보');
        
        if (!result.success) {
          throw new Error(result.error || '다운로드 실패');
        }
        
        // 성공 메시지
        alert('엑셀 파일 다운로드가 완료되었습니다.');

        console.error('API 오류:', error);
        alert('엑셀 파일 다운로드 중 오류가 발생했습니다.');
      }
    }
    
    // 이벤트 리스너 등록
    document.addEventListener('DOMContentLoaded', () => {

      // 검색 및 필터링

      searchInput.addEventListener('keypress', (e) => {

          renderProjects();

      // 버튼 이벤트
      addButton.addEventListener('click', openAddModal);
      editButton.addEventListener('click', openEditModal);
      deleteButton.addEventListener('click', openDeleteModal);
      
      // 모달 확인 버튼
      document.getElementById('confirmAddButton').addEventListener('click', addProject);
      document.getElementById('confirmEditButton').addEventListener('click', editProject);
      
      // 모달 닫기 버튼
      document.getElementById('cancelAddButton').addEventListener('click', closeAddModal);
      document.getElementById('cancelEditButton').addEventListener('click', closeEditModal);
      document.getElementById('cancelDeleteButton').addEventListener('click', closeDeleteModal);
      
      // 삭제 확인 버튼
      document.getElementById('confirmDeleteButton').addEventListener('click', deleteProject);
      
      // 숫자만 입력 가능하도록 설정
      const numberInputs = [document.getElementById('addBudget'), document.getElementById('editBudget')];
      numberInputs.forEach(input => {
        input.addEventListener('input', function() {
          this.value = this.value.replace(/[^0-9]/g, '');
        });
      });
      
      // 전체 선택 체크박스 이벤트 추가
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      if (selectAllCheckbox) {
        selectAllCheckbox.addEventListener('change', handleSelectAll);
      }
    });
