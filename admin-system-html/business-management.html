<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 사업 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-blue-600">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="business-notification.html" class="text-gray-500">사업 안내</a>
    <a href="cashback-management.html" class="text-gray-500">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">사업 관리</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">ㆍ사업 리스트 관리</li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">사업 리스트 관리</div>

      <!-- 검색/조회 -->
      <div class="flex items-center space-x-4">
        <input 
          id="searchInput"
          type="text" 
          placeholder="사업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
        <div class="flex-1 text-right">
          <button 
            id="addButton"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            사업 리스트 추가
          </button>
        </div>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">선택</th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="name">사업명 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="startDate">시작일 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="endDate">종료일 <span class="sort-icon"></span></th>
                <th class="px-4 py-2 text-left cursor-pointer" data-sort="organizer">주관기관 <span class="sort-icon"></span></th>
              </tr>
            </thead>
            <tbody id="projectTableBody">
              <!-- 사업 목록이 여기에 표시됩니다 -->
            </tbody>
          </table>
        </div>
        <!-- 페이지네이션 -->
        <div class="px-4 py-3 flex items-center justify-between border-t">
          <div class="flex-1 flex justify-between items-center">
            <div>
              <span class="text-sm text-gray-700">
                총 <span id="totalItems">0</span>개 항목 중 <span id="startItem">0</span>-<span id="endItem">0</span>
              </span>
            </div>
            <div>
              <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                <button id="prevPageBtn" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                  <span class="sr-only">이전</span>
                  <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                  </svg>
                </button>
                <div id="paginationNumbers" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">
                  <!-- 페이지 번호가 여기에 동적으로 추가됩니다 -->
                </div>
                <button id="nextPageBtn" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                  <span class="sr-only">다음</span>
                  <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                  </svg>
                </button>
              </nav>
            </div>
          </div>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="editButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
        >
          수정
        </button>
        <button 
          id="deleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 모달 -->
  <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 추가</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">사업명 <span class="text-red-500">*</span></label>
          <input
            id="addName"
            type="text"
            placeholder="사업명을 입력하세요"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">사업 기간 <span class="text-red-500">*</span></label>
          <div class="flex space-x-2">
            <input
              id="addStartDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
            <span class="flex items-center">~</span>
            <input
              id="addEndDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">주최기관</label>
          <input
            id="addOrganizer"
            type="text"
            placeholder="주최기관을 입력하세요"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">공고 URL</label>
          <input
            id="addNoticeUrl"
            type="url"
            placeholder="https://example.com"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelAddButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmAddButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 정보 수정</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">사업명 <span class="text-red-500">*</span></label>
          <input
            id="editName"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">사업 기간 <span class="text-red-500">*</span></label>
          <div class="flex space-x-2">
            <input
              id="editStartDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
            <span class="flex items-center">~</span>
            <input
              id="editEndDate"
              type="date"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">주최기관</label>
          <input
            id="editOrganizer"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">공고 URL</label>
          <input
            id="editNoticeUrl"
            type="url"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelEditButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmEditButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 삭제</h2>
      <p>정말 이 사업을 삭제하시겠습니까?</p>
      <p id="deleteProjectName" class="font-semibold mt-2"></p>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelDeleteButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmDeleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const projectTableBody = document.getElementById('projectTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addButton = document.getElementById('addButton');
    const deleteButton = document.getElementById('deleteButton');
    const editButton = document.getElementById('editButton');
    
    // 모달 관련 요소
    const addModal = document.getElementById('addModal');
    const editModal = document.getElementById('editModal');
    const deleteModal = document.getElementById('deleteModal');
    
    // 폼 요소
    const addForm = document.getElementById('addForm');
    const editForm = document.getElementById('editForm');
    const deleteProjectName = document.getElementById('deleteProjectName');
    
    // 데이터 상태
    let projects = [];
    let selectedProjectIds = [];
    
    // 페이지네이션 상태
    let currentPage = 1;
    const itemsPerPage = 20;
    let totalPages = 0;
    
    // 정렬 상태
    let currentSort = {
      field: null,
      direction: 'asc' // 'asc' 또는 'desc'
    };
    
    async function loadProjects() {
      console.log('사업 데이터 로딩 시작');
      document.getElementById('projectTableBody').innerHTML = 
        '<tr><td colspan="5" class="px-4 py-2 text-center">데이터를 불러오는 중입니다...</td></tr>';
      
      try {
        // API를 통해 데이터 가져오기
        const result = await fetchData('사업정보');
        console.log('API 결과:', result);
        
        if (result && result.data && Array.isArray(result.data) && result.data.length > 0) {
          projects = result.data;
          console.log(`${projects.length}개의 사업 로드됨`);
        } else {
          console.log('유효한 데이터가 없어 샘플 데이터를 사용합니다.');
          // 샘플 데이터
          projects = [
            {
              id: "1",
              name: "클라우드 보급 사업",
              startDate: "2025-01-01",
              endDate: "2025-12-31",
              organizer: "정보통신산업진흥원",
              noticeUrl: "https://example.com/notice1"
            },
            {
              id: "2",
              name: "디지털 전환 지원사업",
              startDate: "2025-02-15",
              endDate: "2025-11-30",
              organizer: "중소기업기술정보진흥원",
              noticeUrl: "https://example.com/notice2"
            },
            {
              id: "3",
              name: "ICT 융합 프로젝트",
              startDate: "2025-03-01",
              endDate: "2025-10-31",
              organizer: "한국정보화진흥원",
              noticeUrl: "https://example.com/notice3"
            }
          ];
        }
        renderProjects();
      } catch (error) {
        console.error('사업 데이터 로드 중 오류 발생:', error);
        document.getElementById('projectTableBody').innerHTML = 
          '<tr><td colspan="5" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
      }
    }

    function renderProjects() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      let filteredProjects = projects.filter(project => 
        project.name.toLowerCase().includes(searchTerm) || 
        project.organizer.toLowerCase().includes(searchTerm)
      );
      
      // 정렬 적용
      if (currentSort.field) {
        filteredProjects.sort((a, b) => {
          let aValue = a[currentSort.field];
          let bValue = b[currentSort.field];
          
          // 날짜인 경우 특별 처리
          if (currentSort.field === 'startDate' || currentSort.field === 'endDate') {
            const dateA = new Date(aValue);
            const dateB = new Date(bValue);
            return currentSort.direction === 'asc' ? dateA - dateB : dateB - dateA;
          }
          
          // 문자열인 경우
          aValue = String(aValue || '').toLowerCase();
          bValue = String(bValue || '').toLowerCase();
          
          if (aValue < bValue) return currentSort.direction === 'asc' ? -1 : 1;
          if (aValue > bValue) return currentSort.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }
      
      // 페이지네이션 계산
      totalPages = Math.ceil(filteredProjects.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, filteredProjects.length);
      const paginatedProjects = filteredProjects.slice(startIndex, endIndex);
      
      // 페이지네이션 정보 업데이트
      document.getElementById('totalItems').textContent = filteredProjects.length;
      document.getElementById('startItem').textContent = filteredProjects.length === 0 ? 0 : startIndex + 1;
      document.getElementById('endItem').textContent = endIndex;
      
      // 페이지네이션 버튼 업데이트
      updatePaginationButtons();

      const projectTableBody = document.getElementById('projectTableBody');
      projectTableBody.innerHTML = '';
      
      if (filteredProjects.length === 0) {
        projectTableBody.innerHTML = '<tr><td colspan="5" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }

      paginatedProjects.forEach(project => {
        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        tr.innerHTML = `
          <td class="px-4 py-2">
            <input 
              type="radio" 
              name="select-project" 
              value="${project.id}" 
              class="project-select"
              ${selectedProjectIds.includes(project.id) ? 'checked' : ''}
            >
          </td>
          <td class="px-4 py-2">${project.name}</td>
          <td class="px-4 py-2">${project.startDate}</td>
          <td class="px-4 py-2">${project.endDate}</td>
          <td class="px-4 py-2">${project.organizer}</td>
        `;
        projectTableBody.appendChild(tr);
      });

      // 이벤트 리스너 추가
      document.querySelectorAll('.project-select').forEach(radio => {
        radio.addEventListener('change', (e) => {
          selectedProjectIds = [e.target.value];
        });
      });
      
      // 정렬 아이콘 업데이트
      updateSortIcons();
    }
    
    // 페이지네이션 버튼 업데이트
    function updatePaginationButtons() {
      const paginationNumbers = document.getElementById('paginationNumbers');
      paginationNumbers.innerHTML = '';
      
      // 표시할 페이지 번호 범위 계산
      const maxVisiblePages = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
      let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
      
      // 페이지 범위 조정
      if (endPage - startPage + 1 < maxVisiblePages && startPage > 1) {
        startPage = Math.max(1, endPage - maxVisiblePages + 1);
      }
      
      // 이전 버튼 상태 업데이트
      const prevPageBtn = document.getElementById('prevPageBtn');
      prevPageBtn.disabled = currentPage <= 1;
      prevPageBtn.classList.toggle('opacity-50', currentPage <= 1);
      prevPageBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderProjects();
        }
      };
      
      // 페이지 번호 버튼 생성
      for (let i = startPage; i <= endPage; i++) {
        const pageButton = document.createElement('button');
        pageButton.className = `relative inline-flex items-center px-4 py-2 border ${
          i === currentPage ? 'bg-blue-50 border-blue-500 text-blue-600' : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50'
        } text-sm font-medium`;
        pageButton.textContent = i;
        pageButton.onclick = () => {
          currentPage = i;
          renderProjects();
        };
        paginationNumbers.appendChild(pageButton);
      }
      
      // 다음 버튼 상태 업데이트
      const nextPageBtn = document.getElementById('nextPageBtn');
      nextPageBtn.disabled = currentPage >= totalPages;
      nextPageBtn.classList.toggle('opacity-50', currentPage >= totalPages);
      nextPageBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderProjects();
        }
      };
    }
    
    // 정렬 아이콘 업데이트
    function updateSortIcons() {
      document.querySelectorAll('.sort-icon').forEach(icon => {
        icon.textContent = '';
      });
      
      if (currentSort.field) {
        const sortHeader = document.querySelector(`th[data-sort="${currentSort.field}"] .sort-icon`);
        if (sortHeader) {
          sortHeader.textContent = currentSort.direction === 'asc' ? '↑' : '↓';
        }
      }
    }
    
    // 정렬 이벤트 처리
    function handleSort(field) {
      if (currentSort.field === field) {
        // 같은 필드를 다시 클릭한 경우 방향 전환
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        // 새로운 필드로 정렬
        currentSort.field = field;
        currentSort.direction = 'asc';
      }
      
      // 페이지를 1페이지로 리셋
      currentPage = 1;
      renderProjects();
    }
    
    // 사업 추가 모달 열기
    function openAddModal() {
      clearForm();
      document.getElementById('addEditModalTitle').textContent = '사업 추가';
      document.getElementById('addEditModal').classList.remove('hidden');
      document.getElementById('addEditForm').setAttribute('data-mode', 'add');
    }

    // 사업 수정 모달 열기
    function openEditModal(projectId) {
      const project = projects.find(p => p.id === projectId);
      if (!project) {
        alert('사업 정보를 찾을 수 없습니다.');
        return;
      }
      
      document.getElementById('projectName').value = project.name;
      document.getElementById('startDate').value = project.startDate;
      document.getElementById('endDate').value = project.endDate;
      document.getElementById('organizer').value = project.organizer;
      document.getElementById('noticeUrl').value = project.noticeUrl || '';
      
      document.getElementById('addEditModalTitle').textContent = '사업 수정';
      document.getElementById('addEditModal').classList.remove('hidden');
      document.getElementById('addEditForm').setAttribute('data-mode', 'edit');
      document.getElementById('addEditForm').setAttribute('data-id', projectId);
    }

    // 사업 삭제 모달 열기
    function openDeleteModal(projectId = null) {
      // 선택된 라디오 버튼이 없고 projectId도 없는 경우 확인
      if (!projectId && !selectedProjectIds.length) {
        alert('삭제할 사업을 선택해주세요.');
        return;
      }
      
      // projectId가 제공되지 않은 경우 selectedProjectIds 사용
      const idToDelete = projectId || selectedProjectIds[0];
      
      // 해당 ID의 프로젝트가 존재하는지 확인
      const project = projects.find(p => p.id === idToDelete);
      if (!project) {
        alert('선택한 사업을 찾을 수 없습니다.');
        return;
      }
      
      document.getElementById('projectNameToDelete').textContent = project.name;
      document.getElementById('deleteModal').classList.remove('hidden');
      document.getElementById('deleteForm').setAttribute('data-id', idToDelete);
    }

    // 모달 닫기
    function closeModals() {
      document.getElementById('addEditModal').classList.add('hidden');
      document.getElementById('deleteModal').classList.add('hidden');
    }

    // 폼 초기화
    function clearForm() {
      document.getElementById('projectName').value = '';
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      document.getElementById('organizer').value = '';
      document.getElementById('noticeUrl').value = '';
    }

    // 이벤트 리스너
    window.addEventListener('load', () => {
      loadProjects();
      
      // 정렬 이벤트 리스너 추가
      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const field = th.getAttribute('data-sort');
          handleSort(field);
        });
      });
      
      document.getElementById('searchButton').addEventListener('click', () => {
        currentPage = 1; // 검색 시 1페이지로 리셋
        renderProjects();
      });
      
      document.getElementById('addButton').addEventListener('click', openAddModal);
      
      document.getElementById('deleteButton').addEventListener('click', () => {
        openDeleteModal();
      });
      
      document.getElementById('addEditForm').addEventListener('submit', handleFormSubmit);
      
      document.getElementById('deleteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const projectId = e.target.getAttribute('data-id');
        try {
          document.getElementById('deleteConfirmButton').disabled = true;
          document.getElementById('deleteConfirmButton').textContent = '삭제 중...';
          
          // API 호출로 사업 삭제
          const result = await deleteData('사업정보', projectId);
          
          if (result.success) {
            // 로컬 배열에서도 삭제
            projects = projects.filter(p => p.id !== projectId);
            
            // 선택된 프로젝트 초기화
            if (selectedProjectIds.includes(projectId)) {
              selectedProjectIds = selectedProjectIds.filter(id => id !== projectId);
            }
            
            closeModals();
            renderProjects();
            alert('사업이 성공적으로 삭제되었습니다.');
          } else {
            alert('사업 삭제 중 오류가 발생했습니다: ' + (result.error || '알 수 없는 오류'));
          }
        } catch (error) {
          console.error('사업 삭제 중 오류:', error);
          alert('사업 삭제 중 오류가 발생했습니다.');
        } finally {
          document.getElementById('deleteConfirmButton').disabled = false;
          document.getElementById('deleteConfirmButton').textContent = '삭제';
        }
      });
      
      // 모달 닫기 버튼들
      document.querySelectorAll('.modal-close').forEach(button => {
        button.addEventListener('click', closeModals);
      });
    });
  </script>
</body>
</html>
