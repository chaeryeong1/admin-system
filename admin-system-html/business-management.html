<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 사업 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="cashback-management.html" class="text-gray-500">캐시백 송금</a>
    <a href="cashback-request.html" class="text-gray-500">송금 요청</a>
    <a href="cashback-approval.html" class="text-gray-500">송금 승인</a>
    <a href="cashback-transfer.html" class="text-gray-500">송금 처리</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">사업 관리</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">ㆍ사업 리스트 관리</li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">사업 리스트 관리</div>

      <!-- 검색/조회 -->
      <div class="flex items-center space-x-4">
        <input 
          id="searchInput"
          type="text" 
          placeholder="사업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
        <div class="flex-1 text-right">
          <button 
            id="addButton"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            + 추가
          </button>
        </div>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">선택</th>
                <th class="px-4 py-2 text-left">사업명</th>
                <th class="px-4 py-2 text-left">목표 업체 수</th>
                <th class="px-4 py-2 text-left">진행 기간</th>
                <th class="px-4 py-2 text-left">주최기관</th>
                <th class="px-4 py-2 text-left">공고</th>
              </tr>
            </thead>
            <tbody id="projectTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="editButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
        >
          수정
        </button>
        <button 
          id="deleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 모달 -->
  <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업명을 입력하세요</h2>
      <input
        id="newProjectName"
        type="text"
        placeholder="클라우드 고도화 지원사업"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelAddButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmAddButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 정보 수정</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">사업명</label>
          <input
            id="editProjectName"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">목표 업체 수</label>
          <input
            id="editProjectTarget"
            type="number"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">시작일</label>
          <input
            id="editProjectStartDate"
            type="date"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">종료일</label>
          <input
            id="editProjectEndDate"
            type="date"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">주최기관</label>
          <input
            id="editProjectOrganizer"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">공고 URL</label>
          <input
            id="editProjectNoticeUrl"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelEditButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmEditButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 삭제</h2>
      <p>정말 이 사업을 삭제하시겠습니까?</p>
      <p id="deleteProjectName" class="font-semibold mt-2"></p>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelDeleteButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmDeleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const projectTableBody = document.getElementById('projectTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addButton = document.getElementById('addButton');
    const deleteButton = document.getElementById('deleteButton');
    const editButton = document.getElementById('editButton');
    
    // 모달 관련 요소
    const addModal = document.getElementById('addModal');
    const editModal = document.getElementById('editModal');
    const deleteModal = document.getElementById('deleteModal');
    
    // 폼 요소
    const addForm = document.getElementById('addForm');
    const editForm = document.getElementById('editForm');
    const deleteProjectName = document.getElementById('deleteProjectName');
    
    // 데이터 상태
    let projects = [];
    let selectedProjectId = null;
    
    // 사업 데이터 로드
    async function loadProjects() {
      try {
        // 로딩 표시
        projectTableBody.innerHTML = '<tr><td colspan="8" class="px-4 py-2 text-center">데이터를 불러오는 중...</td></tr>';
        
        // API에서 데이터 가져오기
        const result = await fetchData('사업정보');
        
        if (result.success && result.data) {
          projects = result.data;
        } else {
          // API 호출 실패 시 샘플 데이터 사용
          console.log('API 호출 실패, 샘플 데이터 사용');
          projects = [
            {
              id: '1',
              name: '클라우드 보급사업',
              budget: 500000000,
              startDate: '2025-01-01',
              endDate: '2025-12-31',
              manager: '홍길동',
              department: '디지털혁신부',
              status: '진행중'
            },
            {
              id: '2',
              name: '스마트공장 구축지원사업',
              budget: 800000000,
              startDate: '2025-03-01',
              endDate: '2025-12-31',
              manager: '김철수',
              department: '제조혁신부',
              status: '진행중'
            },
            {
              id: '3',
              name: '중소기업 디지털전환 지원사업',
              budget: 300000000,
              startDate: '2025-02-01',
              endDate: '2025-11-30',
              manager: '이영희',
              department: '산업진흥부',
              status: '준비중'
            }
          ];
        }
        
        renderProjects();
      } catch (error) {
        console.error('오류 발생:', error);
        projectTableBody.innerHTML = '<tr><td colspan="8" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
      }
    }
    
    // 사업 목록 렌더링
    function renderProjects() {
      const searchTerm = searchInput.value.toLowerCase();
      
      const filteredProjects = projects.filter(project => 
        project.name.toLowerCase().includes(searchTerm) || 
        project.department.toLowerCase().includes(searchTerm) ||
        project.manager.toLowerCase().includes(searchTerm)
      );
      
      if (filteredProjects.length === 0) {
        projectTableBody.innerHTML = '<tr><td colspan="8" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }
      
      // 테이블 생성
      projectTableBody.innerHTML = filteredProjects.map(project => `
        <tr class="border-b hover:bg-gray-50" data-id="${project.id}">
          <td class="px-4 py-2">
            <input 
              type="radio" 
              name="project-select" 
              class="project-radio"
              ${selectedProjectId === project.id ? 'checked' : ''}
            >
          </td>
          <td class="px-4 py-2">${project.name || '-'}</td>
          <td class="px-4 py-2">${formatNumber(project.budget) || '-'}</td>
          <td class="px-4 py-2">${formatDate(project.startDate) || '-'}</td>
          <td class="px-4 py-2">${formatDate(project.endDate) || '-'}</td>
          <td class="px-4 py-2">${project.manager || '-'}</td>
          <td class="px-4 py-2">${project.department || '-'}</td>
          <td class="px-4 py-2">
            <span class="${getStatusClass(project.status)}">${project.status || '-'}</span>
          </td>
        </tr>
      `).join('');
      
      // 라디오 버튼 이벤트 리스너 추가
      document.querySelectorAll('.project-radio').forEach(radio => {
        radio.addEventListener('change', handleProjectSelection);
      });
      
      // 테이블 행 클릭 이벤트 추가
      document.querySelectorAll('#projectTableBody tr').forEach(row => {
        row.addEventListener('click', function() {
          const radio = this.querySelector('.project-radio');
          if (radio) {
            radio.checked = true;
            selectedProjectId = this.dataset.id;
            updateButtonStates();
          }
        });
      });
      
      // 버튼 상태 업데이트
      updateButtonStates();
    }
    
    // 상태에 따른 클래스 반환
    function getStatusClass(status) {
      if (!status) return '';
      
      switch(status) {
        case '완료': return 'text-green-600 font-medium';
        case '진행중': return 'text-blue-600 font-medium';
        case '준비중': return 'text-yellow-600 font-medium';
        case '중단': return 'text-red-600 font-medium';
        default: return '';
      }
    }
    
    // 프로젝트 선택 처리
    function handleProjectSelection(event) {
      selectedProjectId = event.target.closest('tr').dataset.id;
      updateButtonStates();
    }
    
    // 버튼 상태 업데이트
    function updateButtonStates() {
      const hasSelection = selectedProjectId !== null;
      
      editButton.disabled = !hasSelection;
      deleteButton.disabled = !hasSelection;
      
      if (hasSelection) {
        editButton.classList.remove('opacity-50', 'cursor-not-allowed');
        deleteButton.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        editButton.classList.add('opacity-50', 'cursor-not-allowed');
        deleteButton.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }
    
    // 숫자 포맷팅
    function formatNumber(num) {
      if (num === undefined || num === null) return '';
      return new Intl.NumberFormat('ko-KR').format(num);
    }
    
    // 날짜 포맷팅
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // 날짜 유효성 검사
    function isValidDate(dateString) {
      if (!dateString) return false;
      const date = new Date(dateString);
      return !isNaN(date.getTime());
    }
    
    // 모달 열기/닫기 함수들
    function openAddModal() {
      addForm.reset();
      addModal.classList.remove('hidden');
    }
    
    function closeAddModal() {
      addModal.classList.add('hidden');
    }
    
    function openEditModal() {
      if (!selectedProjectId) return;
      
      const project = projects.find(p => p.id === selectedProjectId);
      if (!project) return;
      
      document.getElementById('editName').value = project.name || '';
      document.getElementById('editBudget').value = project.budget || '';
      document.getElementById('editStartDate').value = project.startDate || '';
      document.getElementById('editEndDate').value = project.endDate || '';
      document.getElementById('editManager').value = project.manager || '';
      document.getElementById('editDepartment').value = project.department || '';
      document.getElementById('editStatus').value = project.status || '';
      
      editModal.classList.remove('hidden');
    }
    
    function closeEditModal() {
      editModal.classList.add('hidden');
    }
    
    function openDeleteModal() {
      if (!selectedProjectId) return;
      
      const project = projects.find(p => p.id === selectedProjectId);
      if (!project) return;
      
      deleteProjectName.textContent = project.name;
      deleteModal.classList.remove('hidden');
    }
    
    function closeDeleteModal() {
      deleteModal.classList.add('hidden');
    }
    
    // 사업 추가 처리
    async function addProject(event) {
      event.preventDefault();
      
      const name = document.getElementById('addName').value.trim();
      const budget = parseInt(document.getElementById('addBudget').value.replace(/,/g, '')) || 0;
      const startDate = document.getElementById('addStartDate').value;
      const endDate = document.getElementById('addEndDate').value;
      const manager = document.getElementById('addManager').value.trim();
      const department = document.getElementById('addDepartment').value.trim();
      const status = document.getElementById('addStatus').value;
      
      // 유효성 검사
      if (!name) {
        alert('사업명을 입력해주세요.');
        return;
      }
      
      if (!isValidDate(startDate)) {
        alert('유효한 시작일을 입력해주세요.');
        return;
      }
      
      if (!isValidDate(endDate)) {
        alert('유효한 종료일을 입력해주세요.');
        return;
      }
      
      if (new Date(startDate) > new Date(endDate)) {
        alert('종료일은 시작일 이후여야 합니다.');
        return;
      }
      
      // 새 프로젝트 정보
      const newProject = {
        name,
        budget,
        startDate,
        endDate,
        manager,
        department,
        status
      };
      
      try {
        // API 호출
        const result = await addData('사업정보', newProject);
        
        if (result.success) {
          // 성공 시 데이터 갱신
          await loadProjects();
          closeAddModal();
          alert('사업 정보가 추가되었습니다.');
        } else {
          throw new Error(result.error || '추가 실패');
        }
      } catch (error) {
        console.error('API 오류:', error);
        alert('사업 정보 추가 중 오류가 발생했습니다.');
        
        // API 실패 시 로컬 데이터만 갱신 (테스트용)
        newProject.id = String(Date.now());
        projects.push(newProject);
        renderProjects();
        closeAddModal();
      }
    }
    
    // 사업 수정 처리
    async function editProject(event) {
      event.preventDefault();
      
      if (!selectedProjectId) return;
      
      const name = document.getElementById('editName').value.trim();
      const budget = parseInt(document.getElementById('editBudget').value.replace(/,/g, '')) || 0;
      const startDate = document.getElementById('editStartDate').value;
      const endDate = document.getElementById('editEndDate').value;
      const manager = document.getElementById('editManager').value.trim();
      const department = document.getElementById('editDepartment').value.trim();
      const status = document.getElementById('editStatus').value;
      
      // 유효성 검사
      if (!name) {
        alert('사업명을 입력해주세요.');
        return;
      }
      
      if (!isValidDate(startDate)) {
        alert('유효한 시작일을 입력해주세요.');
        return;
      }
      
      if (!isValidDate(endDate)) {
        alert('유효한 종료일을 입력해주세요.');
        return;
      }
      
      if (new Date(startDate) > new Date(endDate)) {
        alert('종료일은 시작일 이후여야 합니다.');
        return;
      }
      
      // 수정된 프로젝트 정보
      const updatedProject = {
        id: selectedProjectId,
        name,
        budget,
        startDate,
        endDate,
        manager,
        department,
        status
      };
      
      try {
        // API 호출
        const result = await updateData('사업정보', updatedProject);
        
        if (result.success) {
          // 성공 시 데이터 갱신
          await loadProjects();
          closeEditModal();
          alert('사업 정보가 수정되었습니다.');
        } else {
          throw new Error(result.error || '수정 실패');
        }
      } catch (error) {
        console.error('API 오류:', error);
        alert('사업 정보 수정 중 오류가 발생했습니다.');
        
        // API 실패 시 로컬 데이터만 갱신 (테스트용)
        const index = projects.findIndex(p => p.id === selectedProjectId);
        if (index !== -1) {
          projects[index] = updatedProject;
          renderProjects();
          closeEditModal();
        }
      }
    }
    
    // 사업 삭제 처리
    async function deleteProject() {
      if (!selectedProjectId) return;
      
      try {
        // API 호출
        const result = await deleteData('사업정보', selectedProjectId);
        
        if (result.success) {
          // 성공 시 데이터 갱신
          await loadProjects();
          selectedProjectId = null;
          closeDeleteModal();
          alert('사업 정보가 삭제되었습니다.');
        } else {
          throw new Error(result.error || '삭제 실패');
        }
      } catch (error) {
        console.error('API 오류:', error);
        alert('사업 정보 삭제 중 오류가 발생했습니다.');
        
        // API 실패 시 로컬 데이터만 갱신 (테스트용)
        projects = projects.filter(p => p.id !== selectedProjectId);
        selectedProjectId = null;
        renderProjects();
        closeDeleteModal();
      }
    }
    
    // 엑셀 다운로드
    async function downloadExcel() {
      try {
        const result = await downloadExcelFile('사업정보');
        
        if (!result.success) {
          throw new Error(result.error || '다운로드 실패');
        }
        
        // 성공 메시지
        alert('엑셀 파일 다운로드가 완료되었습니다.');
      } catch (error) {
        console.error('API 오류:', error);
        alert('엑셀 파일 다운로드 중 오류가 발생했습니다.');
      }
    }
    
    // 이벤트 리스너 등록
    document.addEventListener('DOMContentLoaded', () => {
      // 데이터 로드
      loadProjects();
      
      // 검색 및 필터링
      searchButton.addEventListener('click', renderProjects);
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          renderProjects();
        }
      });
      
      // 버튼 이벤트
      addButton.addEventListener('click', openAddModal);
      editButton.addEventListener('click', openEditModal);
      deleteButton.addEventListener('click', openDeleteModal);
      
      // 폼 제출 이벤트
      addForm.addEventListener('submit', addProject);
      editForm.addEventListener('submit', editProject);
      
      // 모달 닫기 버튼
      document.getElementById('addCancelButton').addEventListener('click', closeAddModal);
      document.getElementById('editCancelButton').addEventListener('click', closeEditModal);
      document.getElementById('deleteNoButton').addEventListener('click', closeDeleteModal);
      
      // 삭제 확인 버튼
      document.getElementById('deleteYesButton').addEventListener('click', deleteProject);
      
      // 엑셀 다운로드 버튼
      document.getElementById('excelButton').addEventListener('click', downloadExcel);
      
      // 포맷팅 이벤트
      const budgetInputs = [document.getElementById('addBudget'), document.getElementById('editBudget')];
      budgetInputs.forEach(input => {
        input.addEventListener('input', function() {
          let value = this.value.replace(/[^\d]/g, '');
          if (value) {
            value = parseInt(value).toLocaleString('ko-KR');
            this.value = value;
          }
        });
      });
    });
  </script>
</body>
</html>
