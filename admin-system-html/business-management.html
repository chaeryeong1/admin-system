    // ?„í„°ë§ëœ ?„ë¡œ?íŠ¸ ëª©ë¡ ?»ê¸°
    function getFilteredProjects() {
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!searchTerm) return [...projects];
      
      return projects.filter(project => {
        return (
          (project.name && project.name.toLowerCase().includes(searchTerm)) ||
          (project.organizer && project.organizer.toLowerCase().includes(searchTerm))
        );
      });
    }
    
    // ?„ë¡œ?íŠ¸ ?•ë ¬
    function sortProjects(projects) {
      return [...projects].sort((a, b) => {
        let valueA = a[currentSortColumn] || '';
        let valueB = b[currentSortColumn] || '';
        
        // ?«ì ?•ë ¬
        if (currentSortColumn === 'targetCount') {
          valueA = parseInt(valueA) || 0;
          valueB = parseInt(valueB) || 0;
        } 
        // ë¬¸ì???•ë ¬
        else {
          valueA = String(valueA).toLowerCase();
          valueB = String(valueB).toLowerCase();
        }
        
        if (valueA < valueB) return currentSortDirection === 'asc' ? -1 : 1;
        if (valueA > valueB) return currentSortDirection === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function updatePagination(totalItems) {
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      const startItem = totalItems === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
      const endItem = Math.min(currentPage * itemsPerPage, totalItems);
      
      document.getElementById('totalItems').textContent = totalItems;
      document.getElementById('startItem').textContent = startItem;
      document.getElementById('endItem').textContent = endItem;
      
      document.getElementById('prevPageBtn').disabled = currentPage <= 1;
      document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
      
      // ?˜ì´ì§€ ë²ˆí˜¸ ?…ë°?´íŠ¸
      const paginationNumbers = document.getElementById('paginationNumbers');
      paginationNumbers.textContent = `${currentPage} / ${totalPages || 1}`;
    }

          <div class="font-semibold text-gray-800">ë¡œë”© ì¤?..</div>
        </div>
      `;
      
      document.body.appendChild(loading);
    }
    
    function hideLoading() {
      const loading = document.getElementById('loadingOverlay');
      if (loading) {
        loading.remove();
      }
    }
    
    function showToast(message, type = 'info') {
      // ê¸°ì¡´ ? ìŠ¤???œê±°
      const existingToasts = document.querySelectorAll('.toast');
      existingToasts.forEach(toast => toast.remove());
      
      // ? ìŠ¤???‰ìƒ ?¤ì •
      let bgColor = 'bg-blue-600';
      let icon = '<i class="fas fa-info-circle mr-2"></i>';
      
      if (type === 'success') {
        bgColor = 'bg-green-600';
        icon = '<i class="fas fa-check-circle mr-2"></i>';
      } else if (type === 'error') {
        bgColor = 'bg-red-600';
        icon = '<i class="fas fa-exclamation-circle mr-2"></i>';
      } else if (type === 'warning') {
        bgColor = 'bg-yellow-600';
        icon = '<i class="fas fa-exclamation-triangle mr-2"></i>';
      }
      
      // ? ìŠ¤???ì„±
      const toast = document.createElement('div');
      toast.className = `toast fixed top-4 right-4 z-50 ${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center`;
      toast.innerHTML = `
        ${icon}
        <span>${message}</span>
      `;
      
      document.body.appendChild(toast);
      
      // 3ì´????ë™ ?œê±°
      setTimeout(() => {
        toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.remove();
          }
        }, 500);
      }, 3000);
    }
  </script>
</body>
</html>
