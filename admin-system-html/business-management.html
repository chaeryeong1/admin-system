<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 사업 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-blue-600">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="cashback-management.html" class="text-gray-500">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">사업 관리</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">ㆍ사업 리스트 관리</li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">사업 리스트 관리</div>

      <!-- 검색/조회 -->
      <div class="flex items-center space-x-4">
        <input 
          id="searchInput"
          type="text" 
          placeholder="사업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
        <div class="flex-1 text-right">
          <button 
            id="addButton"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            + 추가
          </button>
        </div>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">선택</th>
                <th class="px-4 py-2 text-left">사업명</th>
                <th class="px-4 py-2 text-left">목표 업체 수</th>
                <th class="px-4 py-2 text-left">진행 기간</th>
                <th class="px-4 py-2 text-left">주최기관</th>
                <th class="px-4 py-2 text-left">공고</th>
              </tr>
            </thead>
            <tbody id="projectTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="editButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
        >
          수정
        </button>
        <button 
          id="deleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 모달 -->
  <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업명을 입력하세요</h2>
      <input
        id="newProjectName"
        type="text"
        placeholder="클라우드 고도화 지원사업"
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelAddButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmAddButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 정보 수정</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">사업명</label>
          <input
            id="editProjectName"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">목표 업체 수</label>
          <input
            id="editProjectTarget"
            type="number"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">시작일</label>
          <input
            id="editProjectStartDate"
            type="date"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">종료일</label>
          <input
            id="editProjectEndDate"
            type="date"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">주최기관</label>
          <input
            id="editProjectOrganizer"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">공고 URL</label>
          <input
            id="editProjectNoticeUrl"
            type="text"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelEditButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmEditButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">사업 삭제</h2>
      <p>정말 이 사업을 삭제하시겠습니까?</p>
      <p id="deleteProjectName" class="font-semibold mt-2"></p>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelDeleteButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmDeleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // Google Apps Script API URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbwE8lrESavbFCRpnWF1C2h7h-q0essFRVHqONkVzitF7z6IZJudIIvS4kH2V2HcRDo/exec';
    
    // DOM 요소
    const projectTableBody = document.getElementById('projectTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addButton = document.getElementById('addButton');
    const editButton = document.getElementById('editButton');
    const deleteButton = document.getElementById('deleteButton');
    
    // 데이터 상태
    let projects = [];
    let selectedProjectIds = [];
    
    // 프로젝트 데이터 로드
    async function loadProjects() {
      try {
        // 로딩 표시
        projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center">데이터를 불러오는 중...</td></tr>';
        
        // API에서 데이터 가져오기
        const data = await fetchData('사업정보');
        
        if (data.success) {
          projects = data.projects || [];
          renderProjects();
          updateButtonStates();
        } else {
          projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center text-red-500">데이터를 불러오는데 실패했습니다.</td></tr>';
          console.error('API 응답에 데이터가 없습니다:', data);
        }
      } catch (error) {
        projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center text-red-500">서버 연결 오류</td></tr>';
        console.error('API 호출 오류:', error);
      }
    }
    
    // 프로젝트 목록 렌더링
    function renderProjects() {
      // 필터링 적용
      const searchTerm = searchInput.value.toLowerCase();
      
      const filteredProjects = projects.filter(project => {
        return project.name && project.name.toLowerCase().includes(searchTerm);
      });
      
      // 결과가 없을 경우
      if (filteredProjects.length === 0) {
        projectTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }
      
      // 테이블 생성
      let html = '';
      filteredProjects.forEach(project => {
        html += `
          <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-2">
              <input 
                type="checkbox" 
                class="project-checkbox" 
                data-id="${project.id}"
              >
            </td>
            <td class="px-4 py-2">${project.name || ''}</td>
            <td class="px-4 py-2">${project.target || 0}개</td>
            <td class="px-4 py-2">${formatDateRange(project.startDate, project.endDate)}</td>
            <td class="px-4 py-2">${project.organizer || ''}</td>
            <td class="px-4 py-2">
              ${project.noticeUrl ? 
                `<a href="${project.noticeUrl}" target="_blank" class="text-blue-600 hover:underline">공고 보기</a>` :
                '<span class="text-gray-400">없음</span>'
              }
            </td>
          </tr>
        `;
      });
      
      projectTableBody.innerHTML = html;
      setupCheckboxes();
    }
    
    // 날짜 범위 포맷팅
    function formatDateRange(startDate, endDate) {
      return `${formatDate(startDate || '')} ~ ${formatDate(endDate || '')}`;
    }
    
    // 날짜 포맷팅
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString;
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // 체크박스 이벤트 설정
    function setupCheckboxes() {
      const checkboxes = document.querySelectorAll('.project-checkbox');
      checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
          const projectId = parseInt(this.getAttribute('data-id'));
          
          if (this.checked) {
            selectedProjectIds.push(projectId);
          } else {
            const index = selectedProjectIds.indexOf(projectId);
            if (index > -1) {
              selectedProjectIds.splice(index, 1);
            }
          }
          
          // 버튼 활성화/비활성화
          updateButtonStates();
        });
      });
    }
    
    // 버튼 상태 업데이트
    function updateButtonStates() {
      if (selectedProjectIds.length === 0) {
        editButton.disabled = true;
        deleteButton.disabled = true;
        editButton.classList.add('opacity-50');
        deleteButton.classList.add('opacity-50');
      } else if (selectedProjectIds.length === 1) {
        editButton.disabled = false;
        deleteButton.disabled = false;
        editButton.classList.remove('opacity-50');
        deleteButton.classList.remove('opacity-50');
      } else {
        editButton.disabled = true;
        deleteButton.disabled = false;
        editButton.classList.add('opacity-50');
        deleteButton.classList.remove('opacity-50');
      }
    }
    
    // 사업 추가
    async function addProject(project) {
      try {
        const result = await addData('사업정보', project);
        if (result.success) {
          await loadProjects();
          return true;
        } else {
          console.error('사업 추가 실패:', result.error);
          return false;
        }
      } catch (error) {
        console.error('사업 추가 오류:', error);
        return false;
      }
    }
    
    // 사업 수정
    async function updateProject(project) {
      try {
        const result = await updateData('사업정보', project);
        if (result.success) {
          await loadProjects();
          return true;
        } else {
          console.error('사업 수정 실패:', result.error);
          return false;
        }
      } catch (error) {
        console.error('사업 수정 오류:', error);
        return false;
      }
    }
    
    // 사업 삭제
    async function deleteProject(id) {
      try {
        const result = await deleteData('사업정보', id);
        if (result.success) {
          return true;
        } else {
          console.error('사업 삭제 실패:', result.error);
          return false;
        }
      } catch (error) {
        console.error('사업 삭제 오류:', error);
        return false;
      }
    }
    
    // 문서 로드 시 실행
    document.addEventListener('DOMContentLoaded', function() {
      // 초기 데이터 로드
      loadProjects();
      
      // 검색 이벤트
      searchButton.addEventListener('click', renderProjects);
      searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          renderProjects();
        }
      });
      
      // 추가 버튼
      addButton.addEventListener('click', function() {
        document.getElementById('newProjectName').value = '';
        document.getElementById('newProjectTarget').value = '';
        document.getElementById('newProjectStartDate').value = '';
        document.getElementById('newProjectEndDate').value = '';
        document.getElementById('newProjectOrganizer').value = '';
        document.getElementById('newProjectNoticeUrl').value = '';
        document.getElementById('addModal').classList.remove('hidden');
      });
      
      // 수정 버튼
      editButton.addEventListener('click', function() {
        if (selectedProjectIds.length !== 1) return;
        
        const projectId = selectedProjectIds[0];
        const project = projects.find(p => p.id === projectId);
        
        if (project) {
          // 모달에 데이터 채우기
          document.getElementById('editProjectName').value = project.name || '';
          document.getElementById('editProjectTarget').value = project.target || '';
          document.getElementById('editProjectStartDate').value = project.startDate || '';
          document.getElementById('editProjectEndDate').value = project.endDate || '';
          document.getElementById('editProjectOrganizer').value = project.organizer || '';
          document.getElementById('editProjectNoticeUrl').value = project.noticeUrl || '';
          
          // 모달 표시
          document.getElementById('editModal').classList.remove('hidden');
        }
      });
      
      // 삭제 버튼
      deleteButton.addEventListener('click', function() {
        if (selectedProjectIds.length === 0) return;
        
        if (selectedProjectIds.length === 1) {
          const projectId = selectedProjectIds[0];
          const project = projects.find(p => p.id === projectId);
          
          if (project) {
            document.getElementById('deleteProjectName').textContent = project.name;
          }
        } else {
          document.getElementById('deleteProjectName').textContent = `선택된 ${selectedProjectIds.length}개 사업`;
        }
        
        // 모달 표시
        document.getElementById('deleteModal').classList.remove('hidden');
      });
      
      // 모달 닫기 버튼들
      document.getElementById('cancelAddButton').addEventListener('click', function() {
        document.getElementById('addModal').classList.add('hidden');
      });
      
      document.getElementById('cancelEditButton').addEventListener('click', function() {
        document.getElementById('editModal').classList.add('hidden');
      });
      
      document.getElementById('cancelDeleteButton').addEventListener('click', function() {
        document.getElementById('deleteModal').classList.add('hidden');
      });
      
      // 모달 확인 버튼들
      document.getElementById('confirmAddButton').addEventListener('click', async function() {
        const name = document.getElementById('newProjectName').value.trim();
        const target = parseInt(document.getElementById('newProjectTarget').value) || 0;
        const startDate = document.getElementById('newProjectStartDate').value;
        const endDate = document.getElementById('newProjectEndDate').value;
        const organizer = document.getElementById('newProjectOrganizer').value;
        const noticeUrl = document.getElementById('newProjectNoticeUrl').value;
        
        if (!name) {
          alert('사업명을 입력하세요.');
          return;
        }
        
        if (!target) {
          alert('목표 업체 수를 입력하세요.');
          return;
        }
        
        if (!startDate || !endDate) {
          alert('사업 기간을 입력하세요.');
          return;
        }
        
        const newProject = {
          name: name,
          target: target,
          startDate: startDate,
          endDate: endDate,
          organizer: organizer,
          noticeUrl: noticeUrl
        };
        
        const success = await addProject(newProject);
        if (success) {
          document.getElementById('addModal').classList.add('hidden');
        } else {
          alert('사업 추가에 실패했습니다.');
        }
      });
      
      document.getElementById('confirmEditButton').addEventListener('click', async function() {
        if (selectedProjectIds.length !== 1) return;
        
        const projectId = selectedProjectIds[0];
        const name = document.getElementById('editProjectName').value.trim();
        const target = parseInt(document.getElementById('editProjectTarget').value) || 0;
        const startDate = document.getElementById('editProjectStartDate').value;
        const endDate = document.getElementById('editProjectEndDate').value;
        const organizer = document.getElementById('editProjectOrganizer').value;
        const noticeUrl = document.getElementById('editProjectNoticeUrl').value;
        
        if (!name) {
          alert('사업명을 입력하세요.');
          return;
        }
        
        if (!target) {
          alert('목표 업체 수를 입력하세요.');
          return;
        }
        
        if (!startDate || !endDate) {
          alert('사업 기간을 입력하세요.');
          return;
        }
        
        const updatedProject = {
          id: projectId,
          name: name,
          target: target,
          startDate: startDate,
          endDate: endDate,
          organizer: organizer,
          noticeUrl: noticeUrl
        };
        
        const success = await updateProject(updatedProject);
        if (success) {
          document.getElementById('editModal').classList.add('hidden');
        } else {
          alert('사업 수정에 실패했습니다.');
        }
      });
      
      document.getElementById('confirmDeleteButton').addEventListener('click', async function() {
        let allSuccess = true;
        
        for (const id of selectedProjectIds) {
          const success = await deleteProject(id);
          if (!success) {
            allSuccess = false;
          }
        }
        
        if (allSuccess) {
          selectedProjectIds = [];
          await loadProjects();
          document.getElementById('deleteModal').classList.add('hidden');
        } else {
          alert('일부 사업 삭제에 실패했습니다.');
        }
      });
    });
  </script>
</body>
</html>
