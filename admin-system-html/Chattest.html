<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>GPT 챗봇</title>
</head>
<body>
  <h2>GPT에 물어보기</h2>
  <textarea id="input" rows="5" cols="50" placeholder="프롬프트 입력"></textarea><br>
  <button onclick="askGPT()">전송</button>
  <h3>GPT 응답:</h3>
  <pre id="response">여기에 결과가 나옵니다</pre>

  <script>
    async function askGPT() {
      const prompt = document.getElementById("input").value;
      const responseBox = document.getElementById("response");
      responseBox.innerText = "GPT 응답 대기 중...";

      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer sk-여기에_API_키_입력"  // ← 여기에 본인 키 입력
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [{ role: "user", content: prompt }]
        })
      });

      const data = await res.json();
      responseBox.innerText = data.choices?.[0]?.message?.content || "에러 발생";
    }
  </script>
</body>
</html>
