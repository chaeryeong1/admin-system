  <!-- 공통 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- API 스크립트 먼저 로드 -->
  <script src="../js/api.js"></script>
  <script>
    // 기본 설정
    let companies = [], selectedCompanyIds = [], currentPage = 1;
    let itemsPerPage = 10; // 기본값 설정
    let currentSortColumn = 'id', currentSortDirection = 'asc', isLoading = false;
    let lastApiCallTimestamp = 0;
    let notificationData = [];
    let businessList = [];
    
    document.addEventListener('DOMContentLoaded', function() {
      // 모바일 메뉴
      document.querySelector('.mobile-menu-button')?.addEventListener('click', () => 
        document.querySelector('.mobile-menu')?.classList.toggle('hidden'));
      
      // 사업 목록 로드
      loadBusinessList();
      
      // 페이지 초기화 시 기업정보 데이터 로드
      loadCompanyData();
      
      // 테이블 정렬 버튼 설정
      setupSortButtons();
      
      // 검색, 정렬, 페이지네이션
      document.getElementById('selectAllCheckbox')?.addEventListener('change', toggleSelectAll);
      document.getElementById('searchButton')?.addEventListener('click', function() {
        currentPage = 1;
        const selectedBusiness = document.getElementById('businessSelect')?.value;
        const searchTerm = document.getElementById('searchInput')?.value.trim();
        
        loadCompanyData(selectedBusiness, searchTerm);
      });
      
      document.getElementById('searchInput')?.addEventListener('keypress', e => { 
        if (e.key === 'Enter') {
          document.getElementById('searchButton')?.click();
        }
      });
      
      document.getElementById('businessSelect')?.addEventListener('change', function() {
        const selectedBusinessId = this.value;
        if (!selectedBusinessId) {
          // 전체 기업 선택 시
          loadCompanyData('', document.getElementById('searchInput')?.value.trim() || '');
        } else {
          filterByBusiness(selectedBusinessId);
        }
      });
      
      // 페이지네이션 버튼
      document.getElementById('prevPageBtn')?.addEventListener('click', () => {
        if (!isLoading && currentPage > 1) { 
          currentPage--; 
          renderTable();
          updatePaginationButtons();
        }
      });
      
      document.getElementById('nextPageBtn')?.addEventListener('click', () => {
        if (!isLoading) {
          const totalPages = Math.ceil(companies.length / itemsPerPage);
          if (currentPage < totalPages) { 
            currentPage++; 
            renderTable();
            updatePaginationButtons();
          }
        }
      });
      
      // 안내 사업 지정 버튼 이벤트
      document.getElementById('selectBusinessButton')?.addEventListener('click', function() {
        // 선택된 기업이 있는지 확인
        const selectedCompanies = document.querySelectorAll('.company-checkbox:checked');
        if (selectedCompanies.length === 0) {
          alert('안내 대상으로 지정할 기업을 선택해주세요.');
          return;
        }
        
        // 안내 사업 선택 모달 표시
        openSelectBusinessModal();
      });
      
      // 안내 사업 선택 모달 이벤트
      document.getElementById('cancelSelectBusinessButton')?.addEventListener('click', closeModals);
      document.getElementById('confirmSelectBusinessButton')?.addEventListener('click', async function() {
        const selectedBusinessIds = Array.from(
          document.querySelectorAll('.business-checkbox:checked')
        ).map(checkbox => checkbox.value);
        
        if (selectedBusinessIds.length === 0) {
          alert('하나 이상의 안내 사업을 선택해주세요.');
          return;
        }
        
        // 모달 콘텐츠 영역
        const modalContent = document.querySelector('#selectBusinessModal .bg-white');
        if (modalContent) {
          // 전체 모달에 로딩 표시
          const loadingDiv = document.createElement('div');
          loadingDiv.className = 'absolute inset-0 bg-white bg-opacity-90 flex flex-col items-center justify-center z-10';
          loadingDiv.id = 'modal-loading';
          loadingDiv.innerHTML = `
            <div class="loading-message mb-4">
              <div class="loading-icon">
                <div class="fishing-handle"></div>
                <div class="fishing-rod"></div>
                <div class="fishing-line"></div>
                <div class="fishing-fish">🐟</div>
              </div>
            </div>
            <div class="text-center">
              <div class="text-lg font-medium mb-2">기업 할당 중...</div>
              <div class="text-sm text-gray-600 mb-4">선택한 기업들을 사업에 할당하고 있습니다.</div>
              <div class="w-64 bg-gray-200 rounded-full h-2.5 mb-2">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
              </div>
              <div id="progressText" class="text-sm text-gray-600">0%</div>
            </div>
          `;
          modalContent.style.position = 'relative';
          modalContent.appendChild(loadingDiv);
        }
        
        try {
          // 각 선택된 사업에 대해 기업 할당
          const totalAssignments = selectedBusinessIds.length;
          let completedAssignments = 0;
          
          for (const businessId of selectedBusinessIds) {
            const result = await assignCompaniesToBusiness(businessId);
            completedAssignments++;
            
            // 진행률 업데이트
            const progress = Math.round((completedAssignments / totalAssignments) * 100);
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            if (progressBar) progressBar.style.width = `${progress}%`;
            if (progressText) progressText.textContent = `${progress}%`;
          }
          
          // 성공 메시지 표시
          const loadingDiv = document.getElementById('modal-loading');
          if (loadingDiv) {
            loadingDiv.innerHTML = `
              <div class="text-center">
                <div class="text-green-500 text-4xl mb-4">
                  <i class="fas fa-check-circle"></i>
                </div>
                <div class="text-lg font-medium mb-2">할당 완료!</div>
                <div class="text-sm text-gray-600">선택한 기업들이 성공적으로 할당되었습니다.</div>
              </div>
            `;
          }
          
          // 2초 후 모달 닫기
          setTimeout(() => {
            closeModals();
          }, 2000);
          
        } catch (error) {
          console.error('할당 중 오류 발생:', error);
          const loadingDiv = document.getElementById('modal-loading');
          if (loadingDiv) {
            loadingDiv.innerHTML = `
              <div class="text-center">
                <div class="text-red-500 text-4xl mb-4">
                  <i class="fas fa-exclamation-circle"></i>
                </div>
                <div class="text-lg font-medium mb-2">오류 발생</div>
                <div class="text-sm text-gray-600">기업 할당 중 오류가 발생했습니다.</div>
                <button class="mt-4 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300" onclick="closeModals()">
                  닫기
                </button>
              </div>
            `;
          }
        }
      });
      
      // 모달 취소/확인 버튼
      document.getElementById('cancelAddButton')?.addEventListener('click', closeModals);
      document.getElementById('confirmAddButton')?.addEventListener('click', () => handleCrud('add'));
      document.getElementById('cancelDeleteButton')?.addEventListener('click', closeModals);
      document.getElementById('confirmDeleteButton')?.addEventListener('click', () => handleCrud('delete'));
      
      // 이미지 미리보기 모달 닫기 버튼
      document.getElementById('closePreviewButton')?.addEventListener('click', function() {
        imagePreviewObj.closeModal();
      });
      
      // 페이지당 항목 수 변경 이벤트 리스너 추가
      document.getElementById('itemsPerPage').addEventListener('change', function() {
        itemsPerPage = parseInt(this.value);
        currentPage = 1; // 페이지를 1로 리셋
        renderTable(); // 테이블 다시 렌더링
      });
    });

    // 기업 데이터 로드 함수 수정
    async function loadCompanyData(selectedBusinessId = '', searchTerm = '') {
      try {
        isLoading = true;
        
        // 로딩 메시지 표시
        const tbody = document.getElementById('companyTableBody');
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8">' +
          '<div class="flex flex-col items-center justify-center">' +
          '<div class="fishing-loader" style="margin-bottom: 15px;">' +
          '<div class="fishing-handle"></div>' +
          '<div class="fishing-rod"></div>' +
          '<div class="fishing-line"></div>' +
          '<i class="fas fa-hook fishing-hook"></i>' +
          '<i class="fas fa-fish fishing-fish"></i>' +
          '</div>' +
          `<p class="text-gray-600 font-medium">데이터 낚시 중... 곧 데이터가 잡힐 것 같아요! 🎣</p>` +
          '</div></td></tr>';
        }
        
        // 기업정보와 사업정보를 한 번에 병렬로 로드
        const [companyRes, businessRes] = await Promise.all([
          fetchData('기업정보'),
          fetchData('사업정보')
        ]);

        if (!companyRes.success || !businessRes.success) {
          console.error('데이터 로딩 실패:', companyRes.error || businessRes.error);
          return;
        }

        companies = companyRes.data || [];
        businessList = businessRes.data || [];
        
        // 안내정보 로드
        const notificationRes = await fetchData('안내정보');
        if (!notificationRes.success) {
          console.error('안내정보 로딩 실패:', notificationRes.error);
          return;
        }
        notificationData = notificationRes.data || [];
        
        // 기업 데이터에 안내 정보 연결 - 여러 사업 할당 지원
        companies = companies.map(company => {
          // 해당 기업에 할당된 모든 안내 정보 찾기
          const notifications = notificationData.filter(n => n.companyId === company.id);
          
          if (notifications.length > 0) {
            // 기업에 할당된 사업 정보 배열 생성
            company.businesses = notifications.map(notification => {
              const business = businessList.find(b => b.id === notification.businessId);
              if (business) {
                return {
                  id: business.id,
                  name: business.name,
                  color: getBusinessColor(business.id)
                };
              }
              return null;
            }).filter(b => b !== null); // null 제거
            
            // 첫 번째 사업자등록증 정보 사용 (있는 경우)
            const saupjaddNotification = notifications.find(n => n.saupjadd);
            if (saupjaddNotification) {
              company.saupjadd = saupjaddNotification.saupjadd;
            }
          } else {
            company.businesses = [];
          }
          
          return company;
        });

        // 선택된 사업의 기업만 필터링
        if (selectedBusinessId) {
          console.log(`선택된 사업 ID: ${selectedBusinessId} 기업 필터링 전: ${companies.length}`);
          const targetCompanyIds = notificationData
            .filter(n => n.businessId === selectedBusinessId)
            .map(n => n.companyId);
          
          console.log(`사업 ${selectedBusinessId}에 할당된 기업 ID 수: ${targetCompanyIds.length}`);
          companies = companies.filter(company => targetCompanyIds.includes(company.id));
          console.log(`필터링 후 기업 수: ${companies.length}`);
        }

        // 검색어로 필터링
        if (searchTerm) {
          companies = companies.filter(c =>
            Object.values(c).some(val => {
              if (val === null || val === undefined) return false;
              if (typeof val === 'string') return val.toLowerCase().includes(searchTerm.toLowerCase());
              if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'object') {
                return val.some(item => 
                  Object.values(item).some(subVal => 
                    subVal && typeof subVal === 'string' && subVal.toLowerCase().includes(searchTerm.toLowerCase())
                  )
                );
              }
              return String(val).toLowerCase().includes(searchTerm.toLowerCase());
            })
          );
        }

        // 정렬 적용
        if (currentSortColumn && currentSortDirection) {
          sortTable(currentSortColumn, currentSortDirection);
        } else {
          renderTable();
        }
      } catch (e) {
        console.error('loadCompanyData 오류:', e);
        const tbody = document.getElementById('companyTableBody');
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8">' +
          '<div class="flex flex-col items-center justify-center">' +
          '<div class="fishing-loader" style="margin-bottom: 15px;">' +
          '<div class="fishing-handle"></div>' +
          '<div class="fishing-rod"></div>' +
          '<div class="fishing-line"></div>' +
          '<i class="fas fa-hook fishing-hook"></i>' +
          '<i class="fas fa-fish fishing-fish"></i>' +
          '</div>' +
          '<p class="text-gray-600 font-medium">데이터 로딩에 뭔가 문제가 생긴 것 같아요...<br>새로고침(F5) 해 주세요!</p>' +
          '</div></td></tr>';
        }
      } finally {
        isLoading = false;
      }
    }

    // 사업별 색상 매핑
    function getBusinessColor(businessId) {
      const colors = [
        '#FF0000', // 진한 빨간색
        '#008B8B', // 진한 청록색
        '#0066CC', // 진한 하늘색
        '#006400', // 진한 녹색
        '#FFD700', // 진한 노란색
        '#8B0000', // 진한 분홍색
        '#4B0082', // 진한 보라색
        '#000080', // 진한 파란색
        '#8B0000', // 진한 빨간색
        '#006400'  // 진한 녹색
      ];
      
      // 비즈니스 ID가 없거나 유효하지 않은 경우 기본 색상 반환
      if (!businessId || typeof businessId !== 'string') {
        return '#404040'; // 진한 회색
      }
      
      // ID에서 숫자만 추출
      const numericId = businessId.replace(/\D/g, '');
      const index = numericId ? parseInt(numericId) % colors.length : 0;
      
      return colors[index] || colors[0]; // 색상이 없는 경우 첫 번째 색상 사용
    }

        '<div class="fishing-handle"></div>' +

        '<div class="fishing-line"></div>' +

      document.getElementById('totalItems').textContent = companies.length;
      document.getElementById('startItem').textContent = companies.length > 0 ? startIndex + 1 : 0;
      document.getElementById('endItem').textContent = Math.min(endIndex, companies.length);
      
      // 페이지네이션 버튼 업데이트
      updatePaginationButtons();
    }

    // 페이지네이션 버튼 상태 업데이트
    function updatePaginationButtons() {
      const totalPages = Math.ceil(companies.length / itemsPerPage);
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');
      
      if (prevBtn) {
        prevBtn.disabled = currentPage <= 1;
        prevBtn.classList.toggle('opacity-50', currentPage <= 1);
      }
      
      if (nextBtn) {
        nextBtn.disabled = currentPage >= totalPages;
        nextBtn.classList.toggle('opacity-50', currentPage >= totalPages);
      }
      
      // 페이지 번호 업데이트
      const paginationNumbers = document.getElementById('paginationNumbers');
      if (paginationNumbers) {
        paginationNumbers.innerHTML = '';
        
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
        
        // 페이지 범위 조정
        if (endPage - startPage + 1 < maxVisiblePages && startPage > 1) {
          startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }
        
        for (let i = startPage; i <= endPage; i++) {
          const pageButton = document.createElement('button');
          pageButton.className = `relative inline-flex items-center px-4 py-2 border ${
            i === currentPage ? 'bg-blue-50 border-blue-500 text-blue-600' : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50'
          } text-sm font-medium`;
          pageButton.textContent = i;
          pageButton.addEventListener('click', () => {
            if (!isLoading && i !== currentPage) {
              currentPage = i;
              renderTable();
            }
          });
          paginationNumbers.appendChild(pageButton);
        }
      }
    }

    // 사업 목록 로드 함수 수정
    async function loadBusinessList() {
      try {
        // 이미 로드된 사업목록이 있으면 다시 로드하지 않음
        if (businessList.length > 0) {
          updateBusinessSelect();
          return;
        }
        
        const res = await fetchData('사업정보');
        if (!res.success) {
          console.warn('사업 목록 로드 실패:', res.error);
          return;
        }
        businessList = res.data || [];
        
        updateBusinessSelect();
      } catch (e) {
        console.error('loadBusinessList 오류:', e);
      }
    }
    
    // 사업 선택 드롭다운 업데이트
    function updateBusinessSelect() {
      const select = document.getElementById('businessSelect');
      if (!select) return;
      
      // 드롭다운 초기화
      select.innerHTML = '<option value="">사업 선택</option>';
      
      // 사업 할당 안된 기업 옵션 추가

      unassignedOption.value = 'unassigned';

      select.appendChild(unassignedOption);

      // 사업 없음 옵션 추가
      const noBusinessOption = document.createElement('option');
      noBusinessOption.value = 'no_business';
      noBusinessOption.textContent = '사업 없음';
      select.appendChild(noBusinessOption);
      
      // 사업 목록 추가

    // 사업으로 필터링 함수 수정
    function filterByBusiness(businessId) {
      currentPage = 1;
      const searchTerm = document.getElementById('searchInput')?.value.trim() || '';
      
      if (!businessId) {
        // 사업 선택 선택 시 필터 제거
        document.getElementById('businessSelect').value = '';
        loadCompanyData('', searchTerm);
        return;
      }
      
      // 드롭다운에도 선택된 사업 반영
      document.getElementById('businessSelect').value = businessId;
      console.log('사업 필터링:', businessId, '검색어:', searchTerm);
      
      if (businessId === 'unassigned') {
        // 사업 할당 안된 기업만 필터링
        const assignedCompanyIds = notificationData.map(n => n.companyId);
        companies = companies.filter(company => !assignedCompanyIds.includes(company.id));
      } else if (businessId === 'no_business') {
        // 사업이 없는 기업만 필터링 (사업 목록이 비어있는 기업)
        companies = companies.filter(company => !company.businesses || company.businesses.length === 0);
      } else {
        // 특정 사업에 할당된 기업만 필터링
        const targetCompanyIds = notificationData
          .filter(n => n.businessId === businessId)
          .map(n => n.companyId);
        companies = companies.filter(company => targetCompanyIds.includes(company.id));
      }
      
      renderTable();
      updatePaginationButtons();
    }

    // 안내 사업 선택 모달 열기
    function openSelectBusinessModal() {
      const modal = document.getElementById('selectBusinessModal');
      const container = document.getElementById('businessCheckboxContainer');
      
      if (!modal || !container) return;
      
      // 전체 모달에 로딩 표시
      const modalContent = modal.querySelector('.bg-white');
      
      // 모달 초기화
      container.innerHTML = `
        <div class="loading-message">
          <div class="loading-icon">
            <div class="fishing-handle"></div>
            <div class="fishing-rod"></div>
            <div class="fishing-line"></div>
            <div class="fishing-fish">🐟</div>
          </div>
          <div>사업 목록 낚시 중... 잠시만요!</div>
        </div>
      `;
      
      // 모달 표시
      modal.classList.remove('hidden');
      
      // 선택된 기업의 ID 목록
      const selectedCompanies = document.querySelectorAll('.company-checkbox:checked');
      const selectedCompanyIds = Array.from(selectedCompanies).map(cb => cb.value);
      
      // 사업 목록 로드 (이미 로드된 경우 재사용)
      const populateBusinessList = () => {
        try {
          if (businessList.length === 0) {
            container.innerHTML = '<div class="text-center py-2 text-gray-500">등록된 사업이 없습니다.</div>';
            return;
          }
          
          // 현재 선택된 기업들의 사업 할당 현황 조회
          const companyAssignments = {};
          
          // 각 기업별로 할당된 사업 ID 목록 생성
          selectedCompanyIds.forEach(companyId => {
            const assignments = notificationData
              .filter(n => n.companyId === companyId)
              .map(n => n.businessId);
            
            companyAssignments[companyId] = assignments;
          });
          
          // 사업별로 이미 모든 기업에 할당되었는지 확인
          const businessChecks = businessList.map(business => {
            // 모든 선택된 기업에 이미 할당되었는지 확인
            const isAssignedToAll = selectedCompanyIds.every(companyId => 
              companyAssignments[companyId] && companyAssignments[companyId].includes(business.id)
            );
            
            // 일부 기업에 할당되었는지 확인
            const isAssignedToSome = selectedCompanyIds.some(companyId => 
              companyAssignments[companyId] && companyAssignments[companyId].includes(business.id)
            );
            
            return {
              business,
              isAssignedToAll,
              isAssignedToSome
            };
          });
          
          // 사업 목록 표시
          container.innerHTML = businessChecks.map(({ business, isAssignedToAll, isAssignedToSome }) => {
            const color = getBusinessColor(business.id);
            const checkboxId = `business-${business.id}`;
            
            return `
              <div class="flex items-center p-2 hover:bg-gray-100 rounded">
                <input type="checkbox" 
                       class="business-checkbox mr-3" 
                       id="${checkboxId}" 
                       value="${business.id}"
                       ${isAssignedToAll ? 'disabled checked' : ''}
                       ${isAssignedToSome ? 'indeterminate="true"' : ''}>
                <label for="${checkboxId}" 
                       class="flex-1 cursor-pointer ${isAssignedToAll ? 'opacity-50' : ''}">
                  <div class="font-medium" style="color: ${color}">${business.name || ''}</div>
                  <div class="text-sm text-gray-500">
                    ${business.description || ''}
                    ${isAssignedToAll ? '<span class="text-green-500 ml-2">✓ 모든 기업에 할당됨</span>' : ''}
                    ${isAssignedToSome && !isAssignedToAll ? '<span class="text-orange-500 ml-2">△ 일부 기업에 할당됨</span>' : ''}
                  </div>
                </label>
              </div>
            `;
          }).join('');
          
          // 부분 선택된 체크박스 처리
          document.querySelectorAll('.business-checkbox[indeterminate="true"]').forEach(cb => {
            cb.indeterminate = true;
          });
          
        } catch (error) {
          console.error('사업 목록 표시 오류:', error);
          container.innerHTML = '<div class="text-center py-2 text-red-500">사업 목록을 처리하는 중 오류가 발생했습니다.</div>';
        }
      };
      
      if (businessList.length > 0) {
        // 이미 로드된 사업 목록이 있는 경우 바로 표시
        populateBusinessList();
      } else {
        // 사업 목록을 새로 로드
        fetchData('사업정보')
          .then(response => {
            if (response.success && response.data) {
              businessList = response.data;
              populateBusinessList();
            } else {
              container.innerHTML = '<div class="text-center py-2 text-red-500">사업 목록을 불러오는데 실패했습니다.</div>';
            }
          })
          .catch(error => {
            console.error('사업 목록 로드 오류:', error);
            container.innerHTML = '<div class="text-center py-2 text-red-500">사업 목록을 불러오는데 실패했습니다.</div>';
          });
      }
      
      // 모달 표시
      modal.classList.remove('hidden');
    }

    // 파일 업로드 관련 객체
    const documentUploader = {
      currentCompanyId: null,
      selectedFile: null,
      fileReader: new FileReader(),
      folderId: '1ezIOGRJH4wYwqGDZPlr6YepfuoGEipWq', // 고정된 폴더 ID 사용
      
      init: function() {
        // 드롭존 이벤트 설정
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        
        if (dropZone) {
          // 드래그 앤 드롭 이벤트
          dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            this.classList.add('border-blue-500');
          });
          
          dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            e.stopPropagation();
            this.classList.remove('border-blue-500');
          });
          
          dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            this.classList.remove('border-blue-500');
            
            if (e.dataTransfer.files.length) {
              documentUploader.handleFileSelect(e.dataTransfer.files[0]);
            }
          });
          
          // 클릭 이벤트
          dropZone.addEventListener('click', function() {
            fileInput.click();
          });
        }
        
        if (fileInput) {
          fileInput.addEventListener('change', function(e) {
            if (this.files.length) {
              documentUploader.handleFileSelect(this.files[0]);
            }
          });
        }
        
        // 파일 제거 버튼
        document.getElementById('removeFile')?.addEventListener('click', function() {
          documentUploader.removeFile();
        });
        
        // 모달 버튼 이벤트 설정
        document.getElementById('cancelUploadButton')?.addEventListener('click', function() {
          documentUploader.closeModal();
        });
        
        document.getElementById('confirmUploadButton')?.addEventListener('click', function() {
          documentUploader.uploadFile();
        });
      },
      
      openModal: function(companyId) {
        this.currentCompanyId = companyId;
        this.resetModal();
        
        // 모달 표시
        const modal = document.getElementById('documentUploadModal');
        if (modal) {
          modal.classList.remove('hidden');
        }
      },
      
      closeModal: function() {
        const modal = document.getElementById('documentUploadModal');
        if (modal) {
          modal.classList.add('hidden');
        }
        this.resetModal();
      },
      
      resetModal: function() {
        // 상태 초기화
        this.selectedFile = null;
        
        // UI 초기화
        const filePreview = document.getElementById('filePreview');
        const uploadProgress = document.getElementById('uploadProgress');
        const uploadResult = document.getElementById('uploadResult');
        
        if (filePreview) filePreview.classList.add('hidden');
        if (uploadProgress) uploadProgress.classList.add('hidden');
        if (uploadResult) uploadResult.classList.add('hidden');
        
        // 버튼 상태 업데이트
        const confirmButton = document.getElementById('confirmUploadButton');
        if (confirmButton) {
          confirmButton.textContent = '업로드';
          confirmButton.disabled = false;
        }
      },
      
      handleFileSelect: function(file) {
        // 파일 유효성 검사
        if (!file) return;
        
        // 파일 크기 검사 (10MB 제한)
        if (file.size > 10 * 1024 * 1024) {
          alert('파일 크기가 10MB를 초과합니다.');
          return;
        }
        
        // 파일 형식 검사
        const fileType = file.type.toLowerCase();
        if (!fileType.includes('pdf') && !fileType.includes('image/')) {
          alert('PDF 또는 이미지 파일만 업로드 가능합니다.');
          return;
        }
        
        // 파일 저장
        this.selectedFile = file;
        
        // 파일 정보 표시
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        
        if (filePreview && fileName) {
          // 파일명이 길 경우 줄임 처리
          const displayName = file.name.length > 30 ? 
            file.name.substring(0, 27) + '...' + file.name.substring(file.name.lastIndexOf('.')) : 
            file.name;
            
          fileName.setAttribute('title', file.name); // 전체 파일명을 툴크로 표시
          fileName.textContent = displayName;
          filePreview.classList.remove('hidden');
        }
      },
      
      removeFile: function() {
        this.selectedFile = null;
        
        // UI 업데이트
        const filePreview = document.getElementById('filePreview');
        if (filePreview) {
          filePreview.classList.add('hidden');
        }
        
        // 파일 입력 필드 초기화
        const fileInput = document.getElementById('fileInput');
        if (fileInput) {
          fileInput.value = '';
        }
      },
      
      // 파일을 Base64로 변환
      readFileAsBase64: function(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            // Base64 문자열에서 'data:image/jpeg;base64,' 같은 prefix 제거
            const base64String = reader.result.split(',')[1];
            resolve(base64String);
          };
          reader.onerror = () => {
            reject(new Error('파일을 읽는 중 오류가 발생했습니다.'));
          };
          reader.readAsDataURL(file);
        });
      },
      
      // 파일 업로드 진행
      uploadFile: async function() {
        if (!this.selectedFile) {
          alert('업로드할 파일을 선택해주세요.');
          return;
        }
        
        if (!this.currentCompanyId) {
          alert('기업 정보가 없습니다.');
          return;
        }
        
        // UI 업데이트
        const confirmButton = document.getElementById('confirmUploadButton');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressBar = document.getElementById('progressBar');
        const uploadStatus = document.getElementById('uploadStatus');
        const uploadResult = document.getElementById('uploadResult');
        
        if (confirmButton) confirmButton.disabled = true;
        if (uploadProgress) uploadProgress.classList.remove('hidden');
        if (uploadResult) uploadResult.classList.add('hidden');
        if (uploadStatus) uploadStatus.textContent = '파일 처리 중...';
        if (progressBar) progressBar.style.width = '30%';
        
        try {
          // 파일을 Base64로 변환
          const fileContent = await this.readFileAsBase64(this.selectedFile);
          
          if (uploadStatus) uploadStatus.textContent = '구글 드라이브에 업로드 중...';
          if (progressBar) progressBar.style.width = '60%';
          
          // 구글 드라이브에 업로드
          const response = await uploadFileToDrive({
            fileName: this.selectedFile.name,
            fileContent: fileContent,
            mimeType: this.selectedFile.type || this.getMimeTypeFromExtension(this.selectedFile.name),
            folderId: this.folderId
          });
          
          if (progressBar) progressBar.style.width = '100%';
          
          // 업로드 결과 처리
          if (response.success) {
            // 성공 메시지 표시
            if (uploadStatus) uploadStatus.textContent = '업로드 완료!';
            if (uploadResult) {
              uploadResult.classList.remove('hidden', 'bg-red-100');
              uploadResult.classList.add('bg-green-100');
              uploadResult.innerHTML = `
                <div class="flex items-center mb-2">
                  <i class="fas fa-check-circle text-green-500 mr-2"></i>
                  <span class="font-medium">업로드 성공!</span>
                </div>
                <p class="text-sm mb-2">파일명: ${this.selectedFile.name}</p>
                <p class="text-sm mb-2">구글 드라이브에 파일이 성공적으로 업로드되었습니다.</p>
                <div class="flex mt-3">
                  <a href="${response.viewUrl}" target="_blank" class="text-blue-500 hover:underline mr-4">
                    <i class="fas fa-external-link-alt mr-1"></i> 파일 보기
                  </a>
                </div>
              `;
            }
            
            // 안내정보 업데이트
            let notificationItem = notificationData.find(n => n.companyId === this.currentCompanyId);
            const selectedBusiness = document.getElementById('businessSelect')?.value || '1';
            
            try {
              if (notificationItem && notificationItem.id) {
                // 기존 안내정보 업데이트
                notificationItem.saupjadd = response.viewUrl;
                const updateResult = await updateData('안내정보', notificationItem.id, notificationItem);
                if (updateResult.success) {
                  console.log('안내정보 업데이트 성공:', updateResult);
                }
              } else {
                // 새로운 안내정보 추가
                notificationItem = {
                  businessId: selectedBusiness,
                  companyId: this.currentCompanyId,
                  csdataaa: "등록",
                  saupjadd: response.viewUrl
                };
                const addResult = await addData('안내정보', notificationItem);
                if (addResult.success && addResult.data) {
                  notificationData.push(addResult.data);
                  console.log('안내정보 추가 성공:', addResult);
                }
              }
              
              // 테이블 새로고침
              await loadCompanyData();
              
              // 3초 후 모달 닫기
              setTimeout(() => {
                this.closeModal();
              }, 3000);
              
            } catch (error) {
              console.error('파일 정보 저장 중 오류:', error);
              this.showUploadError('구글 드라이브 정보 저장 중 오류가 발생했습니다.');
            }
          } else {
            this.showUploadError(response.error || '업로드 실패');
          }
        } catch (error) {
          console.error('파일 업로드 중 오류:', error);
          this.showUploadError(error.message || '파일 업로드 중 오류가 발생했습니다.');
        }
      },
      
      showUploadError: function(errorMessage) {
        const uploadStatus = document.getElementById('uploadStatus');
        const uploadResult = document.getElementById('uploadResult');
        const confirmButton = document.getElementById('confirmUploadButton');
        
        if (uploadStatus) uploadStatus.textContent = '업로드 실패';
        
        if (uploadResult) {
          uploadResult.classList.remove('hidden', 'bg-green-100');
          uploadResult.classList.add('bg-red-100');
          uploadResult.innerHTML = `
            <div class="flex items-center mb-2">
              <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
              <span class="font-medium">업로드 실패</span>
            </div>
            <p class="text-sm">${errorMessage}</p>
          `;
        }
        
        if (confirmButton) {
          confirmButton.disabled = false;
          confirmButton.textContent = '다시 시도';
        }
      },
      
      // 파일 확장자로부터 MIME 타입 추출
      getMimeTypeFromExtension: function(fileName) {
        const extension = fileName.split('.').pop().toLowerCase();
        
        const mimeTypes = {
          'jpg': 'image/jpeg',
          'jpeg': 'image/jpeg',
          'png': 'image/png',
          'gif': 'image/gif',
          'pdf': 'application/pdf',
          'doc': 'application/msword',
          'docx': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
          'xls': 'application/vnd.ms-excel',
          'xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          'txt': 'text/plain',
          'csv': 'text/csv',
          'html': 'text/html',
          'htm': 'text/html',
          'zip': 'application/zip'
        };
        
        return mimeTypes[extension] || 'application/octet-stream';
      }
    };

    // 이미지 미리보기 객체
    const imagePreviewObj = {
      showModal: function(imageUrl) {
        const modal = document.getElementById('imagePreviewModal');
        const previewImage = document.getElementById('previewImage');
        
        if (modal && previewImage) {
          previewImage.src = imageUrl;
          modal.classList.remove('hidden');
        }
      },
      
      closeModal: function() {
        const modal = document.getElementById('imagePreviewModal');
        if (modal) {
          modal.classList.add('hidden');
        }
      }
    };

    // 모달 관련 함수들
    function closeModals() {
      const modals = [
        'selectBusinessModal',
        'addModal',
        'deleteModal',
        'documentUploadModal',
        'imagePreviewModal'
      ];
      
      modals.forEach(modalId => {
        const modal = document.getElementById(modalId);
        if (modal) {
          modal.classList.add('hidden');
          // 로딩 요소가 있으면 제거
          modal.querySelectorAll('[id$="-loading"]').forEach(el => el.remove());
        }
      });
      
      // 테이블 새로고침
      loadCompanyData();
    }

    // 기업을 사업에 할당하는 함수
    async function assignCompaniesToBusiness(businessId) {
      const selectedCompanies = document.querySelectorAll('.company-checkbox:checked');
      const selectedCompanyIds = Array.from(selectedCompanies).map(cb => cb.value);
      
      try {
        // 사업 ID 유효성 검사
        const businessExists = businessList.some(b => b.id === businessId);
        if (!businessExists) {
          console.error(`사업 ID ${businessId}가 존재하지 않습니다.`);
          return { success: false, error: "존재하지 않는 사업입니다." };
        }

        // 이미 할당된 기업 ID 목록 생성
        const existingAssignments = notificationData
          .filter(n => n.businessId === businessId)
          .map(n => n.companyId);

        // 새로 할당할 기업 ID 목록 생성 (중복 제거)
        const newCompanyIds = selectedCompanyIds.filter(id => !existingAssignments.includes(id));

        if (newCompanyIds.length === 0) {
          alert('선택한 기업들이 이미 해당 사업에 할당되어 있습니다.');
          return { success: true, successCount: 0, failCount: 0 };
        }

        // 한 번에 처리할 안내 정보 배열 생성
        const notificationItems = newCompanyIds.map(companyId => ({
          businessId: businessId,
          companyId: companyId,
          csdataaa: "등록"
        }));

        // 한 번에 데이터 추가
        const result = await addData('안내정보', notificationItems);
        
        if (result && result.success) {
          // 성공한 경우 notificationData 배열에 추가
          if (Array.isArray(result.data)) {
            notificationData.push(...result.data);
          } else if (result.data) {
            notificationData.push(result.data);
          }
          
          alert(`${newCompanyIds.length}개의 기업이 성공적으로 할당되었습니다.`);
          return { 
            success: true, 
            successCount: newCompanyIds.length, 
            failCount: 0 
          };
        } else {
          console.error('기업 할당 실패:', result ? result.error || '알 수 없는 오류' : '응답 없음');
          alert('기업 할당에 실패했습니다.');
          return { 
            success: false, 
            successCount: 0, 
            failCount: newCompanyIds.length 
          };
        }
      } catch (error) {
        console.error('할당 프로세스 오류:', error);
        alert('기업 할당 중 오류가 발생했습니다.');
        return { 
          success: false, 
          error: error.message 
        };
      }
    }

    // 테이블 정렬 함수
    function sortTable(column, direction) {
      currentSortColumn = column;
      currentSortDirection = direction;
      
      if (!companies || companies.length === 0) return;
      
      companies.sort((a, b) => {
        let valueA, valueB;
        
        // 특별한 컬럼 처리
        if (column === 'businesses') {
          valueA = a.businesses && a.businesses.length > 0 ? a.businesses[0].name : '';
          valueB = b.businesses && b.businesses.length > 0 ? b.businesses[0].name : '';
        } else {
          valueA = a[column] || '';
          valueB = b[column] || '';
        }
        
        // 문자열로 변환하여 비교
        valueA = valueA.toString().toLowerCase();
        valueB = valueB.toString().toLowerCase();
        
        if (valueA < valueB) {
          return direction === 'asc' ? -1 : 1;
        }
        if (valueA > valueB) {
          return direction === 'asc' ? 1 : -1;
        }
        return 0;
      });
      
      renderTable();
    }
    
    // 정렬 버튼 이벤트 설정
    function setupSortButtons() {
      document.querySelectorAll('th.sortable').forEach(th => {
        th.addEventListener('click', function() {
          const column = this.getAttribute('data-sort');
          let direction = 'asc';
          
          // 이미 정렬 중인 컬럼인 경우 방향 전환
          if (currentSortColumn === column) {
            direction = currentSortDirection === 'asc' ? 'desc' : 'asc';
          }
          
          // 다른 모든 헤더의 정렬 클래스 제거
          document.querySelectorAll('th.sortable').forEach(header => {
            header.classList.remove('asc', 'desc');
          });
          
          // 현재 헤더에 정렬 클래스 추가
          this.classList.add(direction);
          
          sortTable(column, direction);
        });
      });
    }
  </script>
