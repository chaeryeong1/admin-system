  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
  <script>
    // 기본 설정
    const API_URL = 'https://script.google.com/macros/s/AKfycbz9E3_2V8n4mVE46nHjJ3V41fGFUHa8Q967-DEXmih8Gjl8hIH063rHE-emJzEXgA/exec';
    let companies = [], selectedCompanyIds = [], currentPage = 1;
    const itemsPerPage = 10;
    let currentSortColumn = 'id', currentSortDirection = 'asc', isLoading = false;
    let lastApiCallTimestamp = 0;
    let notificationData = [];
    let businessList = [];
    let projects = [];
    let selectedProjectIds = [];
 
    // API 호출 통합 함수
    async function apiCall(action, sheet, data = null, id = null) {
      return new Promise((resolve, reject) => {
        const now = Date.now();
        const elapsed = now - lastApiCallTimestamp;
        if (action !== 'getData' && elapsed < 1000) {
          setTimeout(() => {
            apiCall(action, sheet, data, id).then(resolve).catch(reject);
          }, 1000 - elapsed);
          return;
        }
        
        lastApiCallTimestamp = now;
        const sheetMap = {'사업정보': '사업정보', '기업정보': '기업정보', '계약정보': '계약정보', '송금정보': '송금정보', '안내정보': '안내정보', 'all': 'all'};
        const callbackName = 'api_cb_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        const actualSheet = sheetMap[sheet] || sheet;
        
        let url = `${API_URL}?action=${action}&sheet=${encodeURIComponent(actualSheet)}&callback=${callbackName}`;
        
        if (id) url += `&id=${encodeURIComponent(id)}`;
        if (data) {
          url += `&jsonData=${encodeURIComponent(JSON.stringify(data))}`;
        }
        
        const timeoutId = setTimeout(() => {
          delete window[callbackName];
          script.remove();
          resolve({ success: false, error: '요청 시간 초과', data: action === 'getData' ? [] : null });
        }, 15000);
        
        window[callbackName] = (response) => {
          clearTimeout(timeoutId);
          delete window[callbackName];
          script.remove();
          resolve(response);
        };
        
        script.onerror = () => {
          clearTimeout(timeoutId);
          delete window[callbackName];
          script.remove();
          resolve({ success: false, error: `${action} 오류`, data: action === 'getData' ? [] : null });
        };
        
        document.head.appendChild(script);
      });
    }

    // 초기화 및 이벤트 등록
    document.addEventListener('DOMContentLoaded', function() {
      // 모바일 메뉴
      document.querySelector('.mobile-menu-button').addEventListener('click', () => 
        document.querySelector('.mobile-menu').classList.toggle('hidden'));
      
      // 사업 목록 로드
      loadBusinessList();
      
      // 페이지 초기화 시 안내정보 데이터 로드
      loadNotificationData();
      
      // 검색, 정렬, 페이지네이션
      document.getElementById('selectAllCheckbox').addEventListener('change', toggleSelectAll);
      document.getElementById('modalSelectAllCheckbox').addEventListener('change', toggleModalSelectAll);
      document.getElementById('searchButton').addEventListener('click', function() {
        const businessId = document.getElementById('businessSelect').value;
        const searchTerm = document.getElementById('searchInput').value.trim();
        
        if (businessId) {
          // 사업 선택된 경우 해당 사업의 데이터만 로드
          loadBusinessData(businessId);
        } else if (searchTerm) {
          // 검색어만 입력된 경우 전체 데이터에서 검색
          searchCompanies();
        } else {
          // 모든 안내정보 로드
          loadNotificationData();
        }
      });
      
      document.getElementById('searchInput').addEventListener('keypress', e => { 
        if (e.key === 'Enter') {
          document.getElementById('searchButton').click();
        }
      });
      
      document.getElementById('businessSelect').addEventListener('change', function() {
        const selectedBusinessId = this.value;
        if (selectedBusinessId) {
          loadBusinessData(selectedBusinessId);
          // 대상 선별 버튼 활성화
          document.getElementById('addButton').disabled = false;
        } else {
          // 모든 안내정보 로드
          loadNotificationData();
          // 대상 선별 버튼 비활성화
          document.getElementById('addButton').disabled = true;
        }
      });
      
      // 대상 선별 버튼 초기 비활성화
      document.getElementById('addButton').disabled = true;
      
      // 페이지네이션 버튼
      document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (!isLoading && currentPage > 1) { 
          currentPage--; 
          const businessId = document.getElementById('businessSelect').value;
          if (businessId) {
            renderTable();
          } else {
            renderNotificationTable();
          }
        }
      });
      
      document.getElementById('nextPageBtn').addEventListener('click', () => {
        if (!isLoading) {
          const totalPages = Math.ceil(getFilteredCompanies().length / itemsPerPage);
          if (currentPage < totalPages) { 
            currentPage++; 
            const businessId = document.getElementById('businessSelect').value;
            if (businessId) {
              renderTable();
            } else {
              renderNotificationTable();
            }
          }
        }
      });
      
      // 모달 관련 이벤트 리스너
      document.getElementById('addButton').addEventListener('click', function() {
        console.log('대상 선별 버튼 클릭됨');
        openModal('add');
      });
      
      document.getElementById('deleteButton').addEventListener('click', () => {
        if (selectedCompanyIds.length === 0) {
          alert('삭제할 기업을 선택해주세요.');
          return;
        }
        openModal('delete');
      });
      
      // 모달 취소/확인 버튼
      document.getElementById('cancelAddButton').addEventListener('click', closeModals);
      document.getElementById('confirmAddButton').addEventListener('click', () => handleCrud('add'));
      document.getElementById('cancelDeleteButton').addEventListener('click', closeModals);
      document.getElementById('confirmDeleteButton').addEventListener('click', () => handleCrud('delete'));
    });

    
    // 데이터 로드 및 테이블 렌더링
    async function loadProjects() {
      if (isLoading) return;
      
      isLoading = true;
      
      // 콜드 스타트 감지 및 개선된 로딩 표시
      const isColdStart = !sessionStorage.getItem('projects_cache');
      
      // 유쾌한 랜덤 로딩 메시지 배열
      const funnyLoadingMessages = [
        "클라우드에서 데이터를 다운로드하는 중 ☁️",
        "데이터 소환 주문 외우는 중이에요, 곧 소환될거예요!🔮✨",
        "열심히 데이터를 찾는 중이에요... 거의 다 왔어요! 🔍",
        "해킹은 아니지만 데이터 가져오는 중 👾",
        "삐빅... 데이터를 발견했습니다! 관련 데이터 다운로드 중..🔄",
        "거의 다 됐어요! 3초 세고 나타날 거예요... 아마도 🤔",
        "데이터 낚시 중... 큰 데이터가 걸린 것 같아요! 🎣"
      ];
      
      // 랜덤 메시지 선택
      const randomMessage = funnyLoadingMessages[Math.floor(Math.random() * funnyLoadingMessages.length)];
      
      try {
        console.time('안내 데이터 로드');
        const response = await apiCall('getData', '안내정보');
        console.timeEnd('안내 데이터 로드');
        
        if (response.success && Array.isArray(response.data)) {
          console.log(`안내 데이터 ${response.data.length}개 로드 성공`);
          
          // 물고기 잡힘 애니메이션 실행
          showFishCaughtAnimation();
          
          // 응답 데이터가 비어있는지 확인
          if (response.data.length === 0 && projects.length > 0 && !isColdStart) {
            console.warn('API 응답이 비어있습니다. 캐시된 데이터를 유지합니다.');
          } else {
            projects = response.data;
            // 세션 스토리지에 캐시 저장 (만료시간 30분)
            const cacheData = {
              timestamp: Date.now(),
              data: response.data
            };
            sessionStorage.setItem('projects_cache', JSON.stringify(projects));
            console.log('데이터 캐시 저장됨');
          }
        } else {
          if (sessionStorage.getItem('projects_cache')) {
            console.warn('API 오류, 캐시된 데이터 유지합니다.');
          } else {
            projects = [];
            console.error('데이터 로드 실패:', response.error || '알 수 없는 오류');
          }
        }
      } catch (error) {
        if (sessionStorage.getItem('projects_cache')) {
          console.warn('API 오류, 캐시된 데이터 유지합니다.');
        } else {
          projects = [];
          console.error('데이터 로드 오류:', error);
        }
      } finally {
        isLoading = false;
        console.time('테이블 렌더링');
        renderTable();
        console.timeEnd('테이블 렌더링');
      }
    }
    
    // 필터링, 정렬, 테이블 렌더링
    function getFilteredProjects() {
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!searchTerm) return projects;
      
      return projects.filter(p => 
        (p.name && p.name.toLowerCase().includes(searchTerm)) || 
        (p.organizer && p.organizer.toLowerCase().includes(searchTerm))
      );
    }
    
    function renderTable() {
      const tbody = document.getElementById('projectTableBody');
      const filtered = getFilteredProjects();
      
      // 정렬 - 수동 정렬이 적용된 경우에만 정렬 실행
      let displayData = filtered;
      if (currentSortColumn !== 'id' || currentSortDirection !== 'asc') {
        displayData = filtered.sort((a, b) => {
          let valA = a[currentSortColumn] || '';
          let valB = b[currentSortColumn] || '';
          
          if (currentSortColumn === 'targetCount') {
            valA = parseInt(valA) || 0;
            valB = parseInt(valB) || 0;
          } else {
            valA = String(valA).toLowerCase();
            valB = String(valB).toLowerCase();
          }
          
          return (valA < valB ? -1 : valA > valB ? 1 : 0) * (currentSortDirection === 'asc' ? 1 : -1);
        });
      }
      
      // 초기 테이블 정렬 표시 업데이트
      if (currentSortColumn !== 'id') {
        document.querySelectorAll('th[data-sort]').forEach(th => {
          const column = th.getAttribute('data-sort');
          const sortIcon = th.querySelector('.sort-icon i');
          
          if (column === currentSortColumn) {
            sortIcon.className = `fas fa-sort-${currentSortDirection === 'asc' ? 'up' : 'down'}`;
            sortIcon.parentElement.classList.add('active');
          } else {
            sortIcon.className = 'fas fa-sort';
            sortIcon.parentElement.classList.remove('active');
          }
        });
      }
      
      // 페이징
      const pageData = displayData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
      const fragment = document.createDocumentFragment();
      
      if (pageData.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="7" class="text-center py-4">등록된 사업이 없습니다.</td>';
        fragment.appendChild(tr);
      } else {
        pageData.forEach(project => {
          const tr = document.createElement('tr');
          
          // 체크박스
          const checkboxCell = document.createElement('td');
          checkboxCell.className = "align-middle text-center";
          
          const checkboxContainer = document.createElement('div');
          checkboxContainer.className = "flex justify-center items-center";
          
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'project-checkbox';
          checkbox.value = project.id;
          checkbox.checked = selectedProjectIds.includes(project.id);
          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              if (!selectedProjectIds.includes(project.id)) selectedProjectIds.push(project.id);
            } else {
              selectedProjectIds = selectedProjectIds.filter(id => id !== project.id);
            }
            updateSelectAllCheckbox();
          });
          
          checkboxContainer.appendChild(checkbox);
          checkboxCell.appendChild(checkboxContainer);
          tr.appendChild(checkboxCell);
          tr.appendChild(createElement('td', project.name));
          tr.appendChild(createElement('td', project.targetCount));
          
          // 사업기간
          const startDate = project.startDate ? project.startDate.split('T')[0].replace(/-/g, '.') : '';
          const endDate = project.endDate ? project.endDate.split('T')[0].replace(/-/g, '.') : '';
          tr.appendChild(createElement('td', startDate && endDate ? `${startDate} ~ ${endDate}` : ''));
          
          tr.appendChild(createElement('td', project.organizer));
          
          // 공고 URL
          const tdUrl = document.createElement('td');
          if (project.noticeUrl) {
            const link = document.createElement('a');
            link.href = project.noticeUrl;
            link.target = '_blank';
            link.textContent = '공고 보기';
            link.className = 'table-link';
            tdUrl.appendChild(link);
          }
          tr.appendChild(tdUrl);
          
          // 수정 버튼
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'btn btn-sm edit-btn whitespace-nowrap';
          editBtn.innerHTML = '<i class="fas fa-edit mr-1 flex-shrink-0"></i> 수정';
          editBtn.addEventListener('click', () => openModal('edit', project));
          
          const tdEdit = document.createElement('td');
          tdEdit.className = "text-center"; // 셀 자체도 중앙 정렬
          tdEdit.appendChild(editBtn);
          tr.appendChild(tdEdit);
          fragment.appendChild(tr);
        });
      }
      
      tbody.innerHTML = '';
      tbody.appendChild(fragment);
      
      // 페이지네이션 업데이트
      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      const startItem = filtered.length === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
      const endItem = Math.min(currentPage * itemsPerPage, filtered.length);
      
      document.getElementById('totalItems').textContent = filtered.length;
      document.getElementById('startItem').textContent = startItem;
      document.getElementById('endItem').textContent = endItem;
      document.getElementById('prevPageBtn').disabled = (currentPage <= 1);
      document.getElementById('nextPageBtn').disabled = (currentPage >= totalPages);
      document.getElementById('paginationNumbers').textContent = `${currentPage} / ${totalPages || 1}`;
      
      // 전체 선택 체크박스 상태 업데이트
      updateSelectAllCheckbox();
    }
    
    // 유틸리티 함수
    function createElement(tag, textContent, child = null) {
      const elem = document.createElement(tag);
      if (textContent !== null) elem.textContent = textContent || '';
      if (child) elem.appendChild(child);
      return elem;
    }
    
    function toggleSelectAll() {
      const isChecked = document.getElementById('selectAllCheckbox').checked;
      const checkboxes = document.querySelectorAll('.project-checkbox');
      
      selectedProjectIds = isChecked ? Array.from(checkboxes).map(chk => chk.value) : [];
      checkboxes.forEach(chk => chk.checked = isChecked);
    }
    
    function updateSelectAllCheckbox() {
      const checkboxes = document.querySelectorAll('.project-checkbox');
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      
      selectAllCheckbox.disabled = checkboxes.length === 0;
      selectAllCheckbox.checked = checkboxes.length > 0 && Array.from(checkboxes).every(chk => chk.checked);
    }

    function openModal(type, project = null) {
      console.log(`모달 열기: ${type}`);
      if (type === 'add') {
        document.getElementById('addName').value = '';
        document.getElementById('addTargetCount').value = '';
        
        // flatpickr 인스턴스 초기화
        const startDatePicker = document.getElementById('addStartDate')._flatpickr;
        const endDatePicker = document.getElementById('addEndDate')._flatpickr;
        
        startDatePicker.clear();
        endDatePicker.clear();
        
        document.getElementById('addOrganizer').value = '';
        document.getElementById('addNoticeUrl').value = '';
        document.getElementById('addModal').classList.remove('hidden');
        console.log('사업 추가 모달이 열렸습니다.');
      } 
      else if (type === 'edit') {
        if (!project || !project.id) return console.error('수정할 사업 정보를 찾을 수 없습니다.');
        
        document.getElementById('editName').value = project.name || '';
        document.getElementById('editTargetCount').value = project.targetCount || '';
        
        // flatpickr 인스턴스로 날짜 설정
        const startDatePicker = document.getElementById('editStartDate')._flatpickr;
        const endDatePicker = document.getElementById('editEndDate')._flatpickr;
        
        if (project.startDate) {
          startDatePicker.setDate(project.startDate.split('T')[0]);
        } else {
          startDatePicker.clear();
        }
        
        if (project.endDate) {
          endDatePicker.setDate(project.endDate.split('T')[0]);
        } else {
          endDatePicker.clear();
        }
        
        document.getElementById('editOrganizer').value = project.organizer || '';
        document.getElementById('editNoticeUrl').value = project.noticeUrl || '';
        
        selectedProjectIds = [project.id];
        document.getElementById('editModal').classList.remove('hidden');
      }
      else if (type === 'delete') {
        // 선택된 항목 다시 확인 (체크박스 기준으로 갱신)
        selectedProjectIds = [];
        document.querySelectorAll('.project-checkbox:checked').forEach(checkbox => {
          selectedProjectIds.push(checkbox.value);
        });
        
        // 선택된 항목이 없으면 경고 표시하고 모달 열지 않음
        if (selectedProjectIds.length === 0) {
          alert('삭제할 사업을 선택해주세요.');
          return;
        }
        
        // 삭제할 사업명 가져오기 개선
        let deleteText = '';
        if (selectedProjectIds.length === 1) {
          // 단일 사업 삭제 시 사업명 표시
          const projectId = selectedProjectIds[0];
          const project = projects.find(p => String(p.id) === String(projectId));
          
          if (project && project.name) {
            deleteText = `"${project.name}"`;
          } else {
            deleteText = "선택한 사업";
            console.error('사업명을 찾을 수 없습니다. ID:', projectId);
          }
        } else {
          // 다중 사업 삭제 시 개수 표시
          deleteText = `선택한 ${selectedProjectIds.length}개 사업`;
        }
        
        console.log('삭제 텍스트:', deleteText);
        document.getElementById('deleteProjectName').textContent = deleteText;
        document.getElementById('deleteModal').classList.remove('hidden');
      }
    }
    
    // CRUD 처리
    async function handleCrud(type) {
      console.log(`handleCrud 함수 호출됨 - 타입: ${type}, 시간: ${new Date().toISOString()}`);
      
      if (type === 'add') {
        const nameInput = document.getElementById('addName');
        const targetCountInput = document.getElementById('addTargetCount');
        const startDateInput = document.getElementById('addStartDate');
        const endDateInput = document.getElementById('addEndDate');
        const organizerInput = document.getElementById('addOrganizer');
        const noticeUrlInput = document.getElementById('addNoticeUrl');
        
        const data = {
          name: nameInput.value.trim(),
          targetCount: targetCountInput.value.trim(),
          startDate: startDateInput.value,
          endDate: endDateInput.value,
          organizer: organizerInput.value.trim(),
          noticeUrl: noticeUrlInput.value.trim()
        };
        
        console.log('추가할 사업 데이터:', data);
        
        // 필수값 유효성 검사 및 시각적 피드백 제공
        const hasName = data.name && data.name.length > 0;
        const hasTargetCount = data.targetCount && !isNaN(parseInt(data.targetCount));
        const hasStartDate = data.startDate && data.startDate.length > 0;
        const hasEndDate = data.endDate && data.endDate.length > 0;
        
        nameInput.style.borderColor = hasName ? '#d1d5db' : 'red';
        targetCountInput.style.borderColor = hasTargetCount ? '#d1d5db' : 'red'; 
        startDateInput.style.borderColor = hasStartDate ? '#d1d5db' : 'red';
        endDateInput.style.borderColor = hasEndDate ? '#d1d5db' : 'red';
        
        // 사용자에게 누락된 필드를 알려주기
        if (!hasName || !hasTargetCount || !hasStartDate || !hasEndDate) {
          console.error('필수값 누락:', {
            name: !hasName,
            targetCount: !hasTargetCount,
            startDate: !hasStartDate,
            endDate: !hasEndDate
          });
          
          // 누락된 항목을 구체적으로 알려주는 메시지 생성
          let missingFields = [];
          if (!hasName) missingFields.push('사업명');
          if (!hasTargetCount) missingFields.push('목표 업체 수');
          if (!hasStartDate) missingFields.push('시작일');
          if (!hasEndDate) missingFields.push('종료일');
          
          alert(`${missingFields.join(', ')} 입력해주세요.`);
          return;
        }
        
        try {
          data.targetCount = parseInt(data.targetCount);
          console.log('API 호출 시작 - 사업 추가');
          
          // 사용자에게 처리 중임을 알림
          const confirmBtn = document.getElementById('confirmAddButton');
          const originalText = confirmBtn.innerHTML;
          confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>처리 중...';
          confirmBtn.disabled = true;
          
          // 데이터 형식 강제
          if (typeof data.targetCount !== 'number') {
            data.targetCount = parseInt(data.targetCount) || 0;
          }
          
          // 데이터 유효성 로깅
          console.log('전송할 최종 데이터:', {
            name: data.name + '',
            targetCount: data.targetCount + '',
            startDate: data.startDate + '',
            endDate: data.endDate + '',
            organizer: data.organizer + '',
            noticeUrl: data.noticeUrl + ''
          });
          
          // JSON 문자열로 변환해서 로그 확인
          const jsonStr = JSON.stringify(data);
          console.log('JSON 문자열:', jsonStr);
          console.log('데이터 타입 확인:', {
            name: typeof data.name,
            targetCount: typeof data.targetCount,
            startDate: typeof data.startDate,
            endDate: typeof data.endDate
          });
          
          const response = await apiCall('addData', '사업정보', data);
          console.log('API 응답:', response);
          
          // 버튼 상태 복원
          confirmBtn.innerHTML = originalText;
          confirmBtn.disabled = false;
          
          if (response.success) {
            console.log('사업 추가 성공');
            alert('사업이 성공적으로 추가되었습니다.');
            closeModals();
            loadProjects();
          } else {
            console.error('사업 추가 실패:', response.error || '알 수 없는 오류');
          }
        } catch (error) {
          console.error('사업 추가 중 오류 발생:', error);
          alert('사업 추가 중 오류가 발생했습니다: ' + (error.message || '알 수 없는 오류'));
          document.getElementById('confirmAddButton').disabled = false;
        }
      }
      else if (type === 'edit') {
        if (selectedProjectIds.length === 0) {
          return console.error('수정할 사업을 선택해주세요.');
        }
        
        const data = {
          name: document.getElementById('editName').value.trim(),
          targetCount: document.getElementById('editTargetCount').value.trim(),
          startDate: document.getElementById('editStartDate').value,
          endDate: document.getElementById('editEndDate').value,
          organizer: document.getElementById('editOrganizer').value.trim(),
          noticeUrl: document.getElementById('editNoticeUrl').value.trim()
        };
        
        if (!data.name || !data.targetCount || !data.startDate || !data.endDate) {
          return console.error('필수값(사업명, 목표업체수, 사업기간)이 누락되었습니다.');
        }
        
        data.targetCount = parseInt(data.targetCount);
        const response = await apiCall('updateData', '사업정보', data, selectedProjectIds[0]);
        
        if (response.success) {
          console.log('사업 수정 성공');
          closeModals();
          loadProjects();
        } else {
          console.error('사업 수정 실패:', response.error || '알 수 없는 오류');
        }
      }
      else if (type === 'delete') {
        if (selectedProjectIds.length === 0) {
          return console.error('삭제할 사업을 선택해주세요.');
        }
        
        // 삭제 버튼 로딩 상태로 변경
        const confirmBtn = document.getElementById('confirmDeleteButton');
        const originalText = confirmBtn.innerHTML;
        confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>삭제 중...';
        confirmBtn.disabled = true;
        
        try {
          const results = await Promise.all(
            selectedProjectIds.map(id => apiCall('deleteData', '사업정보', null, id))
          );
          
          console.log(results.every(r => r.success) ? '사업 삭제 성공' : '일부 사업 삭제에 실패했습니다.');
          
          // 버튼 상태 복원
          confirmBtn.innerHTML = originalText;
          confirmBtn.disabled = false;
          
          closeModals();
          loadProjects();
        } catch (error) {
          console.error('삭제 중 오류 발생:', error);
          
          // 오류 발생 시에도 버튼 상태 복원
          confirmBtn.innerHTML = originalText;
          confirmBtn.disabled = false;
          
          alert('삭제 중 오류가 발생했습니다: ' + (error.message || '알 수 없는 오류'));
        }
      }
    }

    // 페이지 초기화 함수
    function initPage() {
      try {
        // 모바일 메뉴 토글 버튼 이벤트 등록
        const mobileMenuButton = document.querySelector('.mobile-menu-button');
        if (mobileMenuButton) {
          mobileMenuButton.addEventListener('click', function() {
            const mobileMenu = document.querySelector('.mobile-menu');
            if (mobileMenu) {
              mobileMenu.classList.toggle('hidden');
            }
          });
        }
    
        // 검색 버튼 이벤트 등록
        const searchButton = document.getElementById('searchButton');
        if (searchButton) {
          searchButton.addEventListener('click', function() {
            currentPage = 1;
            const businessSelect = document.getElementById('businessSelect');
            if (businessSelect && businessSelect.value) {
              loadBusinessData(businessSelect.value);
            } else {
              loadNotificationData();
            }
          });
        }
    
        // 엔터키 검색 이벤트 등록
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
              currentPage = 1;
              const businessSelect = document.getElementById('businessSelect');
              if (businessSelect && businessSelect.value) {
                loadBusinessData(businessSelect.value);
              } else {
                loadNotificationData();
              }
            }
          });
        }
    
        // 페이징 이벤트 등록
        const prevPageBtn = document.getElementById('prevPageBtn');
        if (prevPageBtn) {
          prevPageBtn.addEventListener('click', function() {
            if (currentPage > 1) {
              currentPage--;
              renderNotificationTable();
            }
          });
        }
    
        const nextPageBtn = document.getElementById('nextPageBtn');
        if (nextPageBtn) {
          nextPageBtn.addEventListener('click', function() {
            const totalPages = Math.ceil(notificationData.length / itemsPerPage);
            if (currentPage < totalPages) {
              currentPage++;
              renderNotificationTable();
            }
          });
        }
    
        // 초기 데이터 로드
        loadBusinessList();
        loadNotificationData();
        
        console.log('페이지 초기화 완료!');
      } catch (error) {
        console.error('페이지 초기화 중 오류 발생:', error);
      }
    }

    async function loadBusinessData(businessId) {
      const tbody = document.getElementById('companyTableBody');
      if (!tbody) return;
      
      // 물고기 로딩 애니메이션 표시
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-8">
            <div class="flex flex-col items-center justify-center">
              <div class="fishing-loader mb-4">
                <div class="fishing-handle"></div>
                <div class="fishing-rod"></div>
                <div class="fishing-line"></div>
                <i class="fas fa-hook fishing-hook"></i>
                <i class="fas fa-fish fishing-fish"></i>
              </div>
              <p class="text-gray-600 font-medium">데이터를 불러오는 중입니다...</p>
            </div>
          </td>
        </tr>
      `;

      try {
        // 안내정보 시트에서 데이터 가져오기
        const response = await apiCall('getData', '안내정보');
        if (response.success && Array.isArray(response.data)) {
          // 물고기 잡힘 애니메이션 실행
          showFishCaughtAnimation();
          
          // 선택한 사업에 해당하는 안내정보 필터링
          const businessNotifications = response.data.filter(notification => 
            notification.businessId === businessId
          );
          
          setTimeout(() => {
            if (businessNotifications.length === 0) {
              tbody.innerHTML = '<tr><td colspan="8" class="text-center">이 사업에 등록된 안내정보가 없습니다.</td></tr>';
            } else {
              companies = businessNotifications; // 전역 companies 변수에 저장
              renderTable();
            }
          }, 500);
        } else {
          throw new Error('안내정보를 불러오는데 실패했습니다.');
        }
      } catch (error) {
        console.error('안내정보 로드 중 오류:', error);
        setTimeout(() => {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" class="text-center text-red-500">
                데이터를 불러오는데 실패했습니다. 다시 시도해주세요.
              </td>

    // 안내정보 데이터 로드
    async function loadNotificationData() {
      try {
        const searchText = document.getElementById('searchInput')?.value || '';
        const selectedBusiness = document.getElementById('businessSelect')?.value || '';
        
        console.log('검색 조건:', { searchText, selectedBusiness });
        
        const response = await apiCall('getData', '안내정보');
        
        if (response.success && Array.isArray(response.data)) {
          console.log('안내정보 원본 데이터:', response.data);
          
          // 원본 데이터 저장
          const originalData = response.data;
          
          // 검색 필터링
          notificationData = originalData.filter(item => {
            // 검색어 필터링
            const matchesSearch = !searchText || 
              (item.title && item.title.includes(searchText)) ||
              (item.content && item.content.includes(searchText));
            
            // 사업 필터링
            const matchesBusiness = !selectedBusiness || item.businessId === selectedBusiness;
            
            return matchesSearch && matchesBusiness;
          });
          
          // 데이터 정렬 (최신 등록일 순)
          notificationData.sort((a, b) => {
            const dateA = a.registrationDate ? new Date(a.registrationDate) : new Date(0);
            const dateB = b.registrationDate ? new Date(b.registrationDate) : new Date(0);
            return dateB - dateA;
          });
          
          console.log('필터링된 안내정보 데이터:', notificationData);
          
          // 테이블 렌더링
          renderNotificationTable();
        } else {
          throw new Error('안내정보 데이터를 가져오는데 실패했습니다.');
        }
      } catch (error) {
        console.error('안내정보 데이터 로드 실패:', error);
        
        // 더미 데이터 로드
        notificationData = [
          {
            id: '1',
            businessId: '1',
            title: '스마트시티 사업 관련 공지',
            content: '스마트시티 사업에 관한 중요 공지사항입니다.',
            registrationDate: '2023-12-01'
          },
          {
            id: '2',
            businessId: '2',
            title: '바이오헬스 사업 안내',
            content: '바이오헬스 사업 진행 관련 안내입니다.',
            registrationDate: '2023-11-15'
          },
          {
            id: '3',
            businessId: '3',
            title: '친환경 에너지 사업 설명회',
            content: '친환경 에너지 사업 설명회를 개최합니다.',
            registrationDate: '2023-10-20'
          }
        ];
        
        // 테이블 렌더링
        renderNotificationTable();
      }
    }

    // 안내정보 데이터 테이블 렌더링
    function renderNotificationTable() {
      const tableBody = document.getElementById('companyTableBody');
      if (!tableBody) return;
      
      const filteredData = notificationData;
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, filteredData.length);
      const tableData = filteredData.slice(startIndex, endIndex);

      // 테이블 본문 업데이트
      if (tableData.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="8" class="py-4 text-center">등록된 안내정보가 없습니다.</td>
          </tr>
        `;
      } else {
        // 홀짝 행 스타일 적용을 위한 클래스 추가
        tableBody.innerHTML = tableData.map((item, index) => `
          <tr class="${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-gray-100">
            <td class="text-center">
              <input type="checkbox" class="company-checkbox w-4 h-4" 
                     value="${item.id}" ${selectedCompanyIds.includes(item.id) ? 'checked' : ''}>
            </td>
            <td>${item.title || ''}</td>
            <td>${item.content || ''}</td>
            <td>${item.representative || ''}</td>
            <td>${item.phone || ''}</td>
            <td>${item.email || ''}</td>
            <td>${item.registrationDate || ''}</td>
            <td class="text-center">
              <button class="btn btn-danger btn-sm" onclick="deleteNotification('${item.id}')">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
        `).join('');
      }

      // 페이지네이션 업데이트
      updatePagination(filteredData.length);
    }

    // 페이지네이션 업데이트
    function updatePagination(totalItems) {
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      const startItem = totalItems === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
      const endItem = Math.min(currentPage * itemsPerPage, totalItems);
      
      const totalItemsElem = document.getElementById('totalItems');
      const startItemElem = document.getElementById('startItem');
      const endItemElem = document.getElementById('endItem');
      const prevPageBtn = document.getElementById('prevPageBtn');
      const nextPageBtn = document.getElementById('nextPageBtn');
      const paginationNumbers = document.getElementById('paginationNumbers');
      
      if (totalItemsElem) totalItemsElem.textContent = totalItems;
      if (startItemElem) startItemElem.textContent = startItem;
      if (endItemElem) endItemElem.textContent = endItem;
      if (prevPageBtn) prevPageBtn.disabled = (currentPage <= 1);
      if (nextPageBtn) nextPageBtn.disabled = (currentPage >= totalPages);
      if (paginationNumbers) paginationNumbers.textContent = `${currentPage} / ${totalPages || 1}`;
    }

    // 페이지 로드 시 초기화 함수 호출
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
