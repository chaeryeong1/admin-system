<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 캐시백 송금</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="cashback-management.html" class="text-blue-600">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">캐시백 송금</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">
          <a href="cashback-management.html">ㆍ계약금수령기업</a>
        </li>
        <li class="text-gray-600">
          <a href="cashback-request.html">ㆍ송금 요청</a>
        </li>
        <li class="text-gray-600">
          <a href="cashback-approval.html">ㆍ송금 승인</a>
        </li>
        <li class="text-gray-600">
          <a href="cashback-transfer.html">ㆍ송금</a>
        </li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">계약금수령기업</div>

      <!-- 검색/필터링 -->
      <div class="flex items-center space-x-4">
        <select 
          id="businessFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 사업</option>
          <option value="클라우드 보급사업">클라우드 보급사업</option>
        </select>
        <select 
          id="statusFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 상태</option>
          <option value="미지급">미지급</option>
          <option value="지급예정">지급예정</option>
          <option value="지급완료">지급완료</option>
        </select>
        <input 
          id="searchInput"
          type="text" 
          placeholder="기업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">
                  <input 
                    type="checkbox" 
                    id="selectAllCheckbox"
                    class="cursor-pointer"
                  >
                </th>
                <th class="px-4 py-2 text-left">기업명</th>
                <th class="px-4 py-2 text-left">사업자등록번호</th>
                <th class="px-4 py-2 text-left">대표자</th>
                <th class="px-4 py-2 text-left">계약금수령액</th>
                <th class="px-4 py-2 text-left">처리일</th>
              </tr>
            </thead>
            <tbody id="cashbackTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="excelManageButton"
          class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
        >
          엑셀로 관리
        </button>
        <button 
          id="addContractButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          기업 추가
        </button>
        <button 
          id="editContractButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 opacity-50 cursor-not-allowed"
          disabled
        >
          수령액 수정
        </button>
        <button 
          id="deleteContractButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 opacity-50 cursor-not-allowed"
          disabled
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 기업 추가 모달 -->
  <div id="addContractModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">기업 계약금 수령 등록</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">사업 선택 <span class="text-red-500">*</span></label>
          <select
            id="addProjectSelect"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
            <option value="">사업을 선택하세요</option>
            <!-- JavaScript로 채워질 부분 -->
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">기업 선택 <span class="text-red-500">*</span></label>
          <select
            id="addCompanySelect"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
            <option value="">기업을 선택하세요</option>
            <!-- JavaScript로 채워질 부분 -->
          </select>
        </div>
        <div id="addCompanyInfoContainer" class="bg-gray-50 p-3 rounded text-sm">
          <p class="text-gray-500">기업을 선택하면 정보가 표시됩니다</p>
          <!-- 기업 선택 시 JavaScript로 채워질 부분 -->
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">계약금 수령액 <span class="text-red-500">*</span></label>
          <div class="flex items-center">
            <input
              id="addContractAmount"
              type="text"
              placeholder="금액을 입력하세요"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
            <span class="ml-2">원</span>
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelAddContractButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmAddContractButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 수령액 수정 모달 -->
  <div id="editContractModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">계약금 수령액 수정</h2>
      <div id="editCompanyInfoContainer" class="bg-gray-50 p-3 rounded mb-4 text-sm">
        <!-- JavaScript로 채워질 부분 -->
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">계약금 수령액 <span class="text-red-500">*</span></label>
          <div class="flex items-center">
            <input
              id="editContractAmount"
              type="text"
              class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            >
            <span class="ml-2">원</span>
          </div>
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelEditContractButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmEditContractButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteContractModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">계약금 수령 기업 삭제</h2>
      <p>선택한 기업의 계약금 수령 정보를 삭제하시겠습니까?</p>
      <div id="deleteContractList" class="mt-4 mb-4 bg-gray-100 p-3 rounded text-sm max-h-40 overflow-y-auto">
        <!-- 선택된 기업 목록이 표시될 영역 -->
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelDeleteContractButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmDeleteContractButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const cashbackTableBody = document.getElementById('cashbackTableBody');
    const businessFilter = document.getElementById('businessFilter');
    const statusFilter = document.getElementById('statusFilter');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addContractButton = document.getElementById('addContractButton');
    const editContractButton = document.getElementById('editContractButton');
    const deleteContractButton = document.getElementById('deleteContractButton');
    
    // 모달 요소
    const addContractModal = document.getElementById('addContractModal');
    const editContractModal = document.getElementById('editContractModal');
    const deleteContractModal = document.getElementById('deleteContractModal');
    
    // 데이터 상태
    let contracts = [];
    let projects = [];
    let companies = [];
    
    // 테이블 렌더링
    function renderContracts() {
      const searchTerm = searchInput.value.toLowerCase();
      const businessValue = businessFilter.value;
      
      const filteredContracts = contracts.filter(contract => {
        const matchSearch = contract.companyName.toLowerCase().includes(searchTerm);
        const matchBusiness = !businessValue || contract.project === businessValue;
        return matchSearch && matchBusiness;
      });
      
      if (filteredContracts.length === 0) {
        cashbackTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }
      
      // 테이블 생성
      cashbackTableBody.innerHTML = filteredContracts.map(contract => `
        <tr class="border-b hover:bg-gray-50" data-id="${contract.id}">
          <td class="px-4 py-2">
            <input 
              type="checkbox" 
              class="contract-checkbox"
              data-id="${contract.id}"
              data-company="${contract.companyName}"
            >
          </td>
          <td class="px-4 py-2">${contract.companyName || '-'}</td>
          <td class="px-4 py-2">${contract.businessNumber || '-'}</td>
          <td class="px-4 py-2">${contract.representative || '-'}</td>
          <td class="px-4 py-2">${formatNumber(contract.contractAmount)} 원</td>
          <td class="px-4 py-2">${formatDate(contract.processDate) || '-'}</td>
        </tr>
      `).join('');
      
      // 체크박스 이벤트 리스너 추가
      document.querySelectorAll('.contract-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', updateButtonStates);
      });
      
      // 버튼 상태 업데이트
      updateButtonStates();
    }

    // 데이터 로드 함수
    async function loadData() {
      try {
        // 로딩 표시
        cashbackTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center">데이터를 불러오는 중...</td></tr>';
        
        // 계약금 수령 정보 로드
        const contractsResult = await fetchData('계약금수령');
        if (contractsResult.success && contractsResult.data) {
          contracts = contractsResult.data;
        } else {
          // 샘플 데이터
          contracts = [
            {
              id: '1',
              companyName: "(주)클라우드테크",
              businessNumber: "123-45-67890",
              representative: "홍길동",
              contractAmount: 5000000,
              processDate: "2023-06-15",
              project: "클라우드 보급사업"
            },
            {
              id: '2',
              companyName: "(주)디지털솔루션",
              businessNumber: "234-56-78901",
              representative: "김철수",
              contractAmount: 7500000,
              processDate: "2023-07-20",
              project: "클라우드 보급사업"
            }
          ];
        }
        
        // 사업 정보 로드
        const projectsResult = await fetchData('사업정보');
        if (projectsResult.success && projectsResult.data) {
          projects = projectsResult.data;
          
          // 사업 필터 옵션 설정
          businessFilter.innerHTML = '<option value="">모든 사업</option>' + 
            projects.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        }
        
        // 기업 정보 로드
        const companiesResult = await fetchData('기업정보');
        if (companiesResult.success && companiesResult.data) {
          companies = companiesResult.data;
        }
        
        renderContracts();
      } catch (error) {
        console.error('데이터 로드 오류:', error);
        cashbackTableBody.innerHTML = '<tr><td colspan="6" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
      }
    }

    // 프로젝트 선택 시 기업 목록 갱신
    function updateCompanySelect() {
      const projectId = document.getElementById('addProjectSelect').value;
      const companySelect = document.getElementById('addCompanySelect');
      
      // 기업 선택 초기화
      companySelect.innerHTML = '<option value="">기업을 선택하세요</option>';
      
      if (!projectId) return;
      
      // 이미 계약금 수령으로 등록된 기업 ID 목록
      const registeredCompanyIds = contracts.map(c => c.companyId);
      
      // 해당 프로젝트에 속하지 않은 기업만 필터링
      const availableCompanies = companies.filter(c => !registeredCompanyIds.includes(c.id));
      
      // 기업 옵션 추가
      availableCompanies.forEach(company => {
        companySelect.innerHTML += `<option value="${company.id}" 
          data-business="${company.businessNumber}"
          data-representative="${company.representative}"
        >${company.name}</option>`;
      });
    }
    
    // 선택된 기업 정보 보여주기
    function showSelectedCompanyInfo() {
      const companySelect = document.getElementById('addCompanySelect');
      const infoContainer = document.getElementById('addCompanyInfoContainer');
      
      if (!companySelect.value) {
        infoContainer.innerHTML = '<p class="text-gray-500">기업을 선택하면 정보가 표시됩니다</p>';
        return;
      }
      
      const option = companySelect.options[companySelect.selectedIndex];
      const businessNumber = option.dataset.business || '-';
      const representative = option.dataset.representative || '-';
      
      infoContainer.innerHTML = `
        <p><span class="font-medium">기업명:</span> ${option.text}</p>
        <p><span class="font-medium">사업자등록번호:</span> ${businessNumber}</p>
        <p><span class="font-medium">대표자:</span> ${representative}</p>
      `;
    }
    
    // 모달 열기/닫기 함수
    function openAddContractModal() {
      // 사업 선택 옵션 설정
      const projectSelect = document.getElementById('addProjectSelect');
      projectSelect.innerHTML = '<option value="">사업을 선택하세요</option>' + 
        projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      
      // 기업 선택 초기화
      document.getElementById('addCompanySelect').innerHTML = '<option value="">기업을 선택하세요</option>';
      document.getElementById('addCompanyInfoContainer').innerHTML = '<p class="text-gray-500">기업을 선택하면 정보가 표시됩니다</p>';
      document.getElementById('addContractAmount').value = '';
      
      addContractModal.classList.remove('hidden');
    }
    
    function closeAddContractModal() {
      addContractModal.classList.add('hidden');
    }
    
    function openEditContractModal() {
      const selectedContracts = getSelectedContracts();
      
      if (selectedContracts.length !== 1) {
        alert('수정할 기업을 하나만 선택해주세요.');
        return;
      }
      
      const contractId = selectedContracts[0].id;
      const contract = contracts.find(c => c.id === contractId);
      
      if (!contract) return;
      
      // 기업 정보 표시
      document.getElementById('editCompanyInfoContainer').innerHTML = `
        <p><span class="font-medium">기업명:</span> ${contract.companyName || '-'}</p>
        <p><span class="font-medium">사업자등록번호:</span> ${contract.businessNumber || '-'}</p>
        <p><span class="font-medium">대표자:</span> ${contract.representative || '-'}</p>
      `;
      
      // 계약금 수령액 설정
      document.getElementById('editContractAmount').value = contract.contractAmount;
      
      editContractModal.classList.remove('hidden');
    }
    
    function closeEditContractModal() {
      editContractModal.classList.add('hidden');
    }
    
    function openDeleteContractModal() {
      const selectedContracts = getSelectedContracts();
      
      if (selectedContracts.length === 0) {
        alert('삭제할 기업을 선택해주세요.');
        return;
      }
      
      // 삭제할 기업 목록 표시
      const listContainer = document.getElementById('deleteContractList');
      listContainer.innerHTML = selectedContracts.map(item => 
        `<div class="py-1">${item.companyName}</div>`
      ).join('');
      
      deleteContractModal.classList.remove('hidden');
    }
    
    function closeDeleteContractModal() {
      deleteContractModal.classList.add('hidden');
    }
    
    // 선택된 계약 정보 가져오기
    function getSelectedContracts() {
      const checkboxes = document.querySelectorAll('.contract-checkbox:checked');
      return Array.from(checkboxes).map(checkbox => {
        return {
          id: checkbox.dataset.id,
          companyName: checkbox.dataset.company
        };
      });
    }
    
    // 버튼 상태 업데이트
    function updateButtonStates() {
      const selectedContracts = getSelectedContracts();
      const hasSelection = selectedContracts.length > 0;
      
      editContractButton.disabled = selectedContracts.length !== 1;
      deleteContractButton.disabled = !hasSelection;
      
      if (selectedContracts.length === 1) {
        editContractButton.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        editContractButton.classList.add('opacity-50', 'cursor-not-allowed');
      }
      
      if (hasSelection) {
        deleteContractButton.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        deleteContractButton.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }
    
    // 이벤트 리스너 등록
    document.addEventListener('DOMContentLoaded', () => {
      // 데이터 로드
      loadData();
      
      // 검색 및 필터링
      searchButton.addEventListener('click', renderContracts);
      businessFilter.addEventListener('change', renderContracts);
      statusFilter.addEventListener('change', renderContracts);
      
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          renderContracts();
        }
      });
      
      // 기업 추가 버튼
      addContractButton.addEventListener('click', openAddContractModal);
      
      // 모달 버튼
      cancelRequestButton.addEventListener('click', closeRequestModal);
      confirmRequestButton.addEventListener('click', requestTransfer);
    });
  </script>
</body>
</html>
