<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 캐시백 송금</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="cashback-management.html" class="text-blue-600">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">캐시백 송금</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">
          <a href="cashback-management.html">ㆍ계약금수령기업</a>
        </li>
        <li class="text-gray-600">
          <a href="cashback-request.html">ㆍ송금 요청</a>
        </li>
        <li class="text-gray-600">
          <a href="cashback-approval.html">ㆍ송금 승인</a>
        </li>
        <li class="text-gray-600">
          <a href="cashback-transfer.html">ㆍ송금</a>
        </li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">계약금수령기업</div>

      <!-- 검색/필터링 -->
      <div class="flex items-center space-x-4">
        <select 
          id="businessFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 사업</option>
          <option value="클라우드 보급사업">클라우드 보급사업</option>
        </select>
        <select 
          id="statusFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 상태</option>
          <option value="미지급">미지급</option>
          <option value="지급예정">지급예정</option>
          <option value="지급완료">지급완료</option>
        </select>
        <input 
          id="searchInput"
          type="text" 
          placeholder="기업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">선택</th>
                <th class="px-4 py-2 text-left">기업명</th>
                <th class="px-4 py-2 text-left">담당자</th>
                <th class="px-4 py-2 text-left">참여 사업</th>
                <th class="px-4 py-2 text-left">계약일</th>
                <th class="px-4 py-2 text-left">계약금액</th>
                <th class="px-4 py-2 text-left">캐시백</th>
                <th class="px-4 py-2 text-left">캐시백 상태</th>
                <th class="px-4 py-2 text-left">주문서</th>
              </tr>
            </thead>
            <tbody id="cashbackTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="requestButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 opacity-50 cursor-not-allowed"
          disabled
        >
          송금 요청
        </button>
      </div>
    </div>
  </div>

  <!-- 송금 요청 모달 -->
  <div id="requestModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">송금 요청</h2>
      <p>다음 기업에 대한 캐시백 송금을 요청하시겠습니까?</p>
      <p id="requestCompanyName" class="font-semibold mt-2"></p>
      <div class="mt-4">
        <label class="block text-sm font-medium mb-1">캐시백 금액</label>
        <div class="flex items-center">
          <input
            id="cashbackAmount"
            type="text"
            readonly
            class="w-full px-3 py-2 border rounded bg-gray-50"
          >
          <span class="ml-2">원</span>
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelRequestButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmRequestButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          요청
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const cashbackTableBody = document.getElementById('cashbackTableBody');
    const businessFilter = document.getElementById('businessFilter');
    const statusFilter = document.getElementById('statusFilter');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const requestButton = document.getElementById('requestButton');
    
    // 모달 요소
    const requestModal = document.getElementById('requestModal');
    const requestCompanyName = document.getElementById('requestCompanyName');
    const cashbackAmount = document.getElementById('cashbackAmount');
    const cancelRequestButton = document.getElementById('cancelRequestButton');
    const confirmRequestButton = document.getElementById('confirmRequestButton');
    
    // 데이터 상태
    let cashbacks = [];
    let selectedCashbackId = null;
    
    // 캐시백 데이터 로드
    async function loadCashbacks() {
      try {
        // 로딩 표시
        cashbackTableBody.innerHTML = '<tr><td colspan="9" class="px-4 py-2 text-center">데이터를 불러오는 중...</td></tr>';
        
        // API에서 데이터 가져오기
        const result = await fetchData('캐시백정보');
        
        if (result.success && result.data) {
          cashbacks = result.data;
        } else {
          // API 호출 실패 시 샘플 데이터 사용
          console.log('API 호출 실패, 샘플 데이터 사용');
          cashbacks = [
            {
              id: '1',
              companyName: "(주)클라우드테크",
              representative: "홍길동",
              project: "클라우드 보급사업",
              contractDate: "2025-06-15",
              contractAmount: 5000000,
              cashbackAmount: 500000,
              status: "미지급",
              hasOrderSheet: true
            },
            {
              id: '2',
              companyName: "데이터시스템즈",
              representative: "김철수",
              project: "클라우드 보급사업",
              contractDate: "2025-06-10",
              contractAmount: 8000000,
              cashbackAmount: 800000,
              status: "미지급",
              hasOrderSheet: false
            },
            {
              id: '3',
              companyName: "스마트솔루션",
              representative: "박지영",
              project: "스마트공장 구축지원사업",
              contractDate: "2025-05-20",
              contractAmount: 12000000,
              cashbackAmount: 1200000,
              status: "지급예정",
              hasOrderSheet: true
            }
          ];
        }
        
        renderCashbacks();
      } catch (error) {
        console.error('오류 발생:', error);
        cashbackTableBody.innerHTML = '<tr><td colspan="9" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
      }
    }
    
    // 캐시백 목록 렌더링
    function renderCashbacks() {
      // 필터링 적용
      const projectFilter = businessFilter.value.toLowerCase();
      const statusValue = statusFilter.value.toLowerCase();
      const searchTerm = searchInput.value.toLowerCase();
      
      const filteredCashbacks = cashbacks.filter(cashback => {
        const matchesProject = !projectFilter || (cashback.project && cashback.project.toLowerCase().includes(projectFilter));
        const matchesStatus = !statusValue || (cashback.status && cashback.status.toLowerCase() === statusValue);
        const matchesSearch = !searchTerm || (cashback.companyName && cashback.companyName.toLowerCase().includes(searchTerm));
        return matchesProject && matchesStatus && matchesSearch;
      });
      
      if (filteredCashbacks.length === 0) {
        cashbackTableBody.innerHTML = '<tr><td colspan="9" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }
      
      // 테이블 생성
      cashbackTableBody.innerHTML = filteredCashbacks.map(cashback => `
        <tr class="border-b hover:bg-gray-50" data-id="${cashback.id}">
          <td class="px-4 py-2">
            <input 
              type="radio" 
              name="cashback-select" 
              class="cashback-radio"
              ${selectedCashbackId === cashback.id ? 'checked' : ''}
              ${cashback.status !== '미지급' ? 'disabled' : ''}
            >
          </td>
          <td class="px-4 py-2">${cashback.companyName || '-'}</td>
          <td class="px-4 py-2">${cashback.representative || '-'}</td>
          <td class="px-4 py-2">${cashback.project || '-'}</td>
          <td class="px-4 py-2">${formatDate(cashback.contractDate) || '-'}</td>
          <td class="px-4 py-2">${formatNumber(cashback.contractAmount) || '-'}</td>
          <td class="px-4 py-2">${formatNumber(cashback.cashbackAmount) || '-'}</td>
          <td class="px-4 py-2">
            <span class="${getStatusClass(cashback.status)}">${cashback.status || '-'}</span>
          </td>
          <td class="px-4 py-2">
            ${cashback.hasOrderSheet 
              ? '<span class="text-green-600">있음</span>' 
              : '<span class="text-red-600">없음</span>'
            }
          </td>
        </tr>
      `).join('');
      
      // 라디오 버튼 이벤트 리스너 추가
      document.querySelectorAll('.cashback-radio').forEach(radio => {
        radio.addEventListener('change', handleCashbackSelection);
      });
      
      // 테이블 행 클릭 이벤트 추가
      document.querySelectorAll('#cashbackTableBody tr').forEach(row => {
        row.addEventListener('click', function() {
          const radio = this.querySelector('.cashback-radio');
          if (radio && !radio.disabled) {
            radio.checked = true;
            selectedCashbackId = this.dataset.id;
            updateButtonStates();
          }
        });
      });
      
      // 버튼 상태 업데이트
      updateButtonStates();
    }
    
    // 상태에 따른 클래스 반환
    function getStatusClass(status) {
      if (!status) return '';
      
      switch(status) {
        case '지급완료': return 'text-green-600 font-medium';
        case '지급예정': return 'text-blue-600';
        case '미지급': return 'text-gray-600';
        default: return '';
      }
    }
    
    // 캐시백 선택 처리
    function handleCashbackSelection(event) {
      selectedCashbackId = event.target.closest('tr').dataset.id;
      updateButtonStates();
    }
    
    // 버튼 상태 업데이트
    function updateButtonStates() {
      const hasSelection = selectedCashbackId !== null;
      const isValidSelection = hasSelection && cashbacks.find(c => c.id === selectedCashbackId)?.status === '미지급';
      
      requestButton.disabled = !isValidSelection;
      
      if (isValidSelection) {
        requestButton.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        requestButton.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }
    
    // 송금 요청 처리
    async function requestTransfer() {
      if (!selectedCashbackId) return;
      
      const cashback = cashbacks.find(c => c.id === selectedCashbackId);
      
      if (!cashback) return;
      
      // 이미 지급 예정이거나 지급 완료인 경우 처리 방지
      if (cashback.status !== '미지급') {
        alert('이미 처리된 캐시백입니다.');
        return;
      }
      
      try {
        // API를 통해 데이터 업데이트
        const updatedCashback = {
          ...cashback,
          status: '지급예정'
        };
        
        const result = await updateData('캐시백정보', updatedCashback);
        
        if (result.success) {
          // 성공 시 데이터 다시 로드
          await loadCashbacks();
          selectedCashbackId = null;
          closeRequestModal();
          alert('송금 요청이 완료되었습니다.');
        } else {
          throw new Error(result.error || '요청 실패');
        }
      } catch (error) {
        console.error('API 오류:', error);
        alert('송금 요청 중 오류가 발생했습니다.');
        
        // API 실패 시 로컬에서만 업데이트 (테스트용)
        const index = cashbacks.findIndex(c => c.id === selectedCashbackId);
        if (index !== -1) {
          cashbacks[index].status = '지급예정';
          renderCashbacks();
          selectedCashbackId = null;
        }
        closeRequestModal();
      }
    }
    
    // 숫자 포맷팅
    function formatNumber(num) {
      if (num === undefined || num === null) return '';
      return new Intl.NumberFormat('ko-KR').format(num);
    }
    
    // 날짜 포맷팅
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // 모달 열기/닫기 함수들
    function openRequestModal() {
      if (!selectedCashbackId) return;
      
      const cashback = cashbacks.find(c => c.id === selectedCashbackId);
      
      if (!cashback) return;
      
      // 주문서가 없는 경우 처리 방지
      if (!cashback.hasOrderSheet) {
        alert('주문서가 없는 기업은 송금 요청을 할 수 없습니다.');
        return;
      }
      
      requestCompanyName.textContent = cashback.companyName;
      cashbackAmount.value = formatNumber(cashback.cashbackAmount);
      
      requestModal.classList.remove('hidden');
    }
    
    function closeRequestModal() {
      requestModal.classList.add('hidden');
    }
    
    // 이벤트 리스너 등록
    document.addEventListener('DOMContentLoaded', () => {
      // 데이터 로드
      loadCashbacks();
      
      // 검색 및 필터링
      searchButton.addEventListener('click', renderCashbacks);
      businessFilter.addEventListener('change', renderCashbacks);
      statusFilter.addEventListener('change', renderCashbacks);
      
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          renderCashbacks();
        }
      });
      
      // 송금 요청 버튼
      requestButton.addEventListener('click', openRequestModal);
      
      // 모달 버튼
      cancelRequestButton.addEventListener('click', closeRequestModal);
      confirmRequestButton.addEventListener('click', requestTransfer);
    });
  </script>
</body>
</html>
