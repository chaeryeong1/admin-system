<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 기업 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-blue-600">기업 관리</a>
    <a href="cashback-management.html" class="text-gray-500">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">기업 관리</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">ㆍ기업 리스트 관리</li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">기업 리스트 관리</div>

      <!-- 검색/필터링 -->
      <div class="flex items-center space-x-4">
        <select 
          id="businessFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 사업</option>
          <option value="클라우드 보급사업">클라우드 보급사업</option>
        </select>
        <input 
          id="searchInput"
          type="text" 
          placeholder="기업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
        <div class="flex-1 text-right space-x-2">
          <button 
            id="addButton"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            + 추가
          </button>
          <button 
            id="excelButton"
            class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
          >
            엑셀 다운로드
          </button>
        </div>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">
                  <input 
                    type="checkbox" 
                    id="selectAllCheckbox"
                    class="cursor-pointer"
                  >
                </th>
                <th class="px-4 py-2 text-left">기업명</th>
                <th class="px-4 py-2 text-left">사업자등록번호</th>
                <th class="px-4 py-2 text-left">대표자</th>
                <th class="px-4 py-2 text-left">이메일</th>
                <th class="px-4 py-2 text-left">연락처</th>
                <th class="px-4 py-2 text-left">등록일</th>
              </tr>
            </thead>
            <tbody id="companyTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="editButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 opacity-50 cursor-not-allowed"
          disabled
        >
          수정
        </button>
        <button 
          id="deleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 opacity-50 cursor-not-allowed"
          disabled
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 모달 -->
  <div id="addModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">기업 정보 추가</h2>
      
      <div class="mb-4">
        <div class="flex flex-col mb-2">
          <label class="mb-2 font-semibold">파일 선택:</label>
          <div class="flex items-center">
            <label class="cursor-pointer bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
              파일 선택
              <input type="file" id="companyFileInput" accept=".xlsx,.xls,.csv" class="hidden" />
            </label>
            <span id="selectedFileName" class="ml-2 text-gray-600">선택된 파일 없음</span>
          </div>
          <p class="text-sm text-gray-500 mt-1">엑셀(.xlsx, .xls) 또는 CSV(.csv) 파일만 업로드 가능합니다.</p>
        </div>

        <div class="mt-4">
          <button id="downloadSampleButton" onclick="downloadSample()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-2 rounded text-sm">
            샘플 다운로드
          </button>
        </div>
      </div>
      
      <div class="flex justify-end mt-4">
        <button id="confirmAddButton" onclick="addCompanies()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">
          등록
        </button>
        <button id="cancelAddButton" onclick="closeAddModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
          취소
        </button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">기업 정보 수정</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">기존 데이터 다운로드</label>
          <button 
            id="downloadCurrentDataButton"
            type="button" 
            class="w-full px-3 py-2 bg-gray-100 border rounded hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            엑셀 파일 다운로드
          </button>
          <p class="text-xs text-gray-500 mt-1">기존 데이터를 수정 후 아래에 업로드하세요</p>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">파일 업로드 <span class="text-red-500">*</span></label>
          <input
            id="editExcelFile"
            type="file"
            accept=".xlsx, .xls, .csv"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div class="flex justify-end space-x-2 mt-6">
          <button 
            id="editCancelButton"
            type="button"
            class="px-4 py-2 border rounded hover:bg-gray-100"
          >
            취소
          </button>
          <button 
            id="confirmEditButton"
            type="button"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">기업 정보 삭제</h2>
      
      <p id="deleteModalContent" class="mb-4">선택한 기업 정보를 삭제하시겠습니까?</p>
      
      <div class="flex justify-end">
        <button id="confirmDeleteButton" onclick="deleteCompanies()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded mr-2">
          삭제
        </button>
        <button id="cancelDeleteButton" onclick="closeDeleteModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
          취소
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const companyTableBody = document.getElementById('companyTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addButton = document.getElementById('addButton');
    const deleteButton = document.getElementById('deleteButton');
    const editButton = document.getElementById('editButton');
    
    // 모달 관련 요소
    const addModal = document.getElementById('addModal');
    const editModal = document.getElementById('editModal');
    const deleteModal = document.getElementById('deleteModal');
    
    // 폼 요소
    const addForm = document.getElementById('addForm');
    const editForm = document.getElementById('editForm');
    const deleteCompanyName = document.getElementById('deleteCompanyName');
    
    // 데이터 상태
    let companies = [];
    let selectedCompanyId = null;
    
    // 모달 닫기 함수들
    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }
    
    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }
    
    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
    }
    
    // 기업 정보 로드
    async function loadCompanies() {
      console.log('기업 정보 로드 시작');
      
      // 로딩 메시지 표시
      document.getElementById('companiesTableBody').innerHTML = 
        '<tr><td colspan="8" class="text-center py-4">기업 정보를 불러오는 중입니다...</td></tr>';
      
      try {
        // 로컬 스토리지에서 데이터 확인
        const savedData = localStorage.getItem('companiesData');
        
        if (savedData) {
          try {
            companies = JSON.parse(savedData);
            console.log(`로컬 스토리지에서 ${companies.length}개 기업 정보 로드됨`);
            renderCompaniesTable();
            return;
          } catch (e) {
            console.error('로컬 스토리지 데이터 파싱 오류:', e);
            // 로컬 데이터 오류 시 API 호출 계속 진행
          }
        }
        
        // API에서 데이터 로드
        const result = await fetchData('기업정보');
        console.log('API 결과:', result);
        
        if (result && result.success && Array.isArray(result.data)) {
          companies = result.data;
          console.log(`API에서 ${companies.length}개 기업 정보 로드됨`);
          
          // 로컬 스토리지에 저장
          localStorage.setItem('companiesData', JSON.stringify(companies));
        } else {
          // API 오류 시 기본 데이터 사용
          console.warn('API 데이터 로드 실패, 기본 데이터 사용:', result?.error);
          useDefaultData();
        }
        
        // 테이블 렌더링
        renderCompaniesTable();
      } catch (error) {
        console.error('기업 정보 로드 오류:', error);
        document.getElementById('companiesTableBody').innerHTML = 
          '<tr><td colspan="8" class="text-center py-4 text-red-500">기업 정보를 불러오는 중 오류가 발생했습니다.</td></tr>';
        
        // 오류 시 기본 데이터 사용
        useDefaultData();
        renderCompaniesTable();
      }
    }
    
    // 기본 데이터 사용 (샘플 데이터)
    function useDefaultData() {
      console.log('기본 샘플 데이터 생성');
      companies = [
        { id: 'sample1', name: '샘플 기업 1', tel: '02-1234-5678', email: 'sample1@example.com', address: '서울시 강남구 테헤란로 123', memo: '샘플 메모 1', registerDate: new Date().toISOString().split('T')[0] },
        { id: 'sample2', name: '샘플 기업 2', tel: '02-2345-6789', email: 'sample2@example.com', address: '서울시 서초구 강남대로 456', memo: '샘플 메모 2', registerDate: new Date().toISOString().split('T')[0] },
        { id: 'sample3', name: '샘플 기업 3', tel: '02-3456-7890', email: 'sample3@example.com', address: '서울시 종로구 세종대로 789', memo: '샘플 메모 3', registerDate: new Date().toISOString().split('T')[0] }
      ];
      localStorage.setItem('companiesData', JSON.stringify(companies));
    }

    // 날짜 포맷팅
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return isNaN(date.getTime()) 
        ? dateString 
        : `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // 회사 목록 렌더링
    function renderCompaniesTable() {
      console.log('기업 정보 테이블 렌더링 시작');
      const tableBody = document.querySelector('#companiesTableBody');
      
      if (!tableBody) {
        console.error('테이블 본문 요소를 찾을 수 없습니다.');
        return;
      }
      
      if (!companies || companies.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="8" class="text-center py-4">등록된 기업이 없습니다.</td></tr>';
        return;
      }
      
      let tableContent = '';
      
      companies.forEach((company, index) => {
        tableContent += `
          <tr class="hover:bg-gray-50">
            <td class="border px-4 py-2 text-center">
              <input type="checkbox" class="company-checkbox" data-id="${company.id}">
            </td>
            <td class="border px-4 py-2 text-center">${index + 1}</td>
            <td class="border px-4 py-2">${company.name || '-'}</td>
            <td class="border px-4 py-2">${company.businessNumber || '-'}</td>
            <td class="border px-4 py-2">${company.representative || '-'}</td>
            <td class="border px-4 py-2">${company.email || '-'}</td>
            <td class="border px-4 py-2">${company.contact || '-'}</td>
            <td class="border px-4 py-2 text-center">
              <button 
                onclick="openEditModal('${company.id}')" 
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-2 rounded text-xs mr-1"
              >
                수정
              </button>
              <button 
                onclick="openDeleteModal('${company.id}')" 
                class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 rounded text-xs"
              >
                삭제
              </button>
            </td>
          </tr>
        `;
      });
      
      tableBody.innerHTML = tableContent;
      
      // 체크박스 이벤트 리스너 추가
      document.querySelectorAll('.company-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
          const companyId = this.getAttribute('data-id');
          
          if (this.checked) {
            // 기존 선택 초기화 (단일 선택 모드)
            document.querySelectorAll('.company-checkbox').forEach(cb => {
              if (cb !== this) cb.checked = false;
            });
            
            // 선택된 기업 ID 설정
            selectedCompanyId = companyId;
          } else {
            // 체크 해제되면 선택 초기화
            selectedCompanyId = null;
          }
        });
      });
      
      // 전체 선택 체크박스 이벤트 처리
      const selectAllCheckbox = document.getElementById('selectAllCompanies');
      if (selectAllCheckbox) {
        selectAllCheckbox.addEventListener('change', function() {
          const isChecked = this.checked;
          document.querySelectorAll('.company-checkbox').forEach(checkbox => {
            checkbox.checked = isChecked;
          });
          
          // 전체 선택 시 selectedCompanyId 초기화 (전체 선택 모드로 전환)
          selectedCompanyId = null;
        });
      }
      
      console.log('기업 정보 테이블 렌더링 완료');
    }
    
    // 삭제 모달 열기
    function openDeleteModal(companyId = null) {
      console.log('삭제 모달 열기, 기업 ID:', companyId);
      
      // 특정 ID가 전달된 경우 해당 기업 선택
      if (companyId) {
        selectedCompanyId = companyId;
        
        // 체크박스 상태 업데이트
        document.querySelectorAll('.company-checkbox').forEach(checkbox => {
          const checkboxId = checkbox.getAttribute('data-id');
          checkbox.checked = (checkboxId === companyId);
        });
      }
      
      // 전체 선택 체크박스 확인
      const selectAllCheckbox = document.getElementById('selectAllCompanies');
      const isSelectAll = selectAllCheckbox && selectAllCheckbox.checked;
      
      // 모달 내용 업데이트
      const modalContent = document.getElementById('deleteModalContent');
      
      if (isSelectAll) {
        // 전체 선택 모드
        const totalCount = companies.length;
        modalContent.textContent = `${totalCount}개의 모든 기업 정보를 삭제하시겠습니까?`;
      } else if (selectedCompanyId) {
        // 단일 선택 모드
        const company = companies.find(c => String(c.id) === String(selectedCompanyId));
        
        if (company) {
          modalContent.textContent = `'${company.name}'을(를) 삭제하시겠습니까?`;
        } else {
          console.error(`선택된 ID ${selectedCompanyId}에 해당하는 기업을 찾을 수 없습니다.`);
          alert('선택된 기업 정보를 찾을 수 없습니다.');
          return;
        }
      } else {
        // 선택된 기업이 없는 경우
        modalContent.textContent = '삭제할 기업을 선택해주세요.';
        alert('삭제할 기업을 선택해주세요.');
        return;
      }
      
      // 모달 표시
      document.getElementById('deleteModal').classList.remove('hidden');
    }
    
    // 기업 정보 삭제
    async function deleteCompanies() {
      console.log('기업 삭제 시작');
      
      // 선택된 기업 ID 배열
      const selectedIds = [];
      
      // 전체 선택 확인
      const selectAllCheckbox = document.getElementById('selectAllCompanies');
      const isSelectAll = selectAllCheckbox && selectAllCheckbox.checked;
      
      // 모든 체크박스를 선택한 경우
      if (isSelectAll) {
        companies.forEach(company => {
          selectedIds.push(company.id);
        });
      } 
      // 선택된 기업이 있는 경우
      else if (selectedCompanyId) {
        selectedIds.push(selectedCompanyId);
      }
      
      if (selectedIds.length === 0) {
        alert('삭제할 기업을 선택해주세요.');
        return;
      }
      
      // 삭제 중 버튼 상태 변경
      const deleteButton = document.querySelector('#confirmDeleteButton');
      if (deleteButton) {
        deleteButton.textContent = '삭제 중...';
        deleteButton.disabled = true;
      }
      
      try {
        let success = true;
        let apiError = null;
        
        // 각 ID에 대해 삭제 요청 수행
        for (const id of selectedIds) {
          try {
            const result = await deleteData('기업정보', id);
            console.log(`ID ${id} 삭제 결과:`, result);
            
            if (!result || !result.success) {
              success = false;
              apiError = result?.error || '알 수 없는 오류';
              break;
            }
          } catch (error) {
            console.error(`ID ${id} 삭제 중 오류:`, error);
            success = false;
            apiError = error.message;
            break;
          }
        }
        
        // 로컬 데이터 업데이트 (API 성공 여부와 상관없이)
        companies = companies.filter(company => !selectedIds.includes(company.id));
        localStorage.setItem('companiesData', JSON.stringify(companies));
        
        if (success) {
          alert('선택한 기업 정보가 성공적으로 삭제되었습니다.');
        } else {
          console.warn('API 삭제 오류, 로컬 데이터만 업데이트됨:', apiError);
          alert('API 오류가 발생했으나, 화면에서는 삭제되었습니다: ' + apiError);
        }
        
        // 모달 닫기 및 테이블 업데이트
        closeDeleteModal();
        renderCompaniesTable();
        
        // 전체 선택 체크박스 초기화
        if (selectAllCheckbox) {
          selectAllCheckbox.checked = false;
        }
        
        // 선택된 ID 초기화
        selectedCompanyId = null;
      } catch (error) {
        console.error('삭제 처리 중 오류:', error);
        alert('삭제 처리 중 오류가 발생했습니다: ' + error.message);
      } finally {

    // CSV 파일 처리
    async function processCSVFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onload = function(event) {
          try {
            const csvContent = event.target.result;
            const lines = csvContent.split('\n');
            
            // 헤더 확인 (첫 줄)
            const headers = lines[0].split(',').map(header => 
              header.trim().replace(/^"|"$/g, '')
            );
            
            // 필수 헤더 확인
            const requiredHeaders = ['기업명'];
            const missingHeaders = requiredHeaders.filter(h => !headers.includes(h));
            
            if (missingHeaders.length > 0) {
              return reject(`필수 헤더가 없습니다: ${missingHeaders.join(', ')}`);
            }
            
            // 헤더 인덱스 매핑
            const headerMap = {
              '기업명': 'name',
              '업종': 'industry',
              '담당자': 'contact_person',
              '이메일': 'contact_email',
              '지역': 'city',
              '주소': 'address',
              '설명': 'description'
            };
            
            const indexMap = {};
            headers.forEach((header, index) => {
              const fieldName = headerMap[header];
              if (fieldName) indexMap[index] = fieldName;
            });
            
            // 데이터 파싱
            const companies = [];
            
            for (let i = 1; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line) continue;
              
              // 쉼표로 분리 (따옴표 내부의 쉼표는 무시)
              const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
              
              // 객체 생성
              const company = { id: 'local_' + Date.now() + '_' + i };
              
              values.forEach((value, index) => {
                const field = indexMap[index];
                if (field) {
                  company[field] = value.replace(/^"|"$/g, '');
                }
              });
              
              // 기업명은 필수값
              if (company.name) {
                companies.push(company);
              }
            }
            
            resolve(companies);
          } catch (error) {
            console.error('CSV 파싱 오류:', error);
            reject('CSV 파일 처리 중 오류가 발생했습니다.');
          }
        };
        
        reader.onerror = function() {
          reject('파일을 읽는 중 오류가 발생했습니다.');
        };
        
        reader.readAsText(file, 'UTF-8');
      });
    }

    // 기업 추가 (파일 업로드 처리)
    async function addCompanies() {
      console.log('기업 추가 시작');
      const fileInput = document.getElementById('companyFileInput');
      
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        alert('업로드할 파일을 선택해주세요.');
        return;
      }
      
      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop().toLowerCase();
      
      // 파일 형식 확인
      if (!['csv', 'xlsx', 'xls'].includes(fileExt)) {
        alert('엑셀(.xlsx, .xls) 또는 CSV(.csv) 파일만 업로드 가능합니다.');
        return;
      }
      
      // 버튼 상태 변경
      const addButton = document.querySelector('#confirmAddButton');
      if (addButton) {
        addButton.textContent = '처리 중...';
        addButton.disabled = true;
      }
      
      try {
        let newCompanies = [];
        
        if (fileExt === 'csv') {
          // CSV 파일 처리
          newCompanies = await processCSVFile(file);
        } else {
          // 엑셀 파일은 API를 통해 처리
          const formData = new FormData();
          formData.append('file', file);
          formData.append('sheet', '기업정보');
          
          const result = await uploadFile(formData);
          console.log('파일 업로드 결과:', result);
          
          if (result && result.success && Array.isArray(result.data)) {
            newCompanies = result.data;
          } else {
            throw new Error(result?.error || '파일 업로드 실패');
          }
        }
        
        console.log(`${newCompanies.length}개 기업 데이터 추가 준비 완료`);
        
        // 새 기업 데이터 추가
        if (newCompanies.length > 0) {
          // ID 할당 (임시)
          newCompanies.forEach((company, index) => {
            if (!company.id) {
              company.id = `new_${Date.now()}_${index}`;
            }
          });
          
          // 기존 데이터와 병합
          companies = [...companies, ...newCompanies];
          
          // 로컬 스토리지에 저장
          localStorage.setItem('companiesData', JSON.stringify(companies));
          
          // API를 통한 데이터 저장 시도
          try {
            const result = await addData('기업정보', newCompanies);
            console.log('API 저장 결과:', result);
            
            if (result && result.success) {
              console.log('API를 통해 기업 정보 저장 성공');
            } else {
              console.warn('API 저장 실패, 로컬에만 저장됨:', result?.error);
            }
          } catch (apiError) {
            console.error('API 저장 중 오류:', apiError);
          }
          
          // 테이블 갱신
          renderCompaniesTable();
          alert(`${newCompanies.length}개 기업 정보가 추가되었습니다.`);
          
          // 파일 입력 초기화
          fileInput.value = '';
          document.getElementById('selectedFileName').textContent = '선택된 파일 없음';
          
          // 모달 닫기
          closeAddModal();
        } else {
          alert('추가할 기업 정보가 없습니다. 파일을 확인해주세요.');
        }
      } catch (error) {
        console.error('기업 추가 중 오류:', error);
        alert('기업 정보 추가 중 오류가 발생했습니다: ' + error.message);
      } finally {
        // 버튼 상태 복원
        if (addButton) {
          addButton.textContent = '등록';
          addButton.disabled = false;
        }
      }
    }
