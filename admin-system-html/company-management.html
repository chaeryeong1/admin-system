<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 기업 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-blue-600">기업 관리</a>
    <a href="cashback-management.html" class="text-gray-500">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">기업 관리</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">ㆍ기업 리스트 관리</li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">기업 리스트 관리</div>

      <!-- 검색/필터링 -->
      <div class="flex items-center space-x-4">
        <select 
          id="businessFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 사업</option>
          <option value="클라우드 보급사업">클라우드 보급사업</option>
        </select>
        <input 
          id="searchInput"
          type="text" 
          placeholder="기업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
        <div class="flex-1 text-right space-x-2">
          <button 
            id="addButton"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            + 추가
          </button>
          <button 
            id="excelButton"
            class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
          >
            엑셀 다운로드
          </button>
        </div>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">
                  <input 
                    type="checkbox" 
                    id="selectAllCheckbox"
                    class="cursor-pointer"
                  >
                </th>
                <th class="px-4 py-2 text-left">기업명</th>
                <th class="px-4 py-2 text-left">사업자등록번호</th>
                <th class="px-4 py-2 text-left">대표자</th>
                <th class="px-4 py-2 text-left">이메일</th>
                <th class="px-4 py-2 text-left">연락처</th>
                <th class="px-4 py-2 text-left">등록일</th>
              </tr>
            </thead>
            <tbody id="companyTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="editButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 opacity-50 cursor-not-allowed"
          disabled
        >
          수정
        </button>
        <button 
          id="deleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 opacity-50 cursor-not-allowed"
          disabled
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 모달 -->
  <div id="addModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">기업 정보 추가</h2>
      
      <div class="mb-4">
        <div class="flex flex-col mb-2">
          <label class="mb-2 font-semibold">파일 선택:</label>
          <div class="flex items-center">
            <label class="cursor-pointer bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
              파일 선택
              <input type="file" id="companyFileInput" accept=".xlsx,.xls,.csv" class="hidden" />
            </label>
            <span id="selectedFileName" class="ml-2 text-gray-600">선택된 파일 없음</span>
          </div>
          <p class="text-sm text-gray-500 mt-1">엑셀(.xlsx, .xls) 또는 CSV(.csv) 파일만 업로드 가능합니다.</p>
        </div>

        <div class="mt-4">
          <button id="downloadSampleButton" onclick="downloadSample()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-2 rounded text-sm">
            샘플 다운로드
          </button>
        </div>
      </div>
      
      <div class="flex justify-end mt-4">
        <button id="confirmAddButton" onclick="addCompanies()" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2">
          등록
        </button>
        <button id="cancelAddButton" onclick="closeAddModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
          취소
        </button>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">기업 정보 수정</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">기존 데이터 다운로드</label>
          <button 
            id="downloadCurrentDataButton"
            type="button" 
            class="w-full px-3 py-2 bg-gray-100 border rounded hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            엑셀 파일 다운로드
          </button>
          <p class="text-xs text-gray-500 mt-1">기존 데이터를 수정 후 아래에 업로드하세요</p>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">파일 업로드 <span class="text-red-500">*</span></label>
          <input
            id="editExcelFile"
            type="file"
            accept=".xlsx, .xls, .csv"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div class="flex justify-end space-x-2 mt-6">
          <button 
            id="editCancelButton"
            type="button"
            class="px-4 py-2 border rounded hover:bg-gray-100"
          >
            취소
          </button>
          <button 
            id="confirmEditButton"
            type="button"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
      <h2 class="text-xl font-bold mb-4">기업 정보 삭제</h2>
      
      <p id="deleteModalContent" class="mb-4">선택한 기업 정보를 삭제하시겠습니까?</p>
      
      <div class="flex justify-end">
        <button id="confirmDeleteButton" onclick="deleteCompanies()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded mr-2">
          삭제
        </button>
        <button id="cancelDeleteButton" onclick="closeDeleteModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
          취소
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const companyTableBody = document.getElementById('companyTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addButton = document.getElementById('addButton');
    const deleteButton = document.getElementById('deleteButton');
    const editButton = document.getElementById('editButton');
    
    // 모달 관련 요소
    const addModal = document.getElementById('addModal');
    const editModal = document.getElementById('editModal');
    const deleteModal = document.getElementById('deleteModal');
    
    // 폼 요소
    const addForm = document.getElementById('addForm');
    const editForm = document.getElementById('editForm');
    const deleteCompanyName = document.getElementById('deleteCompanyName');
    
    // 데이터 상태
    let companies = [];
    let selectedCompanyId = null;
    
    // 모달 닫기 함수들
    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }
    
    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }
    
    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
    }
    
    // 기업 정보 로드
    async function loadCompanies() {
      console.log('기업 정보 로드 시작');
      
      // 로딩 메시지 표시
      const tableBody = document.getElementById('companiesTableBody');
      tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4">데이터를 불러오는 중입니다...</td></tr>`;
      
      try {
        // 로컬 스토리지 확인
        const savedData = localStorage.getItem('companiesData');
        
        if (savedData) {
          try {
            const parsedData = JSON.parse(savedData);
            if (Array.isArray(parsedData) && parsedData.length > 0) {
              console.log(`로컬 스토리지에서 ${parsedData.length}개 기업 정보 로드됨`);
              companies = parsedData;
              renderCompaniesTable();
              return;
            }
          } catch (parseError) {
            console.warn('로컬 스토리지 데이터 파싱 오류:', parseError);
          }
        }
        
        // API에서 데이터 가져오기
        const result = await fetchData('기업정보');
        console.log('API 응답:', result);
        
        if (result && result.success && Array.isArray(result.data)) {
          companies = result.data;
          console.log(`API에서 ${companies.length}개 기업 정보 로드됨`);
          
          // 로컬 스토리지에 저장
          localStorage.setItem('companiesData', JSON.stringify(companies));
        } else {
          // 샘플 데이터 사용
          console.warn('API 데이터 로드 실패, 샘플 데이터 사용');
          companies = [
            {
              id: 'sample_1',
              name: '샘플 기업 1',
              industry: 'IT 서비스',
              contact_person: '홍길동',
              contact_email: 'sample1@example.com',
              city: '서울',
              address: '서울시 강남구 테헤란로 123',
              description: '샘플 회사 설명입니다.'
            },
            {
              id: 'sample_2',
              name: '샘플 기업 2',
              industry: '제조업',
              contact_person: '김철수',
              contact_email: 'sample2@example.com',
              city: '부산',
              address: '부산시 해운대구 해운대로 456',
              description: '제조업 전문 기업입니다.'
            }
          ];
          
          // 로컬 스토리지에 샘플 데이터 저장
          localStorage.setItem('companiesData', JSON.stringify(companies));
        }
        
        // 테이블 렌더링
        renderCompaniesTable();
      } catch (error) {
        console.error('기업 정보 로드 오류:', error);
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-red-600">데이터 로드 중 오류가 발생했습니다.</td></tr>`;
      }
    }
    
    // 기업 정보 테이블 렌더링
    function renderCompaniesTable() {
      console.log('기업 테이블 렌더링 시작');
      const tableBody = document.getElementById('companiesTableBody');
      
      if (!companies || companies.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4">등록된 기업 정보가 없습니다.</td></tr>`;
        return;
      }
      
      // 테이블 초기화
      tableBody.innerHTML = '';
      
      // 각 기업마다 행 추가
      companies.forEach(company => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-100 border-b';
        
        // 체크박스 셀
        const checkboxCell = document.createElement('td');
        checkboxCell.className = 'py-3 px-4 text-center';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'company-checkbox w-4 h-4 text-blue-600';
        checkbox.setAttribute('data-id', company.id);
        checkboxCell.appendChild(checkbox);
        
        // 기업명 셀
        const nameCell = document.createElement('td');
        nameCell.className = 'py-3 px-4';
        nameCell.textContent = company.name || '-';
        
        // 업종 셀
        const industryCell = document.createElement('td');
        industryCell.className = 'py-3 px-4';
        industryCell.textContent = company.industry || '-';
        
        // 담당자 셀
        const contactPersonCell = document.createElement('td');
        contactPersonCell.className = 'py-3 px-4';
        contactPersonCell.textContent = company.contact_person || '-';
        
        // 이메일 셀
        const emailCell = document.createElement('td');
        emailCell.className = 'py-3 px-4';
        emailCell.textContent = company.contact_email || '-';
        
        // 지역 셀
        const cityCell = document.createElement('td');
        cityCell.className = 'py-3 px-4';
        cityCell.textContent = company.city || '-';
        
        // 액션 셀
        const actionCell = document.createElement('td');
        actionCell.className = 'py-3 px-4 text-center';
        
        // 수정 버튼
        const editButton = document.createElement('button');
        editButton.className = 'text-blue-500 hover:text-blue-700 mr-2';
        editButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>`;
        editButton.onclick = () => openEditModal(company.id);
        
        // 삭제 버튼
        const deleteButton = document.createElement('button');
        deleteButton.className = 'text-red-500 hover:text-red-700';
        deleteButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>`;
        deleteButton.onclick = () => openDeleteModal(company.id);
        
        // 액션 버튼 추가
        actionCell.appendChild(editButton);
        actionCell.appendChild(deleteButton);
        
        // 모든 셀을 행에 추가
        row.appendChild(checkboxCell);
        row.appendChild(nameCell);
        row.appendChild(industryCell);
        row.appendChild(contactPersonCell);
        row.appendChild(emailCell);
        row.appendChild(cityCell);
        row.appendChild(actionCell);
        
        // 테이블에 행 추가
        tableBody.appendChild(row);
      });
      
      // 전체 선택 체크박스 초기화
      const selectAllCheckbox = document.getElementById('selectAllCompanies');
      if (selectAllCheckbox) {
        selectAllCheckbox.checked = false;
      }
      
      console.log('기업 테이블 렌더링 완료');
    }
    
    // 기업 정보 수정
    async function updateCompany() {
      console.log('기업 정보 수정 시작');
      
      // 폼 데이터 가져오기
      const companyId = document.getElementById('editCompanyId').value;
      const companyName = document.getElementById('editCompanyName').value.trim();
      const industry = document.getElementById('editIndustry').value.trim();
      const contactPerson = document.getElementById('editContactPerson').value.trim();
      const contactEmail = document.getElementById('editContactEmail').value.trim();
      const city = document.getElementById('editCity').value.trim();
      const address = document.getElementById('editAddress').value.trim();
      const description = document.getElementById('editDescription').value.trim();
      
      // 필수 필드 검증
      if (!companyName) {
        alert('기업명은 필수 입력 항목입니다.');
        return;
      }
      
      // 이메일 형식 검증
      if (contactEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contactEmail)) {
        alert('유효한 이메일 주소를 입력해주세요.');
        return;
      }
      
      // 버튼 상태 변경
      const updateButton = document.querySelector('#confirmEditButton');
      if (updateButton) {
        updateButton.textContent = '저장 중...';
        updateButton.disabled = true;
      }
      
      try {
        // 업데이트할 데이터 준비
        const updatedCompany = {
          id: companyId,
          name: companyName,
          industry,
          contact_person: contactPerson,
          contact_email: contactEmail,
          city,
          address,
          description
        };
        
        console.log('업데이트할 기업 정보:', updatedCompany);
        
        // 로컬 데이터 업데이트
        const companyIndex = companies.findIndex(c => c.id == companyId);
        
        if (companyIndex === -1) {
          throw new Error('수정할 기업 정보를 찾을 수 없습니다.');
        }
        
        companies[companyIndex] = updatedCompany;
        
        // 로컬 스토리지 업데이트
        localStorage.setItem('companiesData', JSON.stringify(companies));
        
        // API를 통한 데이터 업데이트 시도
        try {
          const result = await updateData('기업정보', updatedCompany);
          console.log('API 업데이트 결과:', result);
          
          if (result && result.success) {
            console.log('API를 통해 기업 정보 업데이트 성공');
          } else {
            console.warn('API 업데이트 실패, 로컬에만 업데이트됨:', result?.error);
          }
        } catch (apiError) {
          console.error('API 업데이트 중 오류:', apiError);
        }
        
        // 테이블 갱신
        renderCompaniesTable();
        alert('기업 정보가 성공적으로 수정되었습니다.');
        
        // 모달 닫기
        closeEditModal();
      } catch (error) {
        console.error('기업 정보 수정 오류:', error);
        alert('기업 정보 수정 중 오류가 발생했습니다: ' + error.message);
      } finally {
        // 버튼 상태 복원
        if (updateButton) {
          updateButton.textContent = '저장';
          updateButton.disabled = false;
        }
      }
    }

    // 기업 정보 삭제
    async function deleteCompany() {
      console.log('기업 정보 삭제 시작');
      
      // 전체 선택 체크박스 확인
      const selectAllCheckbox = document.getElementById('selectAllCompanies');
      const isSelectAll = selectAllCheckbox && selectAllCheckbox.checked;
      
      // 삭제할 ID 목록 구성
      let idsToDelete = [];
      
      if (isSelectAll) {
        // 모든 기업 ID
        idsToDelete = companies.map(company => company.id);
      } else if (selectedCompanyId) {
        // 단일 기업 ID
        idsToDelete = [selectedCompanyId];
      } else {
        // 체크된 기업들
        const checkedBoxes = document.querySelectorAll('.company-checkbox:checked');
        idsToDelete = Array.from(checkedBoxes).map(checkbox => checkbox.getAttribute('data-id'));
      }
      
      // 삭제할 항목이 없으면 종료
      if (idsToDelete.length === 0) {
        alert('삭제할 기업을 선택해주세요.');
        closeDeleteModal();
        return;
      }
      
      // 버튼 상태 변경
      const deleteButton = document.querySelector('#confirmDeleteButton');
      if (deleteButton) {
        deleteButton.textContent = '삭제 중...';
        deleteButton.disabled = true;
      }
      
      try {
        console.log(`${idsToDelete.length}개 기업 정보 삭제 시작`);
        
        // API를 통한 데이터 삭제 시도
        const deleteResults = [];
        
        for (const id of idsToDelete) {
          try {

    // CSV 파일 처리
    async function processCSVFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onload = function(event) {
          try {
            const csvContent = event.target.result;
            const lines = csvContent.split('\n');
            
            // 헤더 확인 (첫 줄)
            const headers = lines[0].split(',').map(header => 
              header.trim().replace(/^"|"$/g, '')
            );
            
            // 필수 헤더 확인
            const requiredHeaders = ['기업명'];
            const missingHeaders = requiredHeaders.filter(h => !headers.includes(h));
            
            if (missingHeaders.length > 0) {
              return reject(`필수 헤더가 없습니다: ${missingHeaders.join(', ')}`);
            }
            
            // 헤더 인덱스 매핑
            const headerMap = {
              '기업명': 'name',
              '업종': 'industry',
              '담당자': 'contact_person',
              '이메일': 'contact_email',
              '지역': 'city',
              '주소': 'address',
              '설명': 'description'
            };
            
            const indexMap = {};
            headers.forEach((header, index) => {
              const fieldName = headerMap[header];
              if (fieldName) indexMap[index] = fieldName;
            });
            
            // 데이터 파싱
            const companies = [];
            
            for (let i = 1; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line) continue;
              
              // 쉼표로 분리 (따옴표 내부의 쉼표는 무시)
              const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
              
              // 객체 생성
              const company = { id: 'local_' + Date.now() + '_' + i };
              
              values.forEach((value, index) => {
                const field = indexMap[index];
                if (field) {
                  company[field] = value.replace(/^"|"$/g, '');
                }
              });
              
              // 기업명은 필수값
              if (company.name) {
                companies.push(company);
              }
            }
            
            resolve(companies);
          } catch (error) {
            console.error('CSV 파싱 오류:', error);
            reject('CSV 파일 처리 중 오류가 발생했습니다.');
          }
        };
        
        reader.onerror = function() {
          reject('파일을 읽는 중 오류가 발생했습니다.');
        };
        
        reader.readAsText(file, 'UTF-8');
      });
    }

    // 기업 추가 (파일 업로드 처리)
    async function addCompanies() {
      console.log('기업 추가 시작');
      const fileInput = document.getElementById('companyFileInput');
      
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        alert('업로드할 파일을 선택해주세요.');
        return;
      }
      
      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop().toLowerCase();
      
      // 파일 형식 확인
      if (!['csv', 'xlsx', 'xls'].includes(fileExt)) {
        alert('엑셀(.xlsx, .xls) 또는 CSV(.csv) 파일만 업로드 가능합니다.');
        return;
      }
      
      // 버튼 상태 변경
      const addButton = document.querySelector('#confirmAddButton');
      if (addButton) {
        addButton.textContent = '처리 중...';
        addButton.disabled = true;
      }
      
      try {
        let newCompanies = [];
        
        if (fileExt === 'csv') {
          // CSV 파일 처리
          newCompanies = await processCSVFile(file);
        } else {
          // 엑셀 파일은 API를 통해 처리
          const formData = new FormData();
          formData.append('file', file);
          formData.append('sheet', '기업정보');
          
          const result = await uploadFile(formData);
          console.log('파일 업로드 결과:', result);
          
          if (result && result.success && Array.isArray(result.data)) {
            newCompanies = result.data;
          } else {
            throw new Error(result?.error || '파일 업로드 실패');
          }
        }
        
        console.log(`${newCompanies.length}개 기업 데이터 추가 준비 완료`);
        
        // 새 기업 데이터 추가
        if (newCompanies.length > 0) {
          // ID 할당 (임시)
          newCompanies.forEach((company, index) => {
            if (!company.id) {
              company.id = `new_${Date.now()}_${index}`;
            }
          });
          
          // 기존 데이터와 병합
          companies = [...companies, ...newCompanies];
          
          // 로컬 스토리지에 저장
          localStorage.setItem('companiesData', JSON.stringify(companies));
          
          // API를 통한 데이터 저장 시도
          try {
            const result = await addData('기업정보', newCompanies);
            console.log('API 저장 결과:', result);
            
            if (result && result.success) {
              console.log('API를 통해 기업 정보 저장 성공');
            } else {
              console.warn('API 저장 실패, 로컬에만 저장됨:', result?.error);
            }
          } catch (apiError) {
            console.error('API 저장 중 오류:', apiError);
          }
          
          // 테이블 갱신
          renderCompaniesTable();
          alert(`${newCompanies.length}개 기업 정보가 추가되었습니다.`);
          
          // 파일 입력 초기화
          fileInput.value = '';
          document.getElementById('selectedFileName').textContent = '선택된 파일 없음';
          
          // 모달 닫기
          closeAddModal();
        } else {
          alert('추가할 기업 정보가 없습니다. 파일을 확인해주세요.');
        }
      } catch (error) {
        console.error('기업 추가 중 오류:', error);
        alert('기업 정보 추가 중 오류가 발생했습니다: ' + error.message);
      } finally {
        // 버튼 상태 복원
        if (addButton) {
          addButton.textContent = '등록';
          addButton.disabled = false;
        }
      }
    }
