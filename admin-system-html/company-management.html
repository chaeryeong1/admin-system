<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 기업 관리</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-blue-600">기업 관리</a>
    <a href="cashback-management.html" class="text-gray-500">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">기업 관리</h2>
      <ul class="space-y-2">
        <li class="text-blue-600 font-semibold">ㆍ기업 리스트 관리</li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">기업 리스트 관리</div>

      <!-- 검색/필터링 -->
      <div class="flex items-center space-x-4">
        <select 
          id="businessFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 사업</option>
          <option value="클라우드 보급사업">클라우드 보급사업</option>
        </select>
        <input 
          id="searchInput"
          type="text" 
          placeholder="기업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
        <div class="flex-1 text-right space-x-2">
          <button 
            id="addButton"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            + 추가
          </button>
          <button 
            id="excelButton"
            class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
          >
            엑셀 다운로드
          </button>
        </div>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">
                  <input 
                    type="checkbox" 
                    id="selectAllCheckbox"
                    class="cursor-pointer"
                  >
                </th>
                <th class="px-4 py-2 text-left">기업명</th>
                <th class="px-4 py-2 text-left">사업자등록번호</th>
                <th class="px-4 py-2 text-left">대표자</th>
                <th class="px-4 py-2 text-left">이메일</th>
                <th class="px-4 py-2 text-left">연락처</th>
                <th class="px-4 py-2 text-left">등록일</th>
              </tr>
            </thead>
            <tbody id="companyTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="editButton"
          class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 opacity-50 cursor-not-allowed"
          disabled
        >
          수정
        </button>
        <button 
          id="deleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 opacity-50 cursor-not-allowed"
          disabled
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 추가 모달 -->
  <div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">기업 정보 추가</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">파일 업로드 <span class="text-red-500">*</span></label>
          <input
            id="addExcelFile"
            type="file"
            accept=".xlsx, .xls, .csv"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
          <p class="text-xs text-gray-500 mt-1">엑셀(.xlsx, .xls) 또는 CSV(.csv) 파일만 업로드 가능합니다</p>
        </div>
        <div>
          <a href="#" id="downloadSampleButton" class="text-blue-600 hover:underline text-sm">샘플 다운로드</a>
          <p class="text-xs text-gray-500 mt-1">양식에 맞춰 작성 후 업로드해주세요</p>
        </div>
        <div class="flex justify-end space-x-2 mt-6">
          <button 
            id="addCancelButton"
            type="button"
            class="px-4 py-2 border rounded hover:bg-gray-100"
          >
            취소
          </button>
          <button 
            id="confirmAddButton"
            type="button"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">기업 정보 수정</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">기존 데이터 다운로드</label>
          <button 
            id="downloadCurrentDataButton"
            type="button" 
            class="w-full px-3 py-2 bg-gray-100 border rounded hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            엑셀 파일 다운로드
          </button>
          <p class="text-xs text-gray-500 mt-1">기존 데이터를 수정 후 아래에 업로드하세요</p>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">파일 업로드 <span class="text-red-500">*</span></label>
          <input
            id="editExcelFile"
            type="file"
            accept=".xlsx, .xls, .csv"
            class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>
        <div class="flex justify-end space-x-2 mt-6">
          <button 
            id="editCancelButton"
            type="button"
            class="px-4 py-2 border rounded hover:bg-gray-100"
          >
            취소
          </button>
          <button 
            id="confirmEditButton"
            type="button"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
          >
            저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">기업 삭제</h2>
      <p>선택한 기업을 정말 삭제하시겠습니까?</p>
      <div id="deleteCompanyList" class="mt-4 mb-4 bg-gray-100 p-3 rounded text-sm max-h-40 overflow-y-auto">
        <!-- 선택된 기업 목록이 표시될 영역 -->
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelDeleteButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmDeleteButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          삭제
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // DOM 요소
    const companyTableBody = document.getElementById('companyTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const addButton = document.getElementById('addButton');
    const deleteButton = document.getElementById('deleteButton');
    const editButton = document.getElementById('editButton');
    
    // 모달 관련 요소
    const addModal = document.getElementById('addModal');
    const editModal = document.getElementById('editModal');
    const deleteModal = document.getElementById('deleteModal');
    
    // 폼 요소
    const addForm = document.getElementById('addForm');
    const editForm = document.getElementById('editForm');
    const deleteCompanyName = document.getElementById('deleteCompanyName');
    
    // 데이터 상태
    let companies = [];
    let selectedCompanyIds = [];
    
    // 회사 데이터 로드
    async function loadCompanies() {
      try {
        console.log('기업 데이터 로드 시작');
        
        // 로딩 표시
        companyTableBody.innerHTML = '<tr><td colspan="7" class="px-4 py-2 text-center">데이터를 불러오는 중...</td></tr>';
        
        // API에서 데이터 가져오기
        const result = await fetchData('기업정보');
        console.log('API 응답:', result);
        
        // API 호출 성공 시
        if (result && result.success && result.data && Array.isArray(result.data)) {
          companies = result.data;
          console.log('서버에서 로드된 기업 수:', companies.length);
          
          // 로컬 스토리지에도 최신 데이터 저장 (오프라인 모드를 위한 백업)
          localStorage.setItem('companiesData', JSON.stringify(companies));
        } 
        // API 호출 실패 시, 로컬 스토리지 데이터 사용 시도
        else {
          console.warn('API 호출 실패, 로컬 데이터 확인 중...');
          
          const savedData = localStorage.getItem('companiesData');
          
          if (savedData) {
            try {
              const parsedData = JSON.parse(savedData);
              if (parsedData && Array.isArray(parsedData) && parsedData.length > 0) {
                console.log('로컬 스토리지에서 데이터 로드:', parsedData.length + '개 항목');
                companies = parsedData;
              } else {
                throw new Error('저장된 데이터 없음');
              }
            } catch (e) {
              console.error('로컬 스토리지 데이터 파싱 오류:', e);
              localStorage.removeItem('companiesData');
              useDefaultData();
            }
          } else {
            console.log('로컬 스토리지에 데이터 없음, 기본 데이터 사용');
            useDefaultData();
          }
        }
        
        // 데이터를 화면에 표시
        renderCompanies();
      } catch (error) {
        console.error('데이터 로드 오류:', error);
        
        // 오류 발생 시 로컬 데이터 사용 시도
        const savedData = localStorage.getItem('companiesData');
        if (savedData) {
          try {
            companies = JSON.parse(savedData);
            renderCompanies();
            console.log('오류 발생으로 로컬 데이터 사용');
          } catch (e) {
            companyTableBody.innerHTML = '<tr><td colspan="7" class="px-4 py-2 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
          }
        } else {
          // 로컬 데이터도 없는 경우 기본 데이터 사용
          console.log('로컬 데이터 없음, 기본 데이터 사용');
          useDefaultData();
          renderCompanies();
        }
      }
    }
    
    // 기본 데이터 사용 (샘플 데이터)
    function useDefaultData() {
      console.log('기본 샘플 데이터 생성');
      companies = [
        { id: 'sample1', name: '샘플 기업 1', tel: '02-1234-5678', email: 'sample1@example.com', address: '서울시 강남구 테헤란로 123', memo: '샘플 메모 1', registerDate: new Date().toISOString().split('T')[0] },
        { id: 'sample2', name: '샘플 기업 2', tel: '02-2345-6789', email: 'sample2@example.com', address: '서울시 서초구 강남대로 456', memo: '샘플 메모 2', registerDate: new Date().toISOString().split('T')[0] },
        { id: 'sample3', name: '샘플 기업 3', tel: '02-3456-7890', email: 'sample3@example.com', address: '서울시 종로구 세종대로 789', memo: '샘플 메모 3', registerDate: new Date().toISOString().split('T')[0] }
      ];
      localStorage.setItem('companiesData', JSON.stringify(companies));
    }

    // 날짜 포맷팅
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return isNaN(date.getTime()) 
        ? dateString 
        : `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // 회사 목록 렌더링
    function renderCompanies() {
      const searchTerm = searchInput.value.toLowerCase();
      
      const filteredCompanies = companies.filter(company => 
        company.name?.toLowerCase().includes(searchTerm) || 
        company.businessNumber?.toLowerCase().includes(searchTerm) ||
        company.address?.toLowerCase().includes(searchTerm) ||
        company.representative?.toLowerCase().includes(searchTerm)
      );
      
      if (filteredCompanies.length === 0) {
        companyTableBody.innerHTML = '<tr><td colspan="7" class="px-4 py-2 text-center">검색 결과가 없습니다.</td></tr>';
        return;
      }
      
      // 테이블 생성
      companyTableBody.innerHTML = filteredCompanies.map(company => `
        <tr class="border-b hover:bg-gray-50" data-id="${company.id}">
          <td class="px-4 py-2">
            <input 
              type="checkbox" 
              class="company-checkbox" 
              data-id="${company.id}"
              data-name="${company.name || ''}"
              ${selectedCompanyIds.includes(String(company.id)) ? 'checked' : ''}
            >
          </td>
          <td class="px-4 py-2">${company.name || '-'}</td>
          <td class="px-4 py-2">${company.businessNumber || '-'}</td>
          <td class="px-4 py-2">${company.representative || '-'}</td>
          <td class="px-4 py-2">${company.email || '-'}</td>
          <td class="px-4 py-2">${company.contact || '-'}</td>
          <td class="px-4 py-2">${formatDate(company.registrationDate) || '-'}</td>
        </tr>
      `).join('');
      
      // 체크박스 이벤트 리스너 추가
      document.querySelectorAll('.company-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', handleCompanySelection);
      });
      
      // 테이블 행 클릭 이벤트 추가
      document.querySelectorAll('#companyTableBody tr').forEach(row => {
        row.addEventListener('click', function(e) {
          // 링크 클릭은 무시
          if (e.target.tagName === 'A') return;
          
          // 체크박스 클릭은 체크박스 자체가 처리
          if (e.target.type === 'checkbox') return;
          
          // 행 클릭 시 해당 체크박스 토글
          const checkbox = this.querySelector('.company-checkbox');
          if (checkbox) {
            checkbox.checked = !checkbox.checked;
            
            // 체크박스 변경 이벤트 발생시키기
            const event = new Event('change', { bubbles: true });
            checkbox.dispatchEvent(event);
          }
        });
      });
      
      // 버튼 상태 업데이트
      updateButtonStates();
      
      // 전체 선택 체크박스 상태 업데이트
      updateSelectAllCheckbox();
    }
    
    // 회사 선택 처리 (이제 다중 선택 가능)
    function handleCompanySelection(event) {
      const checkbox = event.target;
      const companyId = checkbox.dataset.id;
      
      if (checkbox.checked) {
        // 체크된 경우 배열에 ID 추가
        if (!selectedCompanyIds.includes(companyId)) {
          selectedCompanyIds.push(companyId);
        }
      } else {
        // 체크 해제된 경우 배열에서 ID 제거
        selectedCompanyIds = selectedCompanyIds.filter(id => id !== companyId);
      }
      
      console.log('선택된 기업 ID 목록:', selectedCompanyIds);
      
      updateButtonStates();
      updateSelectAllCheckbox();
    }
    
    // 전체 선택 체크박스 상태 업데이트
    function updateSelectAllCheckbox() {
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      const checkboxes = document.querySelectorAll('.company-checkbox');
      
      if (!selectAllCheckbox || checkboxes.length === 0) return;
      
      // 모든 체크박스가 선택되었는지 확인
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      // 일부 체크박스만 선택되었는지 확인
      const someChecked = Array.from(checkboxes).some(cb => cb.checked);
      
      selectAllCheckbox.checked = allChecked;
      // 여기서 필요하면 indeterminate 상태 추가 가능
      selectAllCheckbox.indeterminate = someChecked && !allChecked;
    }
    
    // 전체 선택/해제 처리
    function handleSelectAll() {
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
      const checkboxes = document.querySelectorAll('.company-checkbox');
      
      if (!selectAllCheckbox || checkboxes.length === 0) return;
      
      const isChecked = selectAllCheckbox.checked;
      
      checkboxes.forEach(checkbox => {
        checkbox.checked = isChecked;
        
        const companyId = checkbox.dataset.id;
        
        if (isChecked) {
          // 전체 선택 시 모든 ID 추가
          if (!selectedCompanyIds.includes(companyId)) {
            selectedCompanyIds.push(companyId);
          }
        } else {
          // 전체 해제 시 배열 비우기
          selectedCompanyIds = [];
        }
      });
      
      updateButtonStates();
    }
    
    // 버튼 상태 업데이트
    function updateButtonStates() {
      const hasSelection = selectedCompanyIds.length > 0;
      
      editButton.disabled = !hasSelection;
      deleteButton.disabled = !hasSelection;
      
      if (hasSelection) {
        editButton.classList.remove('opacity-50', 'cursor-not-allowed');
        deleteButton.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        editButton.classList.add('opacity-50', 'cursor-not-allowed');
        deleteButton.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }
    
    // 모달 열기/닫기 함수들
    function openAddModal() {
      console.log('기업 추가 모달 열기');
      
      // 파일 필드 초기화
      const addExcelFile = document.getElementById('addExcelFile');
      if (addExcelFile) {
        addExcelFile.value = '';
      }
      
      // 모달 표시
      addModal.classList.remove('hidden');
    }
    
    function closeAddModal() {
      addModal.classList.add('hidden');
    }
    
    function openEditModal() {
      console.log('기업 수정 모달 열기', selectedCompanyIds);
      
      if (selectedCompanyIds.length === 0) {
        alert('수정할 기업을 선택해주세요.');
        return;
      }
      
      // 다중 선택된 경우 처리
      if (selectedCompanyIds.length > 1) {
        alert('수정은 한 번에 하나의 기업만 가능합니다. 하나의 기업만 선택해주세요.');
        return;
      }
      
      // 단일 선택된 기업 ID
      const companyId = selectedCompanyIds[0];
      console.log('수정할 기업 ID:', companyId);
      
      // 문자열 변환하여 비교 (ID 형식 차이 해결)
      const company = companies.find(c => String(c.id) === String(companyId));
      
      if (!company) {
        console.error('선택된 ID에 해당하는 기업을 찾을 수 없음:', companyId);
        console.log('현재 기업 목록:', companies);
        alert('선택한 기업 정보를 찾을 수 없습니다.');
        return;
      }
      
      console.log('수정할 기업 정보:', company);
      
      // 파일 필드 초기화
      const editExcelFile = document.getElementById('editExcelFile');
      if (editExcelFile) {
        editExcelFile.value = '';
      }
      
      // 모달 표시
      editModal.classList.remove('hidden');
    }
    
    function closeEditModal() {
      editModal.classList.add('hidden');
    }
    
    function openDeleteModal() {
      console.log('기업 삭제 모달 열기', selectedCompanyIds);
      
      if (selectedCompanyIds.length === 0) {

    async function downloadCurrentData() {

        if (!companies || companies.length === 0) {

        // CSV 헤더 생성
        const headers = ['id', '기업명', '연락처', '이메일', '주소', '메모', '등록일'];
        let csvContent = headers.join(',') + '\n';
        
        // 각 회사 데이터를 CSV 행으로 변환
        companies.forEach(company => {
          const row = [
            company.id || '',
            company.name || '',
            company.tel || '',
            company.email || '',
            (company.address || '').replace(/,/g, ' '), // 콤마 제거
            (company.memo || '').replace(/,/g, ' '), // 콤마 제거
            company.registerDate || new Date().toISOString().split('T')[0]
          ];
          
          // 콤마와 줄바꿈이 있는 필드는 큰따옴표로 감싸기
          const formattedRow = row.map(field => {
            // 필드가 콤마, 큰따옴표 또는 줄바꿈을 포함하면 큰따옴표로 감싸기
            if (field.includes(',') || field.includes('"') || field.includes('\n')) {
              // 큰따옴표는 두 개의 큰따옴표로 이스케이프
              return '"' + field.replace(/"/g, '""') + '"';
            }
            return field;
          });
          
          csvContent += formattedRow.join(',') + '\n';
        });
        
        // CSV 파일 다운로드
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', '기업정보_' + new Date().toISOString().split('T')[0] + '.csv');
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        alert('현재 기업 정보가 CSV 파일로 다운로드되었습니다.');
      } catch (error) {
        console.error('데이터 다운로드 오류:', error);
        alert('기업 정보 다운로드 중 오류가 발생했습니다: ' + error.message);
      }
    }
    
    // CSV 파일 처리
    async function processCSVFile(file, processFunction) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onload = async function(e) {
          try {
            const text = e.target.result;
            const rows = text.split('\n');
            const headers = rows[0].split(',');
            
            // 헤더 없이 비어있는 경우
            if (rows.length < 2) {
              alert('유효한 데이터가 없습니다.');
              reject(new Error('유효한 데이터가 없습니다.'));
              return;
            }
            
            console.log('CSV 헤더:', headers);
            
            // 필수 헤더 확인
            const requiredHeaders = ['name', 'businessNumber'];
            for (const header of requiredHeaders) {
              if (!headers.includes(header)) {
                alert(`필수 필드 '${header}'가 CSV 파일에 없습니다.`);
                reject(new Error(`필수 필드 '${header}'가 CSV 파일에 없습니다.`));
                return;
              }
            }
            
            // CSV 행 처리
            let successCount = 0;
            for (let i = 1; i < rows.length; i++) {
              const row = rows[i].trim();
              if (!row) continue; // 빈 행 무시
              
              const values = row.split(',');
              if (values.length !== headers.length) {
                console.warn(`행 ${i}: 열 수가 일치하지 않습니다. 무시합니다.`, values);
                continue;
              }
              
              // 객체 생성
              const companyData = {};
              headers.forEach((header, index) => {
                companyData[header.trim()] = values[index].trim();
              });
              
              // ID가 없으면 생성
              if (!companyData.id) {
                companyData.id = Date.now() + i;
              }
              
              // 데이터 처리 함수 호출
              const success = await processFunction(companyData);
              if (success) successCount++;
            }
            
            alert(`${successCount}개의 기업 정보가 성공적으로 처리되었습니다.`);
            await loadCompanies(); // 목록 새로고침
            resolve(true);
          } catch (error) {
            console.error('CSV 처리 오류:', error);
            alert('CSV 파일 처리 중 오류가 발생했습니다: ' + error.message);
            reject(error);
          }
        };
        
        reader.onerror = function() {
          reject(new Error('파일을 읽는 중 오류가 발생했습니다.'));
        };
        
        reader.readAsText(file);
      });
    }

      }
      
      // 체크박스 관련 이벤트 처리
      document.addEventListener('click', function(event) {
        const target = event.target;
        
        // 체크박스 클릭 처리
        if (target.matches('.company-checkbox')) {
          // 체크박스 이벤트는 handleCompanySelection에서 처리됨
          return;
        }
        
        // 행 클릭 처리 (이미 renderCompanies에서 처리)
        if (target.closest('tr') && !target.closest('th')) {
          // 클릭 이벤트는 이미 설정되어 있음
          return;
        }
      });
      
      // 전체선택 체크박스
      const selectAllCheckbox = document.getElementById('selectAllCheckbox');
