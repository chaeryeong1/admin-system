<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="../js/api.js"></script>
  <script>
    // 페이지 로드 시 기업 관리 페이지로 리다이렉트
    window.location.href = 'company-management.html';
  </script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .login-container {
      max-width: 400px;
      margin: 0 auto;
    }
    .register-link {
      cursor: pointer;
      text-decoration: underline;
    }
    .email-verification {
      margin-top: 10px;
      font-size: 0.9rem;
    }
    .verification-code {
      display: none;
    }
    .verification-input-container {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 로딩 중 표시 -->
  <div class="flex justify-center items-center min-h-screen">
    <div class="text-center">
      <h1 class="text-2xl font-bold mb-4">페이지 이동 중...</h1>
      <p class="text-gray-600">잠시만 기다려주세요.</p>
    </div>
  </div>

  <script>
    // 현재 로그인한 사용자 정보
    let currentUser = null;
    let isEmailVerified = false;
    let verificationCodeSent = false;
    let currentVerificationCode = '';
    
    // DOM 요소
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const mainDashboard = document.getElementById('mainDashboard');
    const mainHeader = document.getElementById('mainHeader');
    
    // 폼 전환 버튼
    document.getElementById('showRegisterForm').addEventListener('click', () => {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
    });
    
    document.getElementById('showLoginForm').addEventListener('click', () => {
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });
    
    // 이메일 인증 처리
    document.getElementById('sendVerificationCode').addEventListener('click', async () => {
      const emailId = document.getElementById('emailId').value;
      const email = emailId + '@sepehrd.kr';
      const verificationMessage = document.getElementById('verificationMessage');
      
      if (!emailId) {
        showMessage(document.getElementById('registerMessage'), '이메일 아이디를 입력해주세요.', 'error');
        return;
      }
      
      try {
        // 인증 코드 생성
        currentVerificationCode = generateVerificationCode();
        
        // 이메일 전송 API 호출
        const result = await sendVerificationEmail(email, currentVerificationCode);
        
        if (result.success) {
          // 인증 코드 입력 영역 표시
          document.getElementById('verificationCodeContainer').style.display = 'block';
          
          // 상태 업데이트
          verificationCodeSent = true;
          
          // 메시지 표시
          showMessage(document.getElementById('registerMessage'), '인증 코드가 이메일로 전송되었습니다.', 'success');
        } else {
          showMessage(document.getElementById('registerMessage'), result.message || '인증 코드 전송 중 오류가 발생했습니다.', 'error');
        }
      } catch (error) {
        console.error('이메일 인증 코드 전송 중 오류 발생:', error);
        showMessage(document.getElementById('registerMessage'), '인증 코드 전송 중 오류가 발생했습니다.', 'error');
      }
    });
    
    // 인증 코드 확인
    document.getElementById('verifyCode').addEventListener('click', () => {
      const enteredCode = document.getElementById('verificationCode').value;
      
      if (enteredCode === currentVerificationCode) {
        // 인증 성공
        isEmailVerified = true;
        showMessage(document.getElementById('registerMessage'), '이메일 인증이 완료되었습니다.', 'success');
        document.getElementById('registerButton').disabled = false;
        document.getElementById('emailId').readOnly = true;
        document.getElementById('sendVerificationCode').disabled = true;
        document.getElementById('verificationCode').readOnly = true;
        document.getElementById('verifyCode').disabled = true;
      } else {
        // 인증 실패
        showMessage(document.getElementById('registerMessage'), '인증 코드가 일치하지 않습니다.', 'error');
      }
    });
    
    // 로그인 처리
    document.getElementById('loginButton').addEventListener('click', async () => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageElement = document.getElementById('loginMessage');
      
      if (!username || !password) {
        showMessage(messageElement, '아이디와 비밀번호를 모두 입력해주세요.', 'error');
        return;
      }
      
      try {
        // 로그인 API 호출
        const data = await login(username, password);
        
        if (data.success) {
          // 로그인 성공
          currentUser = {
            id: data.userId,
            username: username,
            permission: data.permission
          };
          
          // 로컬 스토리지에 사용자 정보 저장
          localStorage.setItem('adminUser', JSON.stringify(currentUser));
          
          // 대시보드 표시
          showDashboard();
        } else {
          // 로그인 실패
          showMessage(messageElement, '아이디 또는 비밀번호가 올바르지 않습니다.', 'error');
        }
      } catch (error) {
        console.error('로그인 중 오류 발생:', error);
        showMessage(messageElement, '로그인 처리 중 오류가 발생했습니다.', 'error');
      }
    });
    
    // 회원가입 처리
    document.getElementById('registerButton').addEventListener('click', async () => {
      const username = document.getElementById('newUsername').value;
      const password = document.getElementById('newPassword').value;
      const emailId = document.getElementById('emailId').value;
      const email = emailId + '@sepehrd.kr';
      const permission = document.getElementById('permission').value;
      const messageElement = document.getElementById('registerMessage');
      
      if (!username || !password) {
        showMessage(messageElement, '아이디와 비밀번호를 모두 입력해주세요.', 'error');
        return;
      }
      
      if (!isEmailVerified) {
        showMessage(messageElement, '이메일 인증이 필요합니다.', 'error');
        return;
      }
      
      try {
        // 회원가입 API 호출
        const data = await register({
          username,
          password,
          email,
          permission
        });
        
        if (data.success) {
          // 회원가입 성공
          showMessage(messageElement, '관리자 계정이 성공적으로 생성되었습니다.', 'success');
          
          // 3초 후 로그인 폼으로 전환
          setTimeout(() => {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
          }, 3000);
        } else {
          // 회원가입 실패
          showMessage(messageElement, data.message || '관리자 계정 생성에 실패했습니다.', 'error');
        }
      } catch (error) {
        console.error('회원가입 중 오류 발생:', error);
        showMessage(messageElement, '관리자 계정 생성 중 오류가 발생했습니다.', 'error');
      }
    });
    
    // 로그아웃 처리
    document.getElementById('logoutButton').addEventListener('click', () => {
      // 사용자 정보 초기화
      currentUser = null;
      localStorage.removeItem('adminUser');
      
      // 로그인 폼 표시
      mainDashboard.classList.add('hidden');
      mainHeader.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });
    
    // 메시지 표시 함수
    function showMessage(element, message, type) {
      element.textContent = message;
      element.classList.remove('hidden', 'text-green-600', 'text-red-600');
      
      if (type === 'success') {
        element.classList.add('text-green-600');
      } else if (type === 'error') {
        element.classList.add('text-red-600');
      }
      
      element.classList.remove('hidden');
    }
    
    // 대시보드 표시 함수
    function showDashboard() {
      // 로그인 폼 숨기기
      loginForm.classList.add('hidden');
      registerForm.classList.add('hidden');
      
      // 대시보드 표시
      mainDashboard.classList.remove('hidden');
      mainHeader.classList.remove('hidden');
      
      // 권한에 따라 메뉴 항목 필터링
      filterMenuByPermission();
    }
    
    // 권한에 따라 메뉴 필터링
    function filterMenuByPermission() {
      if (!currentUser) return;
      
      // 메뉴 항목 필터링
      document.querySelectorAll('.menu-item, .dashboard-item').forEach(item => {
        const permissions = item.getAttribute('data-permission').split(',');
        
        if (permissions.includes(currentUser.permission)) {
          item.classList.remove('hidden');
        } else {
          item.classList.add('hidden');
        }
      });
    }
  </script>
</body>
</html>
