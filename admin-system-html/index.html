<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아크리움 관리자 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .dashboard-header {
            text-align: center;
            margin-top: 3rem;
            margin-bottom: 2rem;
        }
        .dashboard-header h1 {
            font-weight: 700;
            color: #2c3e50;
        }
        .dashboard-header p {
            color: #7f8c8d;
        }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 16px rgba(44,62,80,0.08);
            padding: 1.5rem 2.5rem;
            min-width: 200px;
            text-align: center;
        }
        .stat-card .stat-icon {
            font-size: 2rem;
            color: #3498db;
            margin-bottom: 0.5rem;
        }
        .stat-card .stat-label {
            color: #7f8c8d;
            font-size: 1rem;
        }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
        }
        .menu-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }
        .menu-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            padding: 2rem 1.5rem;
            min-width: 260px;
            max-width: 320px;
            flex: 1 1 260px;
            text-align: center;
            transition: transform 0.2s;
        }
        .menu-card:hover {
            transform: translateY(-8px) scale(1.03);
        }
        .menu-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
        }
        .menu-icon i {
            color: #fff;
            font-size: 2rem;
        }
        .menu-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .menu-desc {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }
        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #2980b9, #3498db);
        }
        @media (max-width: 900px) {
            .stats-row, .menu-row {
                flex-direction: column;
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h1>아크리움 관리자 대시보드</h1>
            <p>전체 현황을 한눈에 확인하고, 원하는 관리 메뉴로 빠르게 이동하세요.</p>
        </div>
    
        <div class="menu-row">
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-building"></i></div>
                <div class="menu-title">기업 관리</div>
                <div class="menu-desc">기업 정보를 효율적으로 관리하고, 선정 기업을 확인하세요.</div>
                <a href="company-management.html" class="btn btn-primary">기업 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-chart-line"></i></div>
                <div class="menu-title">사업 관리</div>
                <div class="menu-desc">사업 현황을 실시간으로 모니터링하고 관리하세요.</div>
                <a href="business-management.html" class="btn btn-primary">사업 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-coins"></i></div>
                <div class="menu-title">계약금 관리</div>
                <div class="menu-desc">계약금 수령 및 관리 내역을 확인하세요.</div>
                <a href="gmoney-management.html" class="btn btn-primary">계약금 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-money-bill-wave"></i></div>
                <div class="menu-title">캐시백 관리</div>
                <div class="menu-desc">캐시백 요청 및 지급 현황을 관리하세요.</div>
                <a href="cashback-management.html" class="btn btn-primary">캐시백 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-bullhorn"></i></div>
                <div class="menu-title">안내 관리</div>
                <div class="menu-desc">공지사항 및 안내 정보를 등록·수정하세요.</div>
                <a href="notice-management.html" class="btn btn-primary">안내 관리</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
