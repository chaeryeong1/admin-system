<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아크리움 관리자 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/common-styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h1>아크리움 관리자 대시보드</h1>
            <p>전체 현황을 한눈에 확인하고, 원하는 관리 메뉴로 빠르게 이동하세요.</p>
        </div>
    
        <div class="menu-row">
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-building"></i></div>
                <div class="menu-title">기업 관리</div>
                <div class="menu-desc">기업 정보를 효율적으로 관리하고, 선정 기업을 확인하세요.</div>
                <a href="html/company-management.html" class="btn btn-primary">기업 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-chart-line"></i></div>
                <div class="menu-title">사업 관리</div>
                <div class="menu-desc">사업 현황을 실시간으로 모니터링하고 관리하세요.</div>
                <a href="html/business-management.html" class="btn btn-primary">사업 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-coins"></i></div>
                <div class="menu-title">계약금 관리</div>
                <div class="menu-desc">계약금 수령 및 관리 내역을 확인하세요.</div>
                <a href="html/gmoney-management.html" class="btn btn-primary">계약금 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-money-bill-wave"></i></div>
                <div class="menu-title">캐시백 관리</div>
                <div class="menu-desc">캐시백 요청 및 지급 현황을 관리하세요.</div>
                <a href="html/cashback-management.html" class="btn btn-primary">캐시백 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-bullhorn"></i></div>
                <div class="menu-title">안내 관리</div>
                <div class="menu-desc">공지사항 및 안내 정보를 등록·수정하세요.</div>
                <a href="html/notice-management.html" class="btn btn-primary">안내 관리</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
