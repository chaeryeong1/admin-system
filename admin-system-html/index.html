<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 시스템 - 신청</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- 폰트어썸 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- Flatpickr 캘린더 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
    <!-- 공통 스타일 -->
    <link rel="stylesheet" href="..\css\common-styles.css">
    <!-- 라이브러리 버전 정보 -->
    <meta name="library-version" content="1.0.0">
    <!-- 구글 드라이브 API -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <!-- 페이지별 추가 스타일 -->
    <style>
      /* 페이지별 추가 스타일을 여기에 작성하세요 */
      .file-upload-btn {
        padding: 4px 8px;
        border-radius: 4px;
        background-color: #F3F4F6;
        color: #374151;
        font-size: 0.875rem;
        transition: all 0.2s;
      }
      
      .file-upload-btn:hover {
        background-color: #E5E7EB;
      }
      
      .file-upload-btn i {
        margin-right: 4px;
      }
      
      .file-upload-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      .file-name {
        font-size: 0.875rem;
        color: #6B7280;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <h1>아크리움 관리자 대시보드</h1>
            <p>전체 현황을 한눈에 확인하고, 원하는 관리 메뉴로 빠르게 이동하세요.</p>
        </div>
    
        <div class="menu-row">
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-building"></i></div>
                <div class="menu-title">기업 관리</div>
                <div class="menu-desc">기업 정보를 효율적으로 관리하고, 선정 기업을 확인하세요.</div>
                <a href="/html/company-management.html" class="btn btn-primary">기업 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-chart-line"></i></div>
                <div class="menu-title">사업 관리</div>
                <div class="menu-desc">사업 현황을 실시간으로 모니터링하고 관리하세요.</div>
                <a href="/html/business-management.html" class="btn btn-primary">사업 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-coins"></i></div>
                <div class="menu-title">계약금 관리</div>
                <div class="menu-desc">계약금 수령 및 관리 내역을 확인하세요.</div>
                <a href="/html/gmoney-management.html" class="btn btn-primary">계약금 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-money-bill-wave"></i></div>
                <div class="menu-title">캐시백 관리</div>
                <div class="menu-desc">캐시백 요청 및 지급 현황을 관리하세요.</div>
                <a href="/html/cashback-management.html" class="btn btn-primary">캐시백 관리</a>
            </div>
            <div class="menu-card">
                <div class="menu-icon"><i class="fas fa-bullhorn"></i></div>
                <div class="menu-title">안내 관리</div>
                <div class="menu-desc">공지사항 및 안내 정보를 등록·수정하세요.</div>
                <a href="/html/notice-management.html" class="btn btn-primary">안내 관리</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
