<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아크리움 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .container {
            max-width: 1200px;
            padding: 2rem;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-title {
            color: #2c3e50;
            font-weight: 600;
        }
        .card-text {
            color: #7f8c8d;
        }
        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #2980b9, #3498db);
        }
        .icon-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .icon-circle i {
            color: white;
            font-size: 24px;
        }
        .welcome-text {
            text-align: center;
            margin-bottom: 3rem;
        }
        .welcome-text h1 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .welcome-text p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-text">
            <h1>아크리움 관리 시스템</h1>
            <p>효율적인 사업 관리와 기업 정보 관리를 위한 통합 시스템</p>
        </div>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100 p-4">
                    <div class="icon-circle">
                        <i class="fas fa-building"></i>
                    </div>
                    <h3 class="card-title">기업 관리</h3>
                    <p class="card-text">기업 정보를 효율적으로 관리하고 업데이트하세요. 선정된 기업들의 상세 정보를 한눈에 확인할 수 있습니다.</p>
                    <a href="html/company-management.html" class="btn btn-primary mt-3">기업 관리 바로가기</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 p-4">
                    <div class="icon-circle">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <h3 class="card-title">사업 관리</h3>
                    <p class="card-text">사업 현황을 실시간으로 모니터링하고 관리하세요. 진행 중인 사업들의 상태와 성과를 쉽게 파악할 수 있습니다.</p>
                    <a href="html/business-management.html" class="btn btn-primary mt-3">사업 관리 바로가기</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
