<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 시스템 - 송금 승인</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- 상단 대메뉴 -->
  <header class="bg-white border-b px-6 py-3 text-sm font-semibold flex space-x-6">
    <a href="business-management.html" class="text-gray-500">사업 관리</a>
    <a href="company-management.html" class="text-gray-500">기업 관리</a>
    <a href="business-notification.html" class="text-gray-500">사업 안내</a>
    <a href="cashback-management.html" class="text-blue-600">캐시백 송금</a>
  </header>

  <div class="flex">
    <!-- 좌측 소메뉴 -->
    <aside class="w-60 bg-gray-50 p-4 text-sm border-r h-screen">
      <h2 class="text-base font-semibold mb-4">캐시백 송금</h2>
      <ul class="space-y-2">
        <li><a href="cashback-management.html" class="text-gray-600 hover:text-gray-900">ㆍ송금 관리</a></li>
        <li><a href="cashback-request.html" class="text-gray-600 hover:text-gray-900">ㆍ송금 요청</a></li>
        <li><a href="cashback-approval.html" class="text-blue-600 font-semibold">ㆍ송금 승인</a></li>
        <li><a href="cashback-transfer.html" class="text-gray-600 hover:text-gray-900">ㆍ송금 처리</a></li>
      </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="flex-1 p-6 space-y-6">
      <div class="text-xl font-bold border-b pb-2">송금 승인</div>

      <!-- 검색/필터링 -->
      <div class="flex items-center space-x-4">
        <select 
          id="businessFilter" 
          class="px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">모든 사업</option>
          <option value="클라우드 보급사업">클라우드 보급사업</option>
        </select>
        <input 
          id="searchInput"
          type="text" 
          placeholder="기업명 검색" 
          class="px-3 py-2 border rounded max-w-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button 
          id="searchButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          조회
        </button>
      </div>

      <!-- 표 -->
      <div class="bg-white border rounded shadow">
        <div class="p-4">
          <table class="min-w-full">
            <thead>
              <tr class="border-b">
                <th class="px-4 py-2 text-left">선택</th>
                <th class="px-4 py-2 text-left">기업명</th>
                <th class="px-4 py-2 text-left">담당자</th>
                <th class="px-4 py-2 text-left">참여 사업</th>
                <th class="px-4 py-2 text-left">요청일</th>
                <th class="px-4 py-2 text-left">금액</th>
                <th class="px-4 py-2 text-left">주문서</th>
                <th class="px-4 py-2 text-left">상태</th>
              </tr>
            </thead>
            <tbody id="approvalTableBody">
              <!-- JavaScript로 채워질 부분 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단 버튼 -->
      <div class="flex justify-end space-x-4">
        <button 
          id="rejectButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          거절
        </button>
        <button 
          id="approveButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          승인
        </button>
      </div>
    </div>
  </div>

  <!-- 승인 확인 모달 -->
  <div id="approveModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">송금 승인</h2>
      <p>다음 기업에 대한 송금을 승인하시겠습니까?</p>
      <p id="approveCompanyName" class="font-semibold mt-2"></p>
      <div class="mt-4">
        <label class="block text-sm font-medium mb-1">캐시백 금액</label>
        <div class="flex items-center">
          <input
            id="approveAmount"
            type="text"
            readonly
            class="w-full px-3 py-2 border rounded bg-gray-50"
          >
          <span class="ml-2">원</span>
        </div>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelApproveButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmApproveButton"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          승인
        </button>
      </div>
    </div>
  </div>

  <!-- 거절 확인 모달 -->
  <div id="rejectModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
      <h2 class="text-lg font-semibold mb-4">송금 거절</h2>
      <p>다음 기업에 대한 송금을 거절하시겠습니까?</p>
      <p id="rejectCompanyName" class="font-semibold mt-2"></p>
      <div class="mt-4">
        <label class="block text-sm font-medium mb-1">거절 사유</label>
        <textarea
          id="rejectReason"
          class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          rows="3"
          placeholder="거절 사유를 입력하세요"
        ></textarea>
      </div>
      <div class="flex justify-end space-x-2 mt-6">
        <button 
          id="cancelRejectButton"
          class="px-4 py-2 border rounded hover:bg-gray-100"
        >
          취소
        </button>
        <button 
          id="confirmRejectButton"
          class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
        >
          거절
        </button>
      </div>
    </div>
  </div>

  <script>
    // 상태 관리
    let approvals = [
      {
        id: 1,
        companyName: "(주)클라우드테크",
        contactPerson: "홍길동",
        project: "클라우드 보급사업",
        requestDate: "2025-06-20",
        amount: 500000,
        status: "승인 대기",
        hasOrderSheet: true
      },
      {
        id: 2,
        companyName: "데이터시스템즈",
        contactPerson: "김철수",
        project: "클라우드 보급사업",
        requestDate: "2025-06-18",
        amount: 800000,
        status: "승인 대기",
        hasOrderSheet: true
      }
    ];
    let selectedId = null;

    // DOM 요소
    const approvalTableBody = document.getElementById('approvalTableBody');
    const businessFilter = document.getElementById('businessFilter');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const approveButton = document.getElementById('approveButton');
    const rejectButton = document.getElementById('rejectButton');
    
    const approveModal = document.getElementById('approveModal');
    const approveCompanyName = document.getElementById('approveCompanyName');
    const approveAmount = document.getElementById('approveAmount');
    const cancelApproveButton = document.getElementById('cancelApproveButton');
    const confirmApproveButton = document.getElementById('confirmApproveButton');
    
    const rejectModal = document.getElementById('rejectModal');
    const rejectCompanyName = document.getElementById('rejectCompanyName');
    const rejectReason = document.getElementById('rejectReason');
    const cancelRejectButton = document.getElementById('cancelRejectButton');
    const confirmRejectButton = document.getElementById('confirmRejectButton');

    // 금액 포맷팅 함수
    function formatAmount(amount) {
      return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // 승인 목록 렌더링
    function renderApprovals() {
      const filteredApprovals = approvals.filter(approval => 
        approval.companyName.includes(searchInput.value) && 
        (businessFilter.value === "" || approval.project === businessFilter.value)
      );

      approvalTableBody.innerHTML = '';
      
      filteredApprovals.forEach(approval => {
        const tr = document.createElement('tr');
        tr.className = 'border-b hover:bg-gray-50';
        
        // 상태에 따른 스타일 
        let statusClass = 'bg-blue-100 text-blue-800';
        
        tr.innerHTML = `
          <td class="px-4 py-2">
            <input 
              type="radio" 
              name="select-approval" 
              value="${approval.id}" 
              ${selectedId === approval.id ? 'checked' : ''}
            >
          </td>
          <td class="px-4 py-2">${approval.companyName}</td>
          <td class="px-4 py-2">${approval.contactPerson}</td>
          <td class="px-4 py-2">${approval.project}</td>
          <td class="px-4 py-2">${approval.requestDate}</td>
          <td class="px-4 py-2 text-right">${formatAmount(approval.amount)}원</td>
          <td class="px-4 py-2">
            ${approval.hasOrderSheet 
              ? `<button class="text-blue-600 underline text-sm view-order" data-id="${approval.id}">주문서 보기</button>`
              : `<span class="text-gray-400 text-sm">없음</span>`
            }
          </td>
          <td class="px-4 py-2">
            <span class="px-2 py-1 rounded-full text-xs font-medium ${statusClass}">
              ${approval.status}
            </span>
          </td>
        `;
        
        approvalTableBody.appendChild(tr);
      });

      // 라디오 버튼 이벤트 리스너 추가
      document.querySelectorAll('input[name="select-approval"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          selectedId = parseInt(e.target.value);
        });
      });

      // 주문서 보기 버튼 이벤트 리스너
      document.querySelectorAll('.view-order').forEach(button => {
        button.addEventListener('click', (e) => {
          const id = parseInt(e.target.dataset.id);
          const approval = approvals.find(a => a.id === id);
          alert(`${approval.companyName}의 주문서 보기 기능은 아직 준비중입니다.`);
        });
      });
    }

    // 초기 렌더링
    renderApprovals();

    // 이벤트 리스너
    searchButton.addEventListener('click', () => {
      renderApprovals();
    });

    approveButton.addEventListener('click', () => {
      if (!selectedId) {
        alert('승인할 항목을 선택하세요.');
        return;
      }

      const approval = approvals.find(a => a.id === selectedId);
      if (!approval) return;

      approveCompanyName.textContent = approval.companyName;
      approveAmount.value = formatAmount(approval.amount);
      approveModal.classList.remove('hidden');
    });

    cancelApproveButton.addEventListener('click', () => {
      approveModal.classList.add('hidden');
    });

    confirmApproveButton.addEventListener('click', () => {
      const index = approvals.findIndex(a => a.id === selectedId);
      if (index !== -1) {
        approvals.splice(index, 1);
      }
      
      selectedId = null;
      approveModal.classList.add('hidden');
      renderApprovals();
      
      alert('송금이 승인되었습니다.');
    });

    rejectButton.addEventListener('click', () => {
      if (!selectedId) {
        alert('거절할 항목을 선택하세요.');
        return;
      }

      const approval = approvals.find(a => a.id === selectedId);
      if (!approval) return;

      rejectCompanyName.textContent = approval.companyName;
      rejectReason.value = '';
      rejectModal.classList.remove('hidden');
    });

    cancelRejectButton.addEventListener('click', () => {
      rejectModal.classList.add('hidden');
    });

    confirmRejectButton.addEventListener('click', () => {
      const reason = rejectReason.value.trim();
      if (!reason) {
        alert('거절 사유를 입력하세요.');
        return;
      }
      
      const index = approvals.findIndex(a => a.id === selectedId);
      if (index !== -1) {
        approvals.splice(index, 1);
      }
      
      selectedId = null;
      rejectModal.classList.add('hidden');
      renderApprovals();
      
      alert('송금이 거절되었습니다.');
    });
  </script>
</body>
</html>
